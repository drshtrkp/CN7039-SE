  L('L16', 'P3', 'Databases and the relational model', 'W4-5 S3 to S13', `
<p class="lead">Remember week 1: data goes through a process and becomes information. A database is where that data is stored.</p>
<div class="def"><b>Database</b>: "a collection of data"; "a large centralised shared data repository". Database = data + base. <span class="src">W4-5 S3</span></div>
<p>Databases can be non-electronic (billing receipts, a cabinet of application forms) or electronic (university student records, library book records, online search engines) (S4).</p>
<div class="def"><b>DBMS (database management system)</b>: software that manages the database. In a bank, ATMs, bank managers and online banking all reach the same data through the DBMS. The slide abbreviates it DBM or DBMs. <span class="src">W4-5 S5</span></div>
<p>Creating a database involves four things: <b>tables</b>, <b>queries</b>, <b>forms</b> and <b>reports</b> (S6).</p>
<h2>Tables, records, fields and data types <span class="thin">W4-5 S8 to S9</span></h2>
<div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Address</th><th>Phone</th><th>Age</th></tr></thead><tbody><tr><td>1</td><td>Fadi</td><td>London</td><td>384732</td><td>40</td></tr><tr><td>2</td><td>Mark</td><td>Bristol</td><td>232332</td><td>25</td></tr><tr><td class="muted">Number(2)</td><td class="muted">Text(20)</td><td class="muted">Text(50)</td><td class="muted">Number(14)</td><td class="muted">Number(2)</td></tr></tbody></table></div>
<ul><li><b>Table</b>: a set of records that have the same set of fields.</li><li><b>Record</b>: a set of fields with data about one related topic, person or item; a <b>row</b>.</li><li><b>Field</b>: one single item of data, a <b>column</b>, such as Address. A field has a format, its data type.</li><li><b>Data type</b>: the format the data is stored in: number, text, date, character, Boolean.</li><li><b>Data dictionary</b>: the collection of all the data types (the last row above); the logical structure of the information in a database (slide notes).</li></ul>
<h2>Relational databases <span class="thin">W4-5 S10 to S13</span></h2>
<p>A relational database stores data more efficiently and effectively, and finds information faster. In a relational database a table is called a <b>relation</b>, written as its name followed by its fields:</p>
<p class="mono">Student (<u>StudentID</u>, Name, City, Course)</p>
<p><b>Four characteristics of relations:</b></p>
<ol><li>The content of the table changes over time: data is added, updated and deleted.</li><li>Each attribute is <b>atomic</b>: each cell holds a single value.</li><li>All rows are distinct: no two identical rows.</li><li>One field uniquely identifies each row: the <b>primary key</b>.</li></ol>
<div class="trap"><h4>Atomic means one value</h4><p>A Phone cell holding "0207 111 2222, 07700 900123" breaks the atomic rule. Either keep one phone per row in a separate Phone table, or give separate fields (HomePhone, MobilePhone).</p></div>`);

  L('L17', 'P3', 'Primary keys, foreign keys and integrity', 'W4-5 S14 to S24', `
<p class="lead">Keys are what make a relational database relational. The primary key identifies a row; the foreign key links rows in different tables.</p>
<div class="def"><b>Primary key</b>: a field that uniquely identifies each row; usually underlined. If a table has only one unique key, that is the primary key; if it has more than one, choose one. <span class="src">W4-5 S13 to S14</span></div>
<p class="mono">Student (<u>StudentID</u>, Name, Civil_ID, Age, Address, Course)</p>
<p>Civil_ID is also unique, so it could have been the primary key; StudentID was chosen.</p>
<div class="def"><b>Foreign key</b>: an attribute in a relation that is not the primary key in that relation but is the primary key in another relation. Foreign keys link tables together and are the most important part of relational modelling. <span class="src">W4-5 S16</span></div>
<h2>Why foreign keys matter: the library example <span class="thin">W4-5 S17 to S19</span></h2>
<p>A first design copies the student's details into every loan:</p>
<p class="mono">Bookloan (LoanID, Date, Period, Name, Address, Course, Return_date)</p>
<p>This causes duplication, data redundancy and errors. In the slide, Martin moves from Edinburgh to Glasgow and updates his address at reception, but the library's loan records still hold the old address.</p>
<p><b>Solution:</b> store only a foreign key that points to the student's record.</p>
<div class="two"><div><p class="mono">Bookloan (<u>LoanID</u>, Date, Period, <i>Student_ID</i>)</p><table><thead><tr><th>LoanID</th><th>Date</th><th>Student_ID</th></tr></thead><tbody><tr><td>101</td><td>01/01/14</td><td>2</td></tr><tr><td>102</td><td>02/01/14</td><td>3</td></tr><tr><td>103</td><td>02/01/14</td><td>2</td></tr></tbody></table></div><div><p class="mono">Student (<u>StudentID</u>, Name, Address, Course)</p><table><thead><tr><th>ID</th><th>Name</th><th>Address</th></tr></thead><tbody><tr><td>2</td><td>Martin</td><td>Glasgow</td></tr><tr><td>3</td><td>Khalil</td><td>Bristol</td></tr></tbody></table></div></div>
<p>Now the library always reads Martin's current address through Student_ID.</p>
<div class="eg"><h4>W4-5 S20</h4><p class="mono">Student (<u>StudentID</u>, Name, Civil_ID, Age, Address, Course)<br>Book (Title, Author, Subject, Category, <u>ISBN</u>)<br>BookLoan (<u>LoanID</u>, <i>StudentID</i>, <i>ISBN</i>, Date, Period, Penalty)</p><p>Primary keys underlined; StudentID and ISBN in BookLoan are foreign keys.</p></div>
<!--page-->
<h2>Integrity principles <span class="thin">W4-5 S22 to S24</span></h2>
<div class="def"><b>Entity integrity</b>: primary keys cannot have repetitions or null values.</div>
<div class="def"><b>Referential integrity</b>: concerns the link between tables made by primary and foreign keys: you cannot have a foreign key value that does not exist in the original table.</div>
<div class="eg"><h4>Khalil drops out (W4-5 S23 to S24)</h4><p>Deleting Khalil (StudentID 3) would leave loan 102 pointing to nobody. The slide's referential integrity option ensures that deleting Khalil also deletes his records in other tables. † Database systems also offer the opposite option: refuse the deletion while related loans exist.</p></div>
<div class="tip"><h4>Placing a foreign key</h4><p>In a one-to-many relationship the foreign key always goes in the table on the <b>many</b> side. One student has many loans, so StudentID goes into BookLoan, never a LoanID into Student.</p></div>
<div class="trap"><h4>A foreign key need not be unique</h4><p>Student_ID 2 appears twice in Bookloan above. That is correct: Martin has two loans. Only primary keys must be unique.</p></div>`);

  L('L18', 'P3', 'ERD notation: entities, relationships, optionality and cardinality', 'W4-5 S25 to S37, S48 to S50', `
<p class="lead">An entity relationship diagram (ERD) designs the database before it is built. It shows entities (tables), relationships (links) and attributes (fields).</p>
<p><b>Why model?</b> Modelling helps you understand users' needs, detect missing data, detect problems before implementation and improve the design (W4-5 S26).</p>
<div class="def"><b>Entity</b>: a thing of independent existence on which you may wish to hold data, such as an Employee or a Department. <span class="src">W4-5 S28</span></div>
<div class="def"><b>Relationship</b>: an interaction (connection) that exists between entities. Name it with a verb, ideally one word, and make it clear: "A student enrols in a Programme. A Programme has students." <span class="src">W4-5 S28, S30</span></div>
<div class="def"><b>Attribute</b>: a descriptive property or characteristic of an entity. A <b>compound attribute</b> consists of other attributes (Address = street, city, postcode). <span class="src">W4-5 S48</span></div>
<div class="trap"><h4>Ovals or boxes?</h4><p>W4-5 S29 says entities are squares, relationships are links and attributes are ovals (the Chen style). Every worked ERD from S35 onwards uses crow's foot boxes with attributes listed inside. Draw crow's foot boxes unless the question asks for ovals; the lab answer sheet says you may present the diagram your way if you explain your scenario.</p></div>
<h2>Optionality and cardinality <span class="thin">W4-5 S31 to S34</span></h2>
<div class="def"><b>Optionality</b>: the <b>minimum</b> number of instances of the related entity. <b>Cardinality</b>: the <b>maximum</b> number of instances of the related entity.</div>
<p>At each end of the line, the symbol nearer the entity box is the maximum (cardinality); the symbol further out is the minimum (optionality).</p>
<figure data-dg="erd-ends"><figcaption>The four crow's foot ends (W4-5 S34, S50). A bar means one, a circle means zero, a crow's foot means many.</figcaption></figure>
<!--page-->
<h2>Reading a relationship</h2>
<p>To read a relationship, start at one entity, read the verb, then read the symbol at the <b>far</b> end. Then do the same from the other side.</p>
<figure data-dg="erd-student"><figcaption>W4-5 S33 to S35 drawn out. "A Student enrols in one and only one Programme. A Programme has one or many Students. A Lecturer teaches zero or many Programmes. A Programme is taught by one or many Lecturers."</figcaption></figure>
<div class="eg"><h4>Employee, Department, Project (W4-5 S36 to S37)</h4><p>An Employee belongs to one and only one Department. A Department can have one to many Employees. An Employee works on zero to many Projects. A Project has one to many Employees.</p></div>
<figure data-dg="erd-emp"><figcaption>The Employee to Project link is many-to-many. The next lesson shows why it must be resolved.</figcaption></figure>
<div class="tip"><h4>Write the sentences first</h4><p>For every relationship, write both sentences ("Each A … one or many B"; "Each B … exactly one A") before drawing. The words "each", "at least", "may" and "must" map straight onto the symbols: "may" is a circle, "must" is a bar.</p></div>`);

  L('L19', 'P3', 'Many-to-many, associative entities, keys and generalisation', 'W4-5 S38 to S58', `
<p class="lead">A many-to-many relationship cannot be implemented directly in a database. At ERD level, you must resolve it (W4-5 S39).</p>
<h2>Why many-to-many fails <span class="thin">W4-5 S40</span></h2>
<p>Employee (ID, Name, Address, Grade) and Project (ID, Type, Date, Budget). Fadi works on projects 05, 06 and 07. Where would you store that? A single ProjID field in Employee holds only one value (atomic), and a single EmpID in Project holds only one employee.</p>
<h2>The solution: an associative entity <span class="thin">W4-5 S41, S51</span></h2>
<div class="def"><b>Associative entity</b>: an entity that inherits its primary key from more than one other entity (its parents). Each part of that concatenated key points to one and only one instance of each connecting entity.</div>
<figure data-dg="erd-mn-fixed"><figcaption>Proj_Emp sits between Employee and Project. Each row records one employee on one project: (101, 05), (101, 06), (101, 07), (103, 05), (103, 06). The slide's table gives Proj_Emp its own ID column as well; a key made of both foreign keys does the same job.</figcaption></figure>
<p>The many-to-many line is replaced by two one-to-many lines, with the crow's feet pointing at the associative entity.</p>
<div class="eg"><h4>Customer, Order, Inventory (W4-5 S43 to S46)</h4><p>An Order contains many Inventory items and an item appears on many Orders. The slides first add "Order-Inventory", then rename it <b>Ordered Inventory</b>: give the associative entity a meaningful business name. The verb of a many-to-many relationship often suggests it (S55).</p></div>
<figure data-dg="erd-order"><figcaption>The same pattern with products: Ordered product resolves the Order to Product many-to-many and holds Quantity, which belongs to neither parent alone.</figcaption></figure>
<!--page-->
<h2>Keys in data modelling <span class="thin">W4-5 S49</span></h2>
<table class="cmp"><thead><tr><th>Term</th><th>Meaning</th><th>Also called</th></tr></thead><tbody>
<tr><td>Key</td><td>An attribute or group of attributes with a unique value for each entity instance</td><td>Identifier</td></tr>
<tr><td>Primary key</td><td>The candidate key chosen to identify a single instance</td><td></td></tr>
<tr><td>Concatenated key</td><td>A group of attributes that together identify an instance</td><td>Composite key, compound key</td></tr>
<tr><td>Candidate key</td><td>Any key that could serve as the primary key</td><td>Candidate identifier</td></tr>
<tr><td>Alternate key</td><td>A candidate key not chosen as primary</td><td>Secondary key</td></tr></tbody></table>
<h2>Other relationship types <span class="thin">W4-5 S52 to S54</span></h2>
<div class="def"><b>Recursive relationship</b>: a relationship between instances of the same entity. The slide's example is a course that is a prerequisite for another course.</div>
<figure data-dg="erd-recursive"><figcaption>A one-to-many recursive relationship: an employee manages zero or many employees and is managed by zero or one. ManagerID is a foreign key to the same table.</figcaption></figure>
<div class="def"><b>Strong entities</b>: entities in a relationship where each has its own independent primary key; primary key attributes are not shared.</div>
<div class="def"><b>Many-to-many relationship</b>: many instances of one entity are associated with many instances of another. It must be resolved, generally with an associative entity. The textbook calls these nonspecific relationships.</div>
<h2>Generalisation in ERDs <span class="thin">W4-5 S57 to S58</span></h2>
<div class="def"><b>Generalisation</b>: attributes common to several types of an entity are grouped into their own entity. <b>Supertype</b>: holds the attributes common to its subtypes. <b>Subtype</b>: inherits the supertype's common attributes and adds its own.</div>
<figure data-dg="erd-gen"><figcaption>Person is the supertype; Student and Staff are subtypes that share Person's key. Generalisation works the same way in use case and class diagrams.</figcaption></figure>`);

  L('L20', 'P3', 'Building an ERD step by step; the data dictionary', 'W4-5 S59 to S67', `
<p class="lead">The slides build an ERD in four stages, each adding detail, after asking a set of discovery questions.</p>
<h2>Discovery questions <span class="thin">W4-5 S59</span></h2>
<table class="cmp"><thead><tr><th>Purpose</th><th>Ask</th></tr></thead><tbody>
<tr><td>Entities</td><td>What are the subjects of the business?</td></tr>
<tr><td>Keys</td><td>What uniquely distinguishes one instance of each subject from the others?</td></tr>
<tr><td>Subsets</td><td>Do any characteristics divide a subject's instances into useful groups?</td></tr>
<tr><td>Attributes and domains</td><td>What describes each subject?</td></tr>
<tr><td>Security and control</td><td>Who may see or use the data?</td></tr>
<tr><td>Timing</td><td>How often does the data change?</td></tr>
<tr><td>Generalisation</td><td>Are all instances of each subject the same?</td></tr>
<tr><td>Relationships</td><td>What events imply associations between subjects?</td></tr>
<tr><td>Cardinalities</td><td>Is each business event handled the same way, or are there special cases?</td></tr></tbody></table>
<h2>The four stages <span class="thin">W4-5 S61 to S64</span></h2>
<ol class="steps"><li><b>Context data model</b>: entities and named relationships only, many-to-many allowed.</li><li><b>Key-based data model</b>: resolve many-to-many relationships; add primary and foreign keys.</li><li><b>Key-based model with generalisations</b>: add supertypes and subtypes.</li><li><b>Fully attributed model</b>: add every remaining attribute.</li></ol>
<div class="eg"><h4>A library, from stage 1 to stage 4</h4><p>Members borrow books. A library owns several copies of each book; each loan is of one copy, to one member, with a due date.</p></div>
<figure data-dg="erd-lib-context"><figcaption>Stage 1: Member borrows Book, many-to-many.</figcaption></figure>
<figure data-dg="erd-lib-full"><figcaption>Stage 4: Loan resolves the many-to-many and holds the dates; Copy separates a physical copy from the Book title. Foreign keys sit on the many side.</figcaption></figure>
<!--page-->
<h2>The data dictionary <span class="thin">W4-5 S65 to S67 (optional on the slides)</span></h2>
<div class="def"><b>Data type</b>: the property of an attribute that says what kind of data it can store. <b>Domain</b>: the values an attribute can legitimately take. <b>Default value</b>: the value recorded if the user does not enter one.</div>
<table class="cmp"><thead><tr><th>Logical data type</th><th>Business meaning</th><th>Example domain</th></tr></thead><tbody>
<tr><td>NUMBER</td><td>Any number, real or integer</td><td>{10–99}</td></tr>
<tr><td>TEXT</td><td>Characters, including digits not used for arithmetic</td><td>Text(30)</td></tr>
<tr><td>MEMO</td><td>Text of indeterminate length, such as notes</td><td></td></tr>
<tr><td>DATE / TIME</td><td>Any date or time</td><td>MMDDYYYY; HHMM</td></tr>
<tr><td>YES/NO</td><td>One of two values</td><td>{YES, NO}</td></tr>
<tr><td>VALUE SET</td><td>A finite set of coded values</td><td>{M = Male, F = Female}</td></tr>
<tr><td>IMAGE</td><td>Any picture</td><td></td></tr></tbody></table>
<p><b>Default values:</b> a legal value from the domain (such as 0); NONE or NULL (leave blank); or REQUIRED / NOT NULL (the user must enter a value).</p>
<div class="tip"><h4>Phone numbers</h4><p>The example table on W4-5 S9 stores Phone as Number(14). By the definition on S65, TEXT is the better choice: a phone number is never used in arithmetic and may start with 0. If you are asked, choose TEXT and give that reason.</p></div>`);

  L('L21', 'P4', 'DFD symbols: entities, processes, stores and flows', 'W6 S3 to S13', `
<p class="lead">A data flow diagram shows how data moves through a business system: where it comes from, what processes transform it, where it rests and where it goes.</p>
<div class="def"><b>Data flow diagram (DFD)</b>: a process model and a formal way of representing how a business system operates. It illustrates the processes or activities performed and how data moves among them, from input to file storage to report generation. <span class="src">W6 S3</span></div>
<figure data-dg="dfd-symbols"><figcaption>All four DFD symbols as the lecturer draws them (W6 S4): an external entity (oval), a process (box with a top strip), a data store (open-ended box) and labelled data flows (arrows).</figcaption></figure>
<h2>1 · Process <span class="thin">W6 S5 to S6</span></h2>
<p>Processes are the individual tasks which, completed in sequence, fulfil the system's overall goal. <b>Processes transform input into output</b>: a process receives data and produces output with a different content or form. It may be as simple as saving input in a database or as complex as a monthly sales report for every store in a region.</p>
<p>Draw it as a box with a top strip: the <b>sequence number</b> on the left, the <b>person or place responsible</b> on the right, and below, <b>what will happen</b>, which must start with a verb. The details of a process are not shown on the DFD; they go in a process description in the data dictionary.</p>
<h2>2 · Data flow <span class="thin">W6 S7, S9</span></h2>
<p>A data flow shows that data, in the form of documents, phone calls and so on, is moving: from an external entity to a process or back; from one process to another; from a process to a store or back. Label every flow with the data it carries, as a noun. <b>Rename a flow</b> when its content changes on the way through a process.</p>
<figure data-dg="dfd-s9"><figcaption>W6 S9: "order" goes in, "new_order" comes out because the clerk's validation has changed it, and "part_number" is read from the Stock store.</figcaption></figure>
<!--page-->
<h2>3 · Data store <span class="thin">W6 S10 to S11</span></h2>
<p>Data stores hold the data a process needs in order to be completed. They show where data is <b>resting</b> in the system. Each has a description and a number: D1, D2, D3 for computer data; M1, M2, M3 for manual files. An arrow from a process to a store writes data to it; an arrow from a store to a process reads data from it.</p>
<h2>4 · External entity <span class="thin">W6 S13</span></h2>
<p>External entities exist in the system's environment and either provide data to it (<b>sources</b>) or receive data from it (<b>sinks</b>). They sit outside the boundary and show how the system interacts with the outside world: usually people, places, departments or organisations. An external entity must be connected to a process through a data flow.</p>
<div class="trap"><h4>Ovals or squares for external entities?</h4><p>The lecturer's notation slides (W6 S4, S13) and the tap-on attendance answer draw external entities as ovals. Some textbook figures on the same slides use shadowed squares. Use ovals, as the lecturer does, and stay consistent.</p></div>
<table class="cmp"><thead><tr><th>Symbol</th><th>Shape here</th><th>Named with</th><th>Numbered</th></tr></thead><tbody>
<tr><td>External entity</td><td>Oval</td><td>Noun (Customer, Bank)</td><td>No</td></tr>
<tr><td>Process</td><td>Box with top strip</td><td>Verb phrase (Validate order)</td><td>1, 2, 3 … then 2.1, 2.2</td></tr>
<tr><td>Data store</td><td>Open-ended box</td><td>Noun, often plural (Orders)</td><td>D1, D2 or M1, M2</td></tr>
<tr><td>Data flow</td><td>Arrow</td><td>Noun phrase (order details)</td><td>No</td></tr></tbody></table>`);

  L('L22', 'P4', 'DFD rules and the errors examiners look for', 'W6 S8, S12, S14 to S16, S41 to S42', `
<p class="lead">Most DFD marks are lost on illegal connections and on processes that cannot work. Learn the rules as a checklist.</p>
<h2>Processes that cannot work <span class="thin">W6 S8</span></h2>
<figure data-dg="dfd-holes"><figcaption>Three faulty processes. Process 1 is a miracle, process 2 a sinkhole and process 3 impossible.</figcaption></figure>
<table class="cmp"><thead><tr><th>Error on the slide</th><th>Other name</th><th>What is wrong</th></tr></thead><tbody>
<tr><td>Miracle</td><td>Spontaneous generation</td><td>A process with outputs but no inputs: data appears from nowhere.</td></tr>
<tr><td>Sinkhole</td><td>Black hole</td><td>A process with inputs but no outputs: data goes in and never comes out.</td></tr>
<tr><td>Impossible</td><td>Grey hole</td><td>The inputs cannot produce the outputs, such as calculating a final grade from a date of birth.</td></tr></tbody></table>
<h2>Connections that are not allowed <span class="thin">W6 S12, S14 to S15</span></h2>
<figure data-dg="dfd-illegal"><figcaption>All three flows here are illegal: entity to entity, store to store and entity to store. Each needs a process between.</figcaption></figure>
<ul><li><b>Store to store</b>: "databases cannot talk to each other". A process must move the data.</li><li><b>Entity to entity</b>: "need a process between two entities". If two outsiders talk without the system, it is not part of the system.</li><li><b>Entity to store or store to entity</b>: "need a process between database and entity".</li><li><b>Wrong verb</b>: the process name must match what happens to the data ("the action is different from what is happening"). A process called Calculate grade that writes to Grades should be Calculate and save grade.</li></ul>
<!--page-->
<h2>Legal connections</h2>
<table class="cmp"><thead><tr><th>From \\ To</th><th>Process</th><th>Data store</th><th>External entity</th></tr></thead><tbody>
<tr><td>Process</td><td>Allowed</td><td>Allowed (write)</td><td>Allowed</td></tr>
<tr><td>Data store</td><td>Allowed (read)</td><td><b>Not allowed</b></td><td><b>Not allowed</b></td></tr>
<tr><td>External entity</td><td>Allowed</td><td><b>Not allowed</b></td><td><b>Not allowed</b></td></tr></tbody></table>
<div class="tip"><h4>Every flow touches a process</h4><p>One rule covers all three bans: <b>every data flow must start or end at a process</b>. When spotting errors, check every arrow for a process at one end.</p></div>
<h2>Error-spotting method</h2>
<ol class="steps"><li>Check every process has at least one input and one output, and that the outputs could come from the inputs.</li><li>Check every flow has a process at one end.</li><li>Check every process name starts with a verb and matches what happens.</li><li>Check every flow is labelled, and renamed if its data changes.</li><li>Check every store is numbered and is both written and read somewhere.</li><li>Check every process has a clear trigger: an external entity or a store providing its input.</li></ol>
<p>The tutorial answer sheet adds a marker's note: "As long as the process makes sense, you can give them the grade for it." Clear, logical processes matter more than one exact layout.</p>`);

  L('L23', 'P4', 'Levelling: context, Level 0, Level 1 and balancing', 'W6 S19 to S31, S34 to S40', `
<p class="lead">Putting every process on one diagram makes it cluttered and hides what each process does. Levelling breaks the system down step by step (W6 S19).</p>
<figure data-dg="dfd-levels"><figcaption>W6 S21: the context diagram explodes into Level 0; any Level 0 process can explode into its own Level 1 diagram.</figcaption></figure>
<ol class="steps">
<li><b>Context diagram</b>: the whole system as one process, numbered 0, with its external entities and the flows between them. Its purpose is to identify the interfaces between external entities and the system, at a high level (S24).</li>
<li><b>Level 0 diagram</b>: the system as a few processes, between 3 and 6, numbered 1, 2, 3, showing how data enters, how processes transform it and how it leaves. Data stores appear here (S26).</li>
<li><b>Level 1 diagrams</b>: one Level 0 process exploded into sub-processes numbered 2.1, 2.2, 2.3.</li>
<li><b>Level 2, 3 …</b>: continue until each process is a <b>functional primitive</b>: a single business function such as add or delete (S20).</li></ol>
<div class="trap"><h4>Level names differ between books</h4><p>Many textbooks call the context diagram Level 0 and the first breakdown Level 1. This lecturer uses <b>Context → Level 0 → Level 1</b>. The hotel answer on W6 S36 numbers its processes 0.1 to 0.6; S26 says Level 0 processes are numbered 1, 2, 3. Follow S26.</p></div>
<h2>Balancing <span class="thin">W6 S26 to S28</span></h2>
<div class="def"><b>Balancing</b>: a Level 0 diagram must have the same inputs and outputs as its context diagram. A child diagram must match the flows into and out of its parent process.</div>
<!--page-->
<h2>Worked example: a gym membership system</h2>
<div class="story"><p>Members apply to join and receive a membership card. Members book classes and receive a booking confirmation. Each week the gym manager receives an attendance report.</p></div>
<figure data-dg="dfd-gym-ctx"><figcaption>Context diagram: one process, two external entities, five flows.</figcaption></figure>
<figure data-dg="dfd-gym-l0"><figcaption>Level 0: three processes and two stores. The five flows crossing the boundary are exactly those on the context diagram, so the two diagrams balance.</figcaption></figure>
<h2>Method <span class="thin">W6 S30 to S31, S37 to S40</span></h2>
<div class="two"><div><p><b>Context diagram</b></p><ol><li>Read the case several times.</li><li>List the external entities.</li><li>List the flows from each entity into the system.</li><li>List the flows from the system to each entity.</li><li>Draw it.</li></ol></div><div><p><b>Level 0</b></p><ol><li>Take one sentence at a time and look for verbs: candidate processes.</li><li>List the data flows.</li><li>List the data stores ("how else would the receptionist check rooms?").</li><li>Draw with correct notation.</li><li>Walk through it to spot anything missing; explode a process further if needed.</li></ol></div></div>
<p>The hotel case on W6 S37 to S39 follows exactly this: identify the steps, then the external entities (guest, receptionist, manager), then guess the stores (Room details, Guest details, Booking details).</p>`);

  L('L24', 'P4', 'Logical and physical DFDs', 'W6 S32 to S33; W7-8 S54; Lab 9', `
<p class="lead">Logical and physical DFDs model the same system for different readers.</p>
<div class="def"><b>Logical DFD</b>: describes the flow of data through a system to perform certain functions of a business. <b>Physical DFD</b>: describes how that logical flow is implemented through specific methods. <span class="src">W6 S32</span></div>
<div class="def"><b>Physical DFD</b> (W6 S33): a process model used to communicate the technical implementation characteristics of an information system, and the technical choices and design decisions, to those who will construct and implement it.</div>
<figure data-dg="dfd-logical"><figcaption>Logical: what happens, with no technology named.</figcaption></figure>
<figure data-dg="dfd-physical"><figcaption>Physical: the same process showing who and what implements it, such as a tablet point-of-sale app and a MySQL table. Lab 9's sample physical DFD names MS SQL and Sage Accounting in the same way.</figcaption></figure>
<table class="cmp"><thead><tr><th></th><th>Logical DFD</th><th>Physical DFD</th></tr></thead><tbody>
<tr><td>Question it answers</td><td>What does the business do with its data?</td><td>How will the system do it?</td></tr>
<tr><td>Audience</td><td>Users, owners, analysts</td><td>Designers and builders</td></tr>
<tr><td>Process names</td><td>Business actions (Take order)</td><td>Include technology or method (Key order into POS screen)</td></tr>
<tr><td>Data stores</td><td>Business data (Orders)</td><td>Real files, tables, databases (Orders table in MySQL)</td></tr>
<tr><td>Life-cycle stage</td><td>Analysis</td><td>Design</td></tr></tbody></table>
<div class="tip"><h4>Weeks 9 and 10</h4><p>The physical DFD and system implementation plan continue in weeks 9 and 10, whose slides are not in this book yet. Lab 9 asks how a physical DFD relates to the logical DFD and to the application architecture, and what the layers of a system are. Upload those slides and this lesson will be extended.</p></div>`);

  L('L25', 'P5', 'Objects, classes, instances and encapsulation', 'W7-8 S3 to S10', `
<p class="lead">Object modelling describes a system as the things in it, what each thing knows (attributes) and what each can do (behaviour).</p>
<div class="def"><b>Object</b>: something of independent existence for which it has attributes and actions (W7-8 S3); something that is or can be seen, touched or otherwise sensed, about which users store data and associate behaviour: a person, place, thing or event (S5).</div>
<div class="def"><b>Object modelling</b>: a technique for identifying objects within the system's environment and the relationships between them. <b>Object-oriented analysis (OOA)</b>: studying existing objects to see if they can be used or reused, and defining new or modified objects useful to a business application. <span class="src">W7-8 S3</span></div>
<div class="def"><b>Attribute</b>: the data that represents characteristics of interest about an object. <span class="src">S5</span></div>
<div class="def"><b>Object instance</b>: each specific person, place, thing or event, with the values of its attributes. An instance is an example of the object. <span class="src">S6</span></div>
<div class="def"><b>Behaviour</b>: the set of things the object can do, or that can be done to it (or its attributes); also called a method, operation or service. <b>Encapsulation</b>: packaging several items together into one unit. <span class="src">S7</span></div>
<div class="def"><b>Class</b>: a set of objects that share common attributes and behaviour. Modelled with the class diagram. <span class="src">S8</span></div>
<figure data-dg="cls-one"><figcaption>W7-8 S8: a class box has three compartments: name, attributes, methods.</figcaption></figure>
<p>Slide S9 shows the idea with cars: <b>Car</b> is the class, a dotted outline; the Mercedes, BMW and Audi are objects of that class.</p>
<figure data-dg="cls-vis"><figcaption>W7-8 S10. Left: a class with attributes and behaviours. Right: one object instance, written instanceName : ClassName, with attribute values and no methods compartment.</figcaption></figure>
<div class="tip"><h4>Visibility signs</h4><p>S10 prefixes attributes with − and methods with + without explaining them. In UML − means private (only the class itself can use it) and + means public. Hiding attributes behind public methods is encapsulation in practice.</p></div>
<div class="trap"><h4>Class versus object</h4><p>Class = the template (Student). Object = one instance with values (Sarah, StudentID 1). Exam answers that use the two words interchangeably lose the mark.</p></div>`);

  L('L26', 'P5', 'Inheritance, generalisation and polymorphism', 'W7-8 S13 to S16, S24', `
<p class="lead">Generalisation lets common attributes and behaviour be written once in a parent class and inherited by every child.</p>
<div class="def"><b>Inheritance</b>: methods and/or attributes defined in an object class can be inherited or reused by another object class. Also called generalisation. <span class="src">W7-8 S13</span></div>
<div class="def"><b>Generalisation</b>: attributes and behaviours common to several object classes are grouped (abstracted) into their own class, the supertype. <span class="src">S16</span></div>
<div class="def"><b>Supertype</b>: a class that contains attributes and behaviours common to one or more subtypes; also called an abstract or parent class. <b>Subtype</b>: a class that inherits from a supertype and may add its own attributes and behaviours; also called a child class, and a concrete class if it is at the lowest level of the hierarchy. <span class="src">S16</span></div>
<figure data-dg="cls-gen"><figcaption>W7-8 S13 to S15: Student and Teacher inherit lastName, firstName, birthdate, gender and walk(), talk(), sleep(), eat() from Person. The arrowhead marks the generalisation and points at the supertype.</figcaption></figure>
<p>A Student object therefore has six attributes and six behaviours: four of each inherited, plus GPA, classification, enrol() and displayGPA() (S14).</p>
<h2>Polymorphism and override <span class="thin">W7-8 S24</span></h2>
<div class="def"><b>Polymorphism</b>: different objects can respond to the same message in different ways. <b>Override</b>: a subclass uses an attribute or behaviour of its own instead of the one inherited from the superclass.</div>
<figure data-dg="cls-poly"><figcaption>W7-8 S24: every Employee can computePay(). PartTimeEmployee overrides it with computePay(hours), so the same "compute pay" message gives different behaviour for each kind of employee.</figcaption></figure>
<div class="trap"><h4>Triangle direction</h4><p>The hollow triangle touches the parent. "Student is a Person": the arrow goes from Student up to Person. The same rule holds for use case and ERD generalisation.</p></div>`);

  L('L27', 'P5', 'Associations, multiplicity, aggregation and composition', 'W7-8 S17 to S23, S28', `
<p class="lead">Class relationships follow exactly the same principles as ERD relationships (W7-8 S17), with UML multiplicity numbers in place of crow's feet.</p>
<div class="def"><b>Association</b>: a relationship that exists between one or more objects and classes. <span class="src">S17</span></div>
<figure data-dg="cls-assoc"><figcaption>W7-8 S17: a Customer places zero or many Orders; each Order is placed by exactly one Customer.</figcaption></figure>
<div class="def"><b>Multiplicity</b>: the minimum and maximum number of occurrences of one object or class for a single occurrence of the related object or class. 1 for one, 0 for zero, * for many. <span class="src">S18</span></div>
<table class="cmp"><thead><tr><th>Multiplicity</th><th>UML</th><th>Example from W7-8 S18</th></tr></thead><tbody>
<tr><td>Exactly one</td><td>1 (or 1..1)</td><td>An employee works for one and only one department.</td></tr>
<tr><td>Zero or one</td><td>0..1</td><td>An employee has either one or no spouse.</td></tr>
<tr><td>Zero or more</td><td>0..* or *</td><td>A customer can make no payment or many payments.</td></tr>
<tr><td>One or more</td><td>1..*</td><td>A university offers at least one course, up to many.</td></tr>
<tr><td>Specific range</td><td>7..9</td><td>A team has 7, 8 or 9 games scheduled.</td></tr></tbody></table>
<!--page-->
<h2>Aggregation and composition <span class="thin">W7-8 S22 to S23</span></h2>
<div class="def"><b>Aggregation</b>: a larger "whole" class contains one or more smaller "part" classes; conversely a part is part of a whole. Drawn with a hollow diamond at the whole.</div>
<figure data-dg="cls-agg"><figcaption>W7-8 S22: a Team aggregates 12 to 18 Players. A player exists without the team and may play for several teams.</figcaption></figure>
<div class="trap"><h4>"Dropped" in UML 2.0?</h4><p>S22 says the aggregation notation was dropped in UML 2.0. UML 2 renamed it shared aggregation and still draws the hollow diamond. If aggregation fits a question, draw the hollow diamond.</p></div>
<div class="def"><b>Composition</b>: a type of aggregation where the whole is responsible for creating and destroying its parts. If the whole dies, the part dies with it; the relationship is a must. Drawn with a filled diamond at the whole.</div>
<figure data-dg="cls-comp"><figcaption>W7-8 S23: a Book is composed of a cover, chapters and an index; a Chapter is composed of pages. Delete the book and its chapters go with it.</figcaption></figure>
<table class="cmp"><thead><tr><th></th><th>Association</th><th>Aggregation</th><th>Composition</th></tr></thead><tbody>
<tr><td>Meaning</td><td>Objects are linked</td><td>Whole has parts</td><td>Whole owns parts</td></tr>
<tr><td>Can the part exist alone?</td><td>Yes</td><td>Yes</td><td>No: it dies with the whole</td></tr>
<tr><td>Symbol</td><td>Plain line</td><td>Hollow diamond at the whole</td><td>Filled diamond at the whole</td></tr>
<tr><td>Example</td><td>Customer places Order</td><td>Team and Player</td><td>Book and Chapter</td></tr></tbody></table>
<h2>The car rental case <span class="thin">Activities 7.1 to 7.3</span></h2>
<figure data-dg="cls-car"><figcaption>One possible answer combining the activities: Person generalises Customer and Manager, a manager manages one branch, cars are based at a branch, customers rent cars. The lecturer's own version is on W7-8 S20 and S28.</figcaption></figure>
<p>Activity 7.3 asks whether car components or parking lots in branches suggest aggregation or composition. Think in terms of lifetime: an engine can be removed and fitted to another car (aggregation); a parking bay cannot exist without its branch's car park (composition).</p>`);

  L('L28', 'P5', 'Other UML diagrams: activity and sequence (theory only)', 'W7-8 S25 to S27, S31, S36 to S48', `
<p class="lead">You are told these will not be drawing questions, but you must know what each diagram is for and recognise its notation.</p>
<h2>The 13 UML 2.0 diagrams <span class="thin">W7-8 S25 to S27</span></h2>
<table class="cmp"><thead><tr><th>Diagram</th><th>What it depicts</th></tr></thead><tbody>
<tr><td>Use case</td><td>Interactions between the system and its users and external systems; who uses it and how. Narratives add the steps.</td></tr>
<tr><td>Activity</td><td>The sequential flow of activities of a use case or business process; can model logic.</td></tr>
<tr><td>Class</td><td>The system's object structure: classes and their relationships.</td></tr>
<tr><td>Object</td><td>Actual object instances with current attribute values: a snapshot at one point in time.</td></tr>
<tr><td>State machine</td><td>How events change an object's state over its lifetime: states and transitions.</td></tr>
<tr><td>Composite structure</td><td>The internal structure of a class, component or use case.</td></tr>
<tr><td>Sequence</td><td>How objects interact via messages, and in what order, in a use case or operation.</td></tr>
<tr><td>Communication</td><td>Object interaction via messages, focused on structural organisation (collaboration diagram in UML 1.x).</td></tr>
<tr><td>Interaction overview</td><td>Combines sequence and activity diagrams to show interaction within each activity.</td></tr>
<tr><td>Timing</td><td>Timing constraints on state changes; useful for embedded software.</td></tr>
<tr><td>Component</td><td>How code is divided into components and how they interact.</td></tr>
<tr><td>Deployment</td><td>How software components sit on the hardware "nodes".</td></tr>
<tr><td>Package</td><td>How classes and other constructs are organised into packages, and their dependencies.</td></tr></tbody></table>
<p><b>The process of object modelling (S31):</b> model the functions of the system (use cases); find and identify the business objects; organise the objects and identify their relationships.</p>
<!--page-->
<h2>Activity diagrams <span class="thin">W7-8 S36 to S40</span></h2>
<p>Used to depict the flow of a business process, the steps of a use case, or the logic of an object's method. Only important use cases are broken down this way.</p>
<figure data-dg="act-mini"><figcaption>The main activity diagram symbols in one small order-handling example.</figcaption></figure>
<table class="cmp"><thead><tr><th>Symbol</th><th>Meaning</th></tr></thead><tbody>
<tr><td>Initial node</td><td>Solid circle: the start of the process.</td></tr>
<tr><td>Action</td><td>Rounded rectangle: one step.</td></tr>
<tr><td>Flow</td><td>Arrow showing progression; labelled only when leaving a decision.</td></tr>
<tr><td>Decision</td><td>Diamond, one flow in, two or more out, each marked with its condition.</td></tr>
<tr><td>Merge</td><td>Diamond, several flows in, one out: rejoins paths split by a decision.</td></tr>
<tr><td>Fork</td><td>Black bar, one flow in, several out: parallel actions in any order.</td></tr>
<tr><td>Join</td><td>Black bar, several in, one out: all parallel actions must finish first.</td></tr>
<tr><td>Activity final</td><td>Solid circle inside a hollow circle: the end.</td></tr>
<tr><td>Subactivity indicator</td><td>A rake symbol in an action: broken out in a separate diagram.</td></tr>
<tr><td>Connector</td><td>Letter in a circle: the flow jumps to the matching letter.</td></tr></tbody></table>
<p>Partitions (swimlanes) group actions by who performs them. Guidelines (S40): one initial node; partitions if relevant; an action per major step; flows between them; decisions brought back together with merges; forks and joins for parallel work; one activity final.</p>
<!--page-->
<h2>System sequence diagrams <span class="thin">W7-8 S42 to S47</span></h2>
<div class="def"><b>System sequence diagram</b>: depicts the interaction between an actor and the system for one use case scenario; it helps identify the high-level messages that enter and exit the system.</div>
<figure data-dg="seq-mini"><figcaption>An actor, the system as a black box (:OrderSystem), lifelines, an activation bar, input messages in camelCase with parameters, dashed output messages and an opt frame.</figcaption></figure>
<ul><li><b>Actor</b>: the initiating actor of the use case.</li><li><b>System</b>: a box treating the system as a black box; the colon marks a running instance; its name usually comes from the use case diagram.</li><li><b>Lifelines</b>: dashed vertical lines showing the life of the sequence.</li><li><b>Activation bars</b>: when a participant is active.</li><li><b>Input messages</b>: horizontal arrows from actor to system, named like <span class="mono">verbNoun(parameter, parameter)</span>.</li><li><b>Output messages</b>: dashed arrows back to the actor; no strict naming, since they are forms, reports or emails.</li><li><b>Receiver actor</b>: another actor or external system that receives messages.</li><li><b>Frame</b>: a box around messages for a loop, alternative or optional fragment, with the condition in square brackets.</li></ul>
<p><b>Six steps (S47):</b> choose one scenario; draw the system box and lifeline; add each actor that gives inputs or receives outputs; draw each external message top to bottom, ignoring messages inside the system; add frames for optional steps, loops and alternatives; check the order.</p>`);

  L('L29', 'P5', 'System design approaches', 'W7-8 S49 to S63', `
<p class="lead">Analysis asks what the system must do. Design specifies how a computer-based solution will do it.</p>
<div class="def"><b>Systems design</b>: the specification of a detailed computer-based solution; also called physical design. Systems analysis emphasises the business problem; systems design emphasises the solution, including technical and implementation concerns. <span class="src">W7-8 S50</span></div>
<figure data-dg="design-approaches"><figcaption>The approaches on W7-8 S51.</figcaption></figure>
<h2>1 · Model-driven approaches <span class="thin">S52</span></h2>
<p>A design approach that emphasises drawing system models to document technical and implementation aspects: ERDs, DFDs, use case, class, activity and sequence diagrams.</p>
<ul>
<li><b>Modern structured design</b> (S53): decomposes the system's processes into manageable components (modules); also called top-down program design or structured programming. Easier to implement and maintain. Modules should be <b>highly cohesive</b> (each does one function only) and <b>loosely coupled</b> (minimally dependent on one another).</li>
<li><b>Information engineering</b> (S55): a model-driven, data-centred but process-sensitive technique for planning, analysing and designing systems. Its models synchronise data and processes; its primary tool is the data model diagram, the ERD. S56 shows a physical ERD with data types such as INTEGER and CHAR.</li>
<li><b>Prototyping</b> (S57 to S58): see Lesson 11.</li>
<li><b>Object-oriented design</b> (S60): refines the object requirements from analysis and defines design-specific objects; an extension of OOA that tries to remove the separation of data and process. Uses use case, class, activity and sequence diagrams.</li></ul>
<h2>2 · Rapid application development (RAD) <span class="thin">S62</span></h2>
<p>A design approach that uses structured, prototyping and JAD techniques to develop systems quickly: a merger of data-driven information engineering, prototyping and joint application development.</p>
<h2>3 · Joint application development (JAD) <span class="thin">S63</span></h2>
<p>A technique that complements other analysis and design techniques. It emphasises participative development among system owners, users, designers and builders. The designer facilitates possibly several full-day workshops, each on different design issues and deliverables.</p>
<div class="tip"><h4>Cohesion and coupling</h4><p>The pair is a favourite short question. Aim for <b>high cohesion</b> and <b>low (loose) coupling</b>. High cohesion: a module does one job. Loose coupling: changing one module barely affects others.</p></div>`);

  L('L30', 'P6', 'One case, four diagrams: consistency and exam technique', 'Synthesis of weeks 3 to 8', `
<p class="lead">The same business scenario can be modelled four ways. Each diagram answers a different question, and the four must agree without being copies of each other.</p>
<figure data-dg="four-views"></figure>
<h2>The eight-step method</h2>
<ol class="steps"><li><b>Understand the statement.</b> Split it into requirements: people and external systems, actions, business objects, data, rules, inputs and outputs, exceptions.</li><li><b>Use case:</b> actors, goals as use cases, boundary, then include, extend and generalisation where justified.</li><li><b>ERD:</b> entities, keys, relationships with optionality and cardinality, many-to-many resolved.</li><li><b>DFD:</b> external entities, a context diagram, then Level 0 processes, stores and labelled flows; check balancing.</li><li><b>Class diagram:</b> classes, attributes, methods, associations with multiplicity, generalisation, aggregation or composition.</li><li><b>Compare</b> the four views.</li><li><b>Check consistency</b>, and decide whether any difference is an error, an assumption or a different perspective.</li><li><b>State assumptions</b> in one or two lines beside the diagram.</li></ol>
<!--page-->
<h2>What carries across, and what does not</h2>
<table class="cmp"><thead><tr><th>Statement</th><th>Why</th></tr></thead><tbody>
<tr><td>An actor is not automatically an entity</td><td>A Customer actor becomes a Customer entity only if the system stores customer data. A Time actor never does.</td></tr>
<tr><td>A data store is not a class</td><td>D1 Orders is data at rest in a process model; Order is a class with behaviour. They often match in name only.</td></tr>
<tr><td>A use case is not a DFD process</td><td>A use case is an actor's goal; a process transforms data. One use case may need several processes, or one process may serve several use cases.</td></tr>
<tr><td>An ERD relationship is not necessarily composition</td><td>One-to-many in an ERD says nothing about lifetime. Composition is a stronger claim: the part dies with the whole.</td></tr>
<tr><td>An entity may correspond to a class</td><td>Customer in the ERD and Customer in the class diagram usually match, but the class adds methods and has no foreign keys.</td></tr></tbody></table>
<h2>ERD versus class diagram</h2>
<table class="cmp"><thead><tr><th></th><th>ERD</th><th>Class diagram</th></tr></thead><tbody>
<tr><td>Models</td><td>Stored data (tables)</td><td>Objects: data and behaviour</td></tr>
<tr><td>Contains</td><td>Entities, attributes, keys</td><td>Classes, attributes, methods</td></tr>
<tr><td>Links shown by</td><td>Foreign keys and crow's feet</td><td>Associations with multiplicity</td></tr>
<tr><td>Cardinality written as</td><td>Bars, circles, crow's feet</td><td>1, 0..1, 0..*, 1..*</td></tr>
<tr><td>Many-to-many</td><td>Must be resolved with an associative entity</td><td>Can be drawn directly</td></tr>
<tr><td>Whole-part</td><td>No special symbol</td><td>Aggregation or composition diamonds</td></tr></tbody></table>
<h2>Exam technique</h2>
<ul><li>Read the scenario twice before drawing. Underline nouns (candidate actors, entities, classes, external entities) and verbs (candidate use cases, processes, methods).</li><li>Draw in pencil-style boxes first, then add relationships; leave space.</li><li>Label everything: every use case, relationship verb, flow and multiplicity.</li><li>Write one or two assumptions where the scenario is silent ("Assumed: a member can hold at most one active booking per class").</li><li>Use the slides' notation; if you choose between two slide versions, say which in one line.</li><li>Divide your time by marks. Do not spend half the paper on one diagram.</li></ul>`);
})(window.BOOK);

  L('L31', 'P6', 'Decode and draw: a recipe for each diagram', 'W3, W4-5, W6, W7-8 · Dennis 8e Ch 4–5', `
<p class="lead">Two skills win diagram marks: <b>decoding</b> a diagram you are given (to spot errors or explain it) and <b>drawing</b> one from a case study. Here is a fixed routine for each of the four diagrams. Learn the routines until you no longer need to think about them.</p>
<p><span class="tag lec">CN7039 rules</span> <span class="tag book">Textbook method</span> <span class="tag exam">Examiner checks</span></p>
<div class="tip"><h4>Before any diagram: underline the case study</h4><p>Read the scenario twice. Underline <b>people and outside systems</b> in one colour, <b>verbs</b> (things done) in another and <b>nouns that are stored</b> (things with many instances) in a third. Those three lists feed all four diagrams.</p></div>
<h2>1 · Use case diagram</h2>
<div class="two"><div><h3>Decode in 30 seconds</h3><ol class="steps">
<li>Read the boundary title: which system is this?</li>
<li>Check every actor sits <b>outside</b> the boundary and is a role, person, external system or time, never an internal database or printer.</li>
<li>Check every oval is <b>inside</b> and starts with a verb.</li>
<li>Check arrows: «include» points <b>from the base to the helper</b>; «extend» points <b>from the optional case to the base</b>; generalisation triangles point to the parent.</li>
<li>Check every actor is linked to at least one use case, and every use case to an actor or another case.</li></ol></div>
<div><h3>Draw from scratch</h3><ol class="steps">
<li>Draw and name the boundary.</li>
<li>Put actors outside: people, external systems, time (from your first underline list).</li>
<li>Put goals inside as verb + noun ovals (Book room, Pay fine).</li>
<li>Connect each actor to the goals it starts or takes part in.</li>
<li>Factor out steps every goal needs into «include»; optional or conditional steps into «extend».</li>
<li>Add actor or use case generalisation only if the case gives a real “kind of” relationship.</li></ol></div></div>
<figure data-dg="uc-incl-clinic"><figcaption>Check the arrow direction first; it is the most common lost mark.</figcaption></figure>
<!--page-->
<h2>2 · Entity relationship diagram</h2>
<div class="two"><div><h3>Decode</h3><ol class="steps">
<li>Read each box as a table: name, primary key underlined or marked PK.</li>
<li>Read every line <b>both ways</b>: “one A has min..max B” then “one B belongs to min..max A”.</li>
<li>Look for a many-to-many line left unresolved: that is an error.</li>
<li>Check foreign keys sit on the <b>many</b> side, and that every relationship has a verb.</li>
<li>Check attributes: one value each, nothing derived (Age next to Date of birth).</li></ol></div>
<div><h3>Draw from scratch</h3><ol class="steps">
<li>List stored nouns with <b>many instances</b>: these are entities (8e: an entity must have more than one instance).</li>
<li>Give each a primary key and a few attributes the processes actually use.</li>
<li>For each pair ask “how many at most?” (cardinality) and “must one exist?” (optionality).</li>
<li>Resolve every M:N with an associative entity holding both keys.</li>
<li>Copy each parent key into the child as a foreign key.</li>
<li>Quick normalisation check: no repeating groups, no partial or transitive dependencies (Lesson 40).</li></ol></div></div>
<figure data-dg="erd-mn-fixed"><figcaption>The associative entity in the middle is the fix examiners look for in every M:N relationship.</figcaption></figure>
<!--page-->
<h2>3 · Data flow diagram</h2>
<div class="two"><div><h3>Decode</h3><ol class="steps">
<li>Start at an external entity and trace each arrow through numbered processes to stores and back out.</li>
<li>Every process: at least one input <b>and</b> one output (no miracle, no sinkhole), and inputs that can really produce the output (no impossible process).</li>
<li>Every flow touches a process: no entity to entity, store to store or entity to store.</li>
<li>Names: processes are verb phrases, flows and stores are nouns, stores numbered D1 or M1.</li>
<li>Compare with the context diagram: every external flow must appear again (balancing).</li></ol></div>
<div><h3>Draw from scratch</h3><ol class="steps">
<li>List the events (what happens and who triggers it): an event-response list (8e Ch 4).</li>
<li>Draw the context diagram: one process 0, the external entities, the flows in and out, no stores.</li>
<li>Draw one fragment per event or use case: process, flows, the stores it reads or writes.</li>
<li>Join the fragments into Level 0, numbered 1, 2, 3 in rough time order, 3 to 7 processes.</li>
<li>Balance against the context diagram; explode a busy process into Level 1 (2.1, 2.2) if asked.</li></ol></div></div>
<figure data-dg="dfd-gym-l0"><figcaption>Processes in time order, stores in the middle, entities at the edges: a layout that keeps lines from crossing.</figcaption></figure>
<!--page-->
<h2>4 · Class diagram</h2>
<div class="two"><div><h3>Decode</h3><ol class="steps">
<li>Check each box has three compartments: name, attributes (usually −), methods (usually +, with brackets).</li>
<li>Triangles: hollow, pointing to the parent (is-a).</li>
<li>Diamonds: on the <b>whole</b>. Hollow = parts survive alone (aggregation); filled = parts die with the whole (composition).</li>
<li>Multiplicities at <b>both</b> ends of every association.</li>
<li>Subclasses must not repeat inherited attributes.</li></ol></div>
<div><h3>Draw from scratch</h3><ol class="steps">
<li>Take the ERD entities as your first classes (minus pure link tables, which may become association classes).</li>
<li>Add private attributes and public methods from the verbs: each class does what it is responsible for.</li>
<li>Pull shared attributes and methods up into a superclass (Person above Customer and Staff).</li>
<li>Draw associations with multiplicities, using the ERD cardinalities.</li>
<li>Upgrade whole–part links to aggregation or composition only when the case tells you about lifetimes.</li></ol></div></div>
<figure data-dg="cls-car"><figcaption>Lecture car rental activity: generalisation, association and multiplicity in one picture.</figcaption></figure>
<div class="trap"><h4>The four-diagram consistency check</h4><p>Before you hand in, check that the same names appear across diagrams: actors ↔ external entities, use cases ↔ processes, entities ↔ stores and classes. Lesson 30 shows how.</p></div>`);

  L('L32', 'P6', 'Lab case studies: three problems to solve', 'Handout 2 · Handout 4 Case Study 7 · Peri Peri lab', `
<p class="lead">Your labs set three “find the real problem” cases. They test the same habits the TCA rewards: separate symptoms from causes, tie each problem to a phase of the SDLC, and propose a fix the business can use. Try each before reading the suggested answer.</p>
<p><span class="tag lec">CN7039 labs</span> <span class="tag exam">Examiner checks</span></p>
<h2>1 · The medical test kit website <span class="thin">Handout 2</span></h2>
<div class="story"><p>A UK start-up built an easy, secure website to sell home medical test kits. The only stated requirement was to sell its products directly and securely. A year later it had sold 20 kits, found that customers did not trust home tests, faced legal liability if a test result misled someone, and closed after losing more than £60,000.</p></div>
<p><b>Task:</b> where should someone have raised the alarm? Find at least four points.</p>
<details class="ans"><summary>Suggested answer</summary>
<ol>
<li><b>Planning, economic and market feasibility:</b> nobody checked demand or how customers would find the site (marketing and search visibility). 20 sales a year shows no market test was done.</li>
<li><b>Planning, organisational feasibility:</b> would customers accept and trust the product? Customer distrust is a stakeholder risk that a survey or interviews would have exposed.</li>
<li><b>Planning, legal and operational risk:</b> liability for wrong results is a constraint that should have been found before any building. A disclaimer added late cost money.</li>
<li><b>Analysis, requirements:</b> one vague business requirement is not a requirements definition. Functional and nonfunctional requirements (trust, legal, privacy) were never elicited.</li>
<li><b>Project management:</b> no budget checkpoints or milestones; the money ran out without a decision to stop or change course.</li></ol>
<p>Link to theory: the cost of fixing errors rises steeply in later phases (Lesson 7). A prototype or a small pilot would have tested demand cheaply.</p></details>
<!--page-->
<h2>2 · The disappearing phones <span class="thin">Handout 4 · Case Study 7</span></h2>
<div class="story"><p>A mobile network’s call centre (abroad) takes upgrade orders by phone. The system emails each phone choice to the UK distribution centre, which posts whatever it is sent. Every year more phones leave than customers are entitled to: the gap grew from 1% to 11%, with losses reaching about £70 million. CCTV shows no theft, and postings match the emails exactly. The original 1999 use case diagram is your only clue.</p></div>
<p><b>Task:</b> find the problem.</p>
<details class="ans"><summary>Suggested answer</summary>
<p>The distribution centre is doing exactly what it is told, so the extra phones come from <b>extra emails</b>. The most likely cause is a missing use case: when a customer calls back to <b>change or cancel</b> their choice, the system sends a <b>new</b> dispatch email but nothing cancels or replaces the first one. Every change of mind therefore ships two phones. The gap grows as more customers change their minds and call volumes rise.</p>
<p>Fix: model “Change order” and “Cancel order” as use cases that update the original order, give each order one ID, and have the distribution centre dispatch against order IDs (one phone per entitled order) rather than against emails. Your lecturer’s own diagram for this case is in the lab materials; compare your answer with it.</p>
<div class="tip"><h4>Why this is a use case lesson</h4><p>The error is in the requirements, not the warehouse. Drawing all the actor goals, including the unhappy paths such as change and cancel, is exactly what use case modelling is for.</p></div></details>
<!--page-->
<h2>3 · The Peri Peri queue <span class="thin">“Who does not like Peri Peri Chicken?” lab</span></h2>
<div class="story"><p>A restaurant chain replaced its waiting area with a QR-code queue. Customers scan, leave, and get a ping and an SMS when a table is ready; they have 10 minutes to claim it. Capacity rose by 20–25% and staff no longer take payment at the till. Two months later, reviews exploded: a couple saw empty three- and four-seat tables but were told 30 minutes, and a family of six was quoted 45 minutes.</p></div>
<p><b>Task:</b> identify the source of the problem (going back to the old system is not allowed) and suggest a fix.</p>
<details class="ans"><summary>Suggested answer</summary>
<ul>
<li><b>No-shows inflate the queue.</b> Anyone can scan the code without coming to the restaurant, so the queue holds people who are not there. Each ping waits 10 minutes before moving on, so wait times swing and grow.</li>
<li><b>Rigid table rules.</b> The algorithm only knows the table set-up entered at the start of the day. It cannot combine or split tables, so two people are not offered a free four-seat table and six people wait for one exact match.</li>
<li><b>Root cause:</b> the requirements assumed customers who scan are present and that table layout is fixed. Both were wrong. The fix is in the system rules, not in going back to the old queue.</li></ul>
<p>Fixes: confirm presence (scan only works on site, or a “I’m here” check-in before joining); shorten the claim window or let customers confirm early; let staff update table combinations during the day; allow seating smaller groups at larger tables when the queue for that size is empty.</p>
<p>Link to theory: this is <b>root cause analysis</b> (Lesson 36): list the symptoms, then ask what causes each one before proposing a solution.</p></details>`);

  L('L33', 'P7', 'The two textbooks and how they fit CN7039', 'Dennis 8e contents · Dennis 5e contents', `
<p class="lead">Your module lists <b>Dennis, Wixom and Roth, <i>Systems Analysis and Design</i>, 8th edition (2021)</b> as core reading. You also have the <b>5th edition (2012)</b>, which adds a chapter on UML. This part of the book turns both into short lessons tied to your lectures.</p>
<p><span class="tag lec">CN7039</span> = what your lecturer teaches and marks. <span class="tag book">Textbook</span> = extra depth from the books. <span class="tag exam">Examiner</span> = what earns the top marks.</p>
<h2>Which chapters matter for the TCA</h2>

  L('L34', 'P7', 'Planning: the SDLC, the system request and feasibility', 'Dennis 8e Ch 1 pp 8–31', `
<p class="lead">Chapter 1 explains why a project starts and how an organisation decides whether it is worth doing.</p>
<div class="levels">
<section data-t="Beginner"><p>Before building anything, someone writes down the business problem (the <b>system request</b>), then the analyst asks three questions: <b>Can we build it? Should we build it? Will people use it?</b> Those are the three feasibilities.</p></section>
<section data-t="Exam standard"><ul><li><b>SDLC (textbook):</b> 4 phases: planning (why build it?), analysis (who, what, where, when?), design (how will it work?), implementation (build, test, install, support).</li>
<li><b>System request:</b> project sponsor, business need, business requirements, business value (tangible and intangible), special issues or constraints.</li>
<li><b>Feasibility study:</b> technical, economic and organisational.</li></ul></section>
<section data-t="Examiner"><p>Link feasibility to risk: technical risk rises with unfamiliar applications or technology, large size and poor compatibility; organisational risk falls with strategic alignment and a strong champion. Use <b>NPV</b> rather than ROI alone because it counts the time value of money.</p></section></div>
<h2>The SDLC: four phases or seven?</h2>
<div class="two"><div><p><span class="tag book">Textbook</span> Planning → Analysis → Design → Implementation. Each phase has <b>steps</b>, uses <b>techniques</b> and produces <b>deliverables</b> (the system request, the system proposal, the system specification, the installed system).</p></div>
<div><p><span class="tag lec">CN7039</span> Planning → Analysis → Design → Development → Testing → Implementation → Maintenance (Lesson 6). The lecture splits the textbook’s implementation phase into four. Use the seven in the TCA; mention the four if asked to compare.</p></div></div>
<h2>The system request</h2>
<table class="cmp"><thead><tr><th>Section</th><th>What it says</th></tr></thead><tbody>
<tr><td>Project sponsor</td><td>The business person who wants the system and will champion it.</td></tr>
<tr><td>Business need</td><td>Why the system is needed, in business terms, not technology.</td></tr>
<tr><td>Business requirements</td><td>The capabilities it must provide, at a high level.</td></tr>
<tr><td>Business value</td><td>Tangible value (money you can estimate) and intangible value (for example, better service).</td></tr>
<tr><td>Special issues</td><td>Deadlines, legal rules, constraints.</td></tr></tbody></table>
<p>DrōnTeq’s sponsor estimated revenue three ways (high, medium, low) with probabilities and used the weighted average as the expected value: a sensible way to put a number on an uncertain benefit.</p>
<!--page-->
<h2>Feasibility: three questions</h2>
<table class="cmp"><thead><tr><th>Feasibility</th><th>Question</th><th>What you assess</th></tr></thead><tbody>
<tr><td>Technical</td><td>Can we build it?</td><td>Familiarity with the application and the technology, project size, compatibility with existing systems.</td></tr>
<tr><td>Economic</td><td>Should we build it?</td><td>Development costs, annual operating costs, annual benefits, intangible costs and benefits.</td></tr>
<tr><td>Organisational</td><td>If we build it, will they come?</td><td>Strategic alignment and stakeholders: the champion, organisational management, users and others.</td></tr></tbody></table>
<h2>Worked example: ROI, break-even and NPV</h2>
<p>A system costs £80,000 to build in year 0, then brings benefits of £40,000, £45,000 and £50,000 with running costs of £8,000, £9,000 and £10,000.</p>
<table class="cmp num"><thead><tr><th></th><th>Year 0</th><th>Year 1</th><th>Year 2</th><th>Year 3</th><th>Total</th></tr></thead><tbody>
<tr><td>Benefits</td><td>0</td><td>40,000</td><td>45,000</td><td>50,000</td><td>135,000</td></tr>
<tr><td>Costs</td><td>80,000</td><td>8,000</td><td>9,000</td><td>10,000</td><td>107,000</td></tr>
<tr><td>Net cash flow</td><td>−80,000</td><td>32,000</td><td>36,000</td><td>40,000</td><td>28,000</td></tr>
<tr><td>Cumulative</td><td>−80,000</td><td>−48,000</td><td>−12,000</td><td>28,000</td><td></td></tr></tbody></table>
<figure class="chart"><svg class="dg" viewBox="0 0 520 230" role="img" aria-label="Cumulative net cash flow by year"><line class="ln thin" x1="60" y1="120" x2="500" y2="120"/>
<rect x="90" y="120" width="60" height="80" style="fill:var(--bad);opacity:.75"/><rect x="190" y="120" width="60" height="48" style="fill:var(--bad);opacity:.75"/><rect x="290" y="120" width="60" height="12" style="fill:var(--bad);opacity:.75"/><rect x="390" y="92" width="60" height="28" style="fill:var(--accent);opacity:.85"/>
<text class="t xs" x="120" y="216" text-anchor="middle">Year 0</text><text class="t xs" x="220" y="184" text-anchor="middle">Year 1</text><text class="t xs" x="320" y="148" text-anchor="middle">Year 2</text><text class="t xs" x="420" y="84" text-anchor="middle">Year 3</text>
<text class="t xs" x="120" y="114" text-anchor="middle">−80k</text><text class="t xs" x="220" y="114" text-anchor="middle">−48k</text><text class="t xs" x="320" y="114" text-anchor="middle">−12k</text><text class="t xs" x="420" y="138" text-anchor="middle">+28k</text>
<text class="t xs" x="56" y="124" text-anchor="end">0</text><text class="t s" x="260" y="24" text-anchor="middle">Cumulative net cash flow turns positive in year 3</text></svg><figcaption>The project pays for itself during year 3.</figcaption></figure>
<ul><li><b>ROI</b> = (total benefits − total costs) ÷ total costs = 28,000 ÷ 107,000 = <b>26.2%</b>. Simple, but it ignores when the money arrives.</li>
<li><b>Break-even point</b> = years of negative cash flow + (that year’s net cash flow − that year’s cumulative cash flow) ÷ that year’s net cash flow = 2 + (40,000 − 28,000) ÷ 40,000 = <b>2.3 years</b>. Easy to understand, but it ignores everything after break-even.</li>
<li><b>Present value</b> = cash flow ÷ (1 + rate)<sup>n</sup>. At 10%, benefits are worth £111,119 today and costs £102,224, so <b>NPV = £8,896</b>. NPV above zero means the project earns more than the required rate of return.</li></ul>
<div class="tip"><h4>Remember the order of the three questions</h4><p>Can we? Should we? Will they? Technical, economic, organisational. Time is a project management issue, not a fourth feasibility, in this book.</p></div>`);

  L('L35', 'P7', 'Methodologies: waterfall, RAD, prototyping and agile', 'Dennis 8e Ch 2 pp 42–51, 58–62', `
<p class="lead">A methodology is a formal way of working through the SDLC: the tasks, steps and deliverables. Chapter 2 compares seven and gives a table for choosing between them.</p>
<div class="levels">
<section data-t="Beginner"><p>Some methods do each phase once, in order (waterfall). Others build a small version fast and improve it (RAD, prototyping, agile). The right one depends on how clear the requirements are and how much time you have.</p></section>
<section data-t="Exam standard"><ul><li><b>Waterfall family:</b> waterfall, parallel development, V-model.</li><li><b>RAD family:</b> iterative development, system prototyping, throwaway prototyping.</li><li><b>Agile:</b> XP, Scrum and others: short cycles (1–4 weeks), each a complete mini-project.</li></ul></section>
<section data-t="Examiner"><p>Justify a choice with the six selection criteria: clarity of requirements, familiarity with the technology, complexity, reliability, time schedule and schedule visibility. For example, unfamiliar technology plus a complex, reliable system points to throwaway prototyping.</p></section></div>
<table class="cmp"><thead><tr><th>Methodology</th><th>How it works</th><th>Strength</th><th>Weakness</th></tr></thead><tbody>
<tr><td>Waterfall</td><td>Phases in sequence, each signed off before the next.</td><td>Requirements fixed early.</td><td>Long wait for a system; going back is hard; testing comes late.</td></tr>
<tr><td>Parallel</td><td>One general design, then subprojects built at the same time and integrated.</td><td>Shorter than waterfall.</td><td>Integration at the end can be hard.</td></tr>
<tr><td>V-model</td><td>Each design level has a matching test level (unit, integration, system, acceptance) planned as you go down the V.</td><td>Testing planned early; quality.</td><td>Still rigid.</td></tr>
<tr><td>Iterative</td><td>The most important requirements are built first as version 1, then later versions add more.</td><td>Users get value quickly.</td><td>Early versions are deliberately incomplete.</td></tr>
<tr><td>System prototyping</td><td>A quick, simple working version is improved round after round until it becomes the real system.</td><td>Fast; good when users cannot describe needs.</td><td>Weak analysis can bake in design flaws.</td></tr>
<tr><td>Throwaway prototyping</td><td>Full analysis, plus design prototypes to explore risky issues, then thrown away before the real build.</td><td>Stable, reliable systems.</td><td>Takes longer than system prototyping.</td></tr>
<tr><td>Agile (XP)</td><td>User stories, small modules, constant testing, small team, users on hand.</td><td>Very fast, adapts to change.</td><td>Little documentation; not for large or mission-critical systems.</td></tr></tbody></table>
<!--page-->
<h2>Choosing a methodology (8e Figure 2-9)</h2>
<table class="cmp sel"><thead><tr><th>Useful for systems…</th><th>Waterfall</th><th>Parallel</th><th>V-model</th><th>Iterative</th><th>System proto.</th><th>Throwaway proto.</th><th>Agile</th></tr></thead><tbody>
<tr><td>with unclear requirements</td><td>Poor</td><td>Poor</td><td>Poor</td><td>Good</td><td>Excellent</td><td>Excellent</td><td>Excellent</td></tr>
<tr><td>with unfamiliar technology</td><td>Poor</td><td>Poor</td><td>Poor</td><td>Good</td><td>Poor</td><td>Excellent</td><td>Poor</td></tr>
<tr><td>that are complex</td><td>Good</td><td>Good</td><td>Good</td><td>Good</td><td>Poor</td><td>Excellent</td><td>Poor</td></tr>
<tr><td>that are reliable</td><td>Good</td><td>Good</td><td>Excellent</td><td>Good</td><td>Poor</td><td>Excellent</td><td>Good</td></tr>
<tr><td>with a short time schedule</td><td>Poor</td><td>Good</td><td>Poor</td><td>Excellent</td><td>Excellent</td><td>Good</td><td>Excellent</td></tr>
<tr><td>with schedule visibility</td><td>Poor</td><td>Poor</td><td>Poor</td><td>Excellent</td><td>Excellent</td><td>Good</td><td>Good</td></tr></tbody></table>
<h2>Managing the project</h2>
<ul><li><b>Scope creep:</b> requirements keep growing after the plan is set; control it with a change request process.</li>
<li><b>Timeboxing:</b> fix the deadline and deliver the most important features by then; leave the rest for later versions.</li>
<li><b>Risk management:</b> list the risks, judge how likely and how serious each is, plan a response, and review it as the project runs.</li></ul>
<div class="trap"><h4>Linear versus waterfall</h4><p><span class="tag lec">CN7039</span> Your lecture separates a <b>linear</b> model (no going back) from <b>waterfall</b> (you can go back upstream). The textbook says going back in waterfall is possible but difficult, like a salmon swimming up a waterfall. In the TCA, use the lecture’s distinction.</p></div>`);

  L('L36', 'P7', 'Requirements: types, elicitation and analysis strategies', 'Dennis 8e Ch 3 pp 74–103', `
<p class="lead">Analysis turns a business need into requirements. Chapter 3 names the kinds of requirement, five ways to collect them and eight strategies for thinking past the obvious.</p>
<div class="levels">
<section data-t="Beginner"><p>A requirement is a statement of what the system must do or what it must be like. You collect them by talking to people (interviews, workshops), asking many people at once (questionnaires), reading documents and watching work.</p></section>
<section data-t="Exam standard"><ul><li><b>Functional</b> requirements: what it must do (process-oriented) or hold (information-oriented).</li><li><b>Nonfunctional</b>: operational, performance, security, cultural and political.</li><li>Elicitation: interviews, JAD, questionnaires, document analysis, observation.</li></ul></section>
<section data-t="Examiner"><p>Pick techniques for a reason: JAD gives the best integration of conflicting views because everyone is in the room; observation and document analysis show the as-is system cheaply but not why; questionnaires reach many people but give little depth.</p></section></div>
<h2>Kinds of requirement</h2>
<table class="cmp"><thead><tr><th>Type</th><th>Perspective</th><th>Example</th></tr></thead><tbody>
<tr><td>Business</td><td>What the business needs</td><td>Provide online booking.</td></tr>
<tr><td>User</td><td>A task the user does</td><td>Book a class.</td></tr>
<tr><td>Functional, process</td><td>Something the system does</td><td>Check the class has a free place.</td></tr>
<tr><td>Functional, information</td><td>Something the system holds</td><td>Keep each member’s booking history for 2 years.</td></tr>
<tr><td>Nonfunctional</td><td>A quality or constraint</td><td>Respond in under 2 seconds; run on any browser.</td></tr>
<tr><td>System</td><td>The developer’s view in design</td><td>Store bookings in a MySQL table.</td></tr></tbody></table>
<h3>Nonfunctional requirement types</h3>
<ul><li><b>Operational:</b> the physical and technical environment (runs on tablets, prints wirelessly).</li><li><b>Performance:</b> speed, capacity, availability (3-second response, updated every 5 minutes).</li><li><b>Security:</b> who may see and change what.</li><li><b>Cultural and political:</b> company policy, law, language (all hardware bought from one supplier).</li></ul>
<!--page-->
<h2>Five elicitation techniques compared (8e Figure 3-12)</h2>
<table class="cmp"><thead><tr><th></th><th>Interviews</th><th>JAD</th><th>Questionnaires</th><th>Document analysis</th><th>Observation</th></tr></thead><tbody>
<tr><td>Type of information</td><td>As-is, improvements, to-be</td><td>As-is, improvements, to-be</td><td>As-is, improvements</td><td>As-is</td><td>As-is</td></tr>
<tr><td>Depth</td><td>High</td><td>High</td><td>Medium</td><td>Low</td><td>Low</td></tr>
<tr><td>Breadth</td><td>Low</td><td>Medium</td><td>High</td><td>High</td><td>Low</td></tr>
<tr><td>Integration</td><td>Low</td><td>High</td><td>Low</td><td>Low</td><td>Low</td></tr>
<tr><td>User involvement</td><td>Medium</td><td>High</td><td>Low</td><td>Low</td><td>Low</td></tr>
<tr><td>Cost</td><td>Medium</td><td>Low–medium</td><td>Low</td><td>Low</td><td>Low–medium</td></tr></tbody></table>
<h2>Analysis strategies</h2>
<p>Three big strategies set how ambitious the change is: <b>business process automation</b> (computerise the current way, small change), <b>business process improvement</b> (moderate change) and <b>business process reengineering</b> (radical redesign, most risk and most value).</p>
<table class="cmp"><thead><tr><th>Strategy</th><th>Idea</th></tr></thead><tbody>
<tr><td>Problem analysis</td><td>Ask users what is wrong and how to fix it. Gives small improvements.</td></tr>
<tr><td>Root cause analysis</td><td>List problems, rank them, then find the underlying causes before choosing solutions.</td></tr>
<tr><td>Duration analysis</td><td>Time each step; compare total step time with total elapsed time to find waiting.</td></tr>
<tr><td>Activity-based costing</td><td>Find the cost of each step to target the expensive ones.</td></tr>
<tr><td>Informal benchmarking</td><td>See how other organisations, often as their customer, do the same process.</td></tr>
<tr><td>Outcome analysis</td><td>Ask what the customer ultimately wants, and design for that.</td></tr>
<tr><td>Technology analysis</td><td>Ask how a new technology could be used in this business.</td></tr>
<tr><td>Activity elimination</td><td>Imagine removing each step and ask what would happen.</td></tr></tbody></table>
<figure data-dg="bk-rootcause"><figcaption>Root cause analysis: one symptom, several possible causes, each investigated before any fix is chosen. The example is adapted from the textbook’s stock-out case.</figcaption></figure>
<div class="tip"><h4>Your lecture’s word for this</h4><p><span class="tag lec">CN7039</span> The lift and supermarket cases (Lessons 3 and 4) are root cause analysis: treat the cause, not the symptom.</p></div>`);
