<html lang="en-GB">
<head>
<meta charset="utf-8">

<title>CN7039 Four Diagrams Book</title>
<meta name="description" content="CN7039 Software Engineering exam study book: lessons, textbook companion, four-diagram stories, questions, flashcards and a 33-day plan.">
<meta name="theme-color" content="#2546A8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2712%27 fill=%27%232546A8%27/%3E%3Crect x=%2714%27 y=%2716%27 width=%2716%27 height=%2712%27 rx=%272%27 fill=%27white%27/%3E%3Crect x=%2734%27 y=%2716%27 width=%2716%27 height=%2712%27 rx=%276%27 fill=%27white%27/%3E%3Crect x=%2714%27 y=%2736%27 width=%2716%27 height=%2712%27 fill=%27white%27/%3E%3Cellipse cx=%2742%27 cy=%2742%27 rx=%279%27 ry=%276%27 fill=%27white%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: a bound notebook page on a slate desk; each part of the book keeps its own ink colour. */
  --desk: #E4E7EC; --paper: #FDFDFC; --ink: #18202B; --muted: #5A6472; --rule: #DCE0E6;
  --accent: #2546A8; --accent-t: #E8EDFA; --good: #1E7A45; --bad: #B42318; --warnbg: #FFF4D6; --mark: rgba(255, 214, 79, .45);
  --p1: #56667D; --p2: #6A4C9C; --p3: #16786B; --p4: #A85A12; --p5: #2546A8; --p6: #9B2F5C; --p7: #7A5B12;
  --uc-t: #F1ECF8; --erd-t: #E7F4F1; --dfd-t: #FBF0E4; --cls-t: #EAF0FB; --box-t: #F2F4F7;
  --f-disp: "Archivo", "Helvetica Neue", Arial, sans-serif; --f-body: "Source Serif 4", Georgia, "Times New Roman", serif; --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; --f-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0C0F13; --paper: #171B21; --ink: #E4E8EE; --muted: #9AA3AF; --rule: #2B313B;
    --accent: #8EA8F2; --accent-t: #1F2840; --good: #5BC48A; --bad: #F08A80; --warnbg: #3A3120; --mark: rgba(255, 214, 79, .22);
    --p1: #9AA8BD; --p2: #B79BE4; --p3: #5CC2B0; --p4: #E5A060; --p5: #8EA8F2; --p6: #E58AB3; --p7: #D9B45A;
    --uc-t: #241E31; --erd-t: #182A27; --dfd-t: #2E2318; --cls-t: #1B2333; --box-t: #20252D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0C0F13; --paper: #171B21; --ink: #E4E8EE; --muted: #9AA3AF; --rule: #2B313B;
  --accent: #8EA8F2; --accent-t: #1F2840; --good: #5BC48A; --bad: #F08A80; --warnbg: #3A3120; --mark: rgba(255, 214, 79, .22);
  --p1: #9AA8BD; --p2: #B79BE4; --p3: #5CC2B0; --p4: #E5A060; --p5: #8EA8F2; --p6: #E58AB3; --p7: #D9B45A;
  --uc-t: #241E31; --erd-t: #182A27; --dfd-t: #2E2318; --cls-t: #1B2333; --box-t: #20252D;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--desk); color: var(--ink); font: 18px/1.65 var(--f-body); -webkit-font-smoothing: antialiased; }
button, select, input, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* Top bar */
.bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--paper); border-bottom: 1px solid var(--rule); font: 500 14px/1.2 var(--f-ui); flex-wrap: wrap; }
.bar .bt { font-weight: 700; letter-spacing: .01em; margin-right: auto; }
.bar nav { display: flex; gap: 6px; flex-wrap: wrap; }
.bar button { background: transparent; border: 1px solid var(--rule); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
.bar button:hover { border-color: var(--accent); color: var(--accent); }
#btn-today { background: var(--accent); color: var(--paper); border-color: var(--accent); }
#btn-today:hover { color: var(--paper); filter: brightness(1.08); }
.sync { font-size: 12px; color: var(--muted); }

/* Contents drawer */
#toc { position: fixed; inset: 0; z-index: 40; background: rgba(10, 14, 20, .45); }
#toc .toc-in { position: absolute; left: 0; top: 0; bottom: 0; width: min(420px, 92vw); background: var(--paper); overflow: auto; padding: 16px 18px 40px; font: 15px/1.4 var(--f-ui); box-shadow: 4px 0 24px rgba(0, 0, 0, .2); }
.toc-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.toc-h button { border: 1px solid var(--rule); background: none; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
#toc details { border-bottom: 1px solid var(--rule); padding: 6px 0; }
#toc summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
#toc ul { list-style: none; margin: 4px 0 6px; padding: 0; }
#toc li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
#toc li a { color: var(--ink); text-decoration: none; }
#toc li a:hover { color: var(--accent); text-decoration: underline; }
#toc li span { color: var(--muted); font-variant-numeric: tabular-nums; }

/* Desk and page */
.desk { padding: 20px 16px 40px; }
.runhead { max-width: 820px; margin: 0 auto 8px; display: flex; justify-content: space-between; gap: 12px; font: 600 11px/1.3 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
#page { max-width: 820px; margin: 0 auto; }
.pg { position: relative; background: var(--paper); border-radius: 3px 8px 8px 3px; box-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 12px 32px rgba(20, 30, 50, .10); padding: 56px 68px 64px; min-height: 70vh; --pc: var(--accent); }
.pg::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 26px; border-radius: 3px 0 0 3px; background: linear-gradient(to right, rgba(0, 0, 0, .07), rgba(0, 0, 0, 0)); pointer-events: none; }
.turn-r { animation: turnR .22s ease-out; } .turn-l { animation: turnL .22s ease-out; }
@keyframes turnR { from { opacity: .3; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@keyframes turnL { from { opacity: .3; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .turn-r, .turn-l { animation: none; } .fc.flipped .fc-inner { transition: none; } }
.pager { max-width: 820px; margin: 14px auto 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; font: 500 14px var(--f-ui); color: var(--muted); }
.pager button { background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 16px; cursor: pointer; color: var(--ink); }
.pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.pager button:disabled { opacity: .4; cursor: default; }

/* Type */
h1, h2, h3, h4, h5 { font-family: var(--f-disp); line-height: 1.2; text-wrap: balance; color: var(--ink); }
h1 { font-size: 34px; font-weight: 700; margin: 0 0 18px; letter-spacing: -.01em; }
h2 { font-size: 23px; font-weight: 700; margin: 34px 0 10px; }
h3 { font-size: 19px; font-weight: 600; margin: 26px 0 8px; }
h4 { font-size: 16px; font-weight: 600; margin: 0 0 6px; }
h5 { font-size: 14px; font-weight: 700; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.thin { font-weight: 400; color: var(--muted); font-size: .8em; }
p { margin: 0 0 14px; max-width: 66ch; }
.lead { font-size: 20px; color: var(--ink); }
.eyebrow { font: 600 12px/1.3 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--pc, var(--accent)); margin: 0 0 8px; }
.muted { color: var(--muted); } .small { font-size: 15px; } .big { font-size: 26px; font-family: var(--f-disp); font-weight: 700; margin: 0; }
ul, ol { padding-left: 1.3em; max-width: 66ch; } li { margin: 4px 0; }
mark, .hi { background: var(--mark); color: inherit; padding: 0 2px; }
code, .mono { font-family: var(--f-mono); font-size: .88em; }
table { border-collapse: collapse; width: 100%; margin: 14px 0 20px; font-size: 16px; }
th, td { text-align: left; vertical-align: top; border-bottom: 1px solid var(--rule); padding: 8px 10px; }
thead th { font: 600 13px var(--f-ui); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-bottom: 2px solid var(--ink); }
tbody th { font-family: var(--f-ui); font-size: 15px; font-weight: 600; width: 26%; }
.tbl-wrap { overflow-x: auto; }
.src { font: 500 12px var(--f-ui); color: var(--muted); white-space: nowrap; }

/* Lesson blocks */
.def { border-left: 4px solid var(--pc); background: color-mix(in srgb, var(--pc) 7%, var(--paper)); padding: 12px 16px; margin: 14px 0; border-radius: 0 6px 6px 0; }
.def b:first-child { font-family: var(--f-disp); }
.tip, .trap, .eg, .key-box { border-radius: 8px; padding: 14px 18px; margin: 18px 0; }
.tip { background: var(--accent-t); }
.tip h4::before { content: "Exam tip · "; color: var(--accent); }
.trap { background: var(--warnbg); }
.trap h4::before { content: "Common mistake · "; color: var(--bad); }
.eg { border: 1px dashed var(--rule); }
.eg h4::before { content: "Worked example · "; color: var(--pc); }
.key-box { border: 2px solid var(--pc); }
.tip p:last-child, .trap p:last-child, .eg p:last-child, .def p:last-child { margin-bottom: 0; }
.story { font-style: italic; font-size: 19px; border-left: 3px solid var(--rule); padding-left: 18px; margin: 16px 0 20px; }
.story p:first-child::first-letter { font-family: var(--f-disp); font-style: normal; font-weight: 700; font-size: 3.1em; float: left; line-height: .9; padding: 4px 8px 0 0; color: var(--pc, var(--accent)); }
.story.short p:first-child::first-letter { font-size: 1em; float: none; padding: 0; color: inherit; font-weight: inherit; font-family: inherit; font-style: italic; }
figure { margin: 20px 0; }
figcaption { font: 14px/1.4 var(--f-ui); color: var(--muted); margin-top: 6px; }
.cmp td:first-child { font-weight: 600; font-family: var(--f-ui); font-size: 15px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.steps { counter-reset: s; list-style: none; padding: 0; }
.steps > li { counter-increment: s; position: relative; padding-left: 40px; margin: 10px 0; }
.steps > li::before { content: counter(s); position: absolute; left: 0; top: 1px; width: 26px; height: 26px; border-radius: 50%; background: var(--pc); color: var(--paper); font: 700 13px/26px var(--f-ui); text-align: center; }

/* Diagrams */
.dg { width: 100%; height: auto; display: block; font-family: var(--f-ui); --tint: var(--box-t); }
.dg.uc { --tint: var(--uc-t); } .dg.erd { --tint: var(--erd-t); } .dg.dfd { --tint: var(--dfd-t); } .dg.cls { --tint: var(--cls-t); } .dg.seq { --tint: var(--box-t); }
.dg .ln { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dg .thin { stroke-width: 1; }
.dg .dash { stroke-dasharray: 6 4; }
.dg .sh { stroke: var(--ink); stroke-width: 1.5; fill: var(--tint); }
.dg .sh.acc { fill: var(--accent-t); stroke: var(--accent); stroke-width: 2; }
.dg .sh.soft { fill: var(--paper); stroke: var(--rule); }
.dg .sh.warn { fill: var(--warnbg); stroke: var(--bad); }
.dg .fillonly { fill: var(--tint); stroke: none; }
.dg .ah { fill: var(--ink); }
.dg .tri { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
.dg .dia-f { fill: var(--ink); stroke: var(--ink); stroke-width: 1; }
.dg .dot { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
.dg .bd { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.dg .frame { fill: none; stroke: var(--ink); stroke-width: 1; }
.dg .t { fill: var(--ink); font-size: 13px; }
.dg .s { font-size: 12px; } .dg .xs { font-size: 11px; }
.dg .hd { font-weight: 700; font-family: var(--f-disp); font-size: 13.5px; }
.dg .key { font: 600 10px var(--f-mono); fill: var(--muted); }
.dg .u { text-decoration: underline; }
.dg .mono { font-family: var(--f-mono); font-size: 11.5px; }
.dg .lbl { fill: var(--ink); font-size: 11.5px; paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
.dg .hl { stroke: var(--accent) !important; stroke-width: 2.6 !important; }
.dg .err { stroke: var(--bad); }
.big-fig { overflow-x: auto; }
.big-fig .dg { min-width: 560px; }
.swipe { display: none; margin-top: -12px; }

/* Charts */
.chart-svg { width: 100%; height: auto; display: block; font-family: var(--f-ui); }
.chart-svg .t { fill: var(--ink); font-size: 12px; } .chart-svg .xs { font-size: 11px; fill: var(--muted); } .chart-svg .s { font-size: 13px; }
.chart-svg .grid { stroke: var(--rule); } .chart-svg .target { stroke: var(--good); stroke-dasharray: 5 4; }
.chart-svg .ln { fill: none; } .chart-svg .acc { stroke: var(--accent); stroke-width: 2.5; } .chart-svg .pt { fill: var(--accent); }
.chart-svg .track { fill: var(--rule); } .chart-svg .bar { fill: var(--accent); } .chart-svg .track2 { fill: var(--muted); }

/* Buttons and inputs */
.btn { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: var(--paper); border: 1px solid var(--accent); border-radius: 8px; padding: 9px 16px; cursor: pointer; font: 600 15px var(--f-ui); }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--accent); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
textarea, select { width: 100%; border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: 10px 12px; font: 16px/1.5 var(--f-body); }
select { width: auto; font-family: var(--f-ui); font-size: 15px; padding: 7px 10px; }
.lbl-sm { display: block; font: 600 13px var(--f-ui); color: var(--muted); margin: 10px 0 4px; }
.ai-only, .ai-img-only { display: none !important; }
body.has-ai .ai-only { display: inline-flex !important; }
body.has-ai .upl.ai-only { display: flex !important; }
body.has-ai-img .ai-img-only { display: flex !important; }
.upl { flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.warn { color: var(--bad); } .warn.small { font-size: 14px; margin: 6px 0; }

/* Questions */
.q { border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px 14px; margin: 16px 0; background: var(--paper); }
.q-h { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font: 600 12px var(--f-ui); color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 8px; }
.q-n { color: var(--ink); font-size: 15px; } .q-src { margin-left: auto; } .q-got { color: var(--good); font-size: 13px; }
.q-stem { font-size: 18px; } .q-stem p { margin-bottom: 8px; }
.opts { display: grid; gap: 8px; margin-top: 8px; }
.opt { text-align: left; display: flex; gap: 10px; align-items: flex-start; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; cursor: pointer; font: 16px/1.45 var(--f-body); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .ol { font: 700 13px/1.8 var(--f-ui); color: var(--muted); min-width: 16px; }
.opt.on { border-color: var(--accent); background: var(--accent-t); }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--paper)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--paper)); }
.tf-btns { display: flex; gap: 10px; } .tf-btns .opt { flex: 1; justify-content: center; font-family: var(--f-ui); font-weight: 600; }
.tf .check { margin-top: 10px; }
.explain { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--accent-t); font-size: 16px; }
.explain .fix { margin: 6px 0 0; }
.selfmark { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 10px; font: 600 13px var(--f-ui); color: var(--muted); }
.chip { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; min-width: 34px; padding: 4px 10px; cursor: pointer; font: 600 14px var(--f-ui); }
.chip.on { background: var(--accent); color: var(--paper); border-color: var(--accent); }
.model { margin-top: 12px; border-top: 1px dashed var(--rule); padding-top: 12px; font-size: 16px; }
.pts ul { margin: 6px 0; } .checks { list-style: none; padding: 0; } .checks li { margin: 6px 0; } .checks label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.checks input { margin-top: 6px; width: 18px; height: 18px; accent-color: var(--accent); }
.ai-out .verdict { margin-top: 10px; border: 1px solid var(--accent); border-radius: 8px; padding: 10px 12px; font-size: 16px; }
.ai-out .score { font: 700 18px var(--f-ui); color: var(--accent); }
.ai-out .missing { font-size: 15px; margin: 0; }
.check-box { margin-top: 36px; border-top: 2px solid var(--ink); padding-top: 6px; }

/* Flashcards */
.deck { margin: 14px 0; }
.fc { border: 1px solid var(--rule); border-radius: 14px; padding: 18px 22px; background: var(--paper); box-shadow: 0 6px 18px rgba(20, 30, 50, .07); }
.fc-top { display: flex; justify-content: space-between; gap: 10px; font: 600 12px var(--f-ui); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
.fc-term { font: 700 24px/1.25 var(--f-disp); margin: 6px 0 8px; } .small-term { font-size: 18px; color: var(--muted); }
.fc-def { font-size: 19px; } .fc-eg, .fc-k { font-size: 16px; } .fc-src { font: 12px var(--f-ui); color: var(--muted); }
.fc .reveal { margin-top: 10px; }
.rates { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate { flex-direction: column; gap: 0; background: var(--paper); color: var(--ink); border: 1px solid var(--rule); }
.rate span { font: 12px var(--f-ui); color: var(--muted); }
.r-again { border-color: var(--bad); } .r-hard { border-color: #C98A12; } .r-good { border-color: var(--accent); } .r-easy { border-color: var(--good); }
.deck-end { text-align: center; padding: 20px; border: 1px dashed var(--rule); border-radius: 12px; }
.deck-stats { display: flex; gap: 12px; margin: 10px 0; }
.deck-stats div { flex: 1; border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; font: 14px var(--f-ui); }
.deck-stats b { display: block; font-size: 26px; font-family: var(--f-disp); }
.deck-ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font: 14px var(--f-ui); margin: 10px 0; }
dl.gl > div { padding: 8px 0; border-bottom: 1px solid var(--rule); } dl.gl dt { font: 700 16px var(--f-disp); } dl.gl dd { margin: 2px 0 0; font-size: 16px; }

/* Cover, parts, contents, calendar */
.pg-cover { display: flex; }
.cover { width: 100%; }
.cover h1 { font-size: 52px; line-height: 1.02; margin-top: 10px; }
.cover h1 span { display: block; font-size: 24px; font-weight: 500; color: var(--muted); margin-top: 10px; letter-spacing: 0; }
.cover-sub { font-size: 20px; max-width: 54ch; }
.cover-art { margin: 22px 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.cover-art figure { margin: 0; border: 1px solid var(--rule); border-radius: 10px; padding: 6px; }
.cover-art figcaption { text-align: center; font-weight: 600; color: var(--ink); }
@media (max-width: 700px) { .cover-art { grid-template-columns: repeat(2, 1fr); } }
.cover-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 0 0 20px; font: 14px/1.4 var(--f-ui); }
.cover-meta div { border-top: 2px solid var(--ink); padding-top: 6px; } .cover-meta dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; } .cover-meta dd { margin: 2px 0 0; font-weight: 600; }
.part-open { border-top: 8px solid var(--pc); padding-top: 18px; }
.part-open h1 { font-size: 42px; }
.part-list { list-style: none; padding: 0; } .part-list li { padding: 8px 0; border-bottom: 1px solid var(--rule); }
.toc-list { list-style: none; padding: 0; max-width: none; }
.toc-part > span { display: block; font: 700 17px var(--f-disp); margin: 18px 0 6px; } .toc-part small { font-weight: 400; color: var(--muted); font-size: 13px; }
.toc-part ol { list-style: none; padding: 0; max-width: none; }
.toc-part li { display: flex; align-items: baseline; gap: 6px; font-size: 16px; margin: 3px 0; }

  L('L01', 'P1', 'Systems, data and information', 'W1 S5 to S7', `
<p class="lead">Every model in this module describes a <b>system</b>. Before drawing anything, be precise about what a system is, and about the difference between data and information.</p>
<div class="def"><b>System</b>: anything that takes an input and produces an output. It is not exclusive to computers. <span class="src">W1 S5</span></div>
<p>The slides give five examples: an air-conditioning system, the respiratory system, a printing system, the health system and a computer system (W1 S6). Each one takes something in, does something to it and gives something out.</p>
<figure data-dg="sys-ipo"><figcaption>The same input → process → output shape applies to data: processing raw data produces information.</figcaption></figure>
<div class="def"><b>Data</b>: raw facts that describe a particular phenomenon, such as the current temperature, the price of a movie rental or your age. <span class="src">W1 S7</span></div>
<div class="def"><b>Information</b>: data that has a particular meaning within a specific context. <span class="src">W1 S7</span></div>
<div class="eg"><h4>Data becoming information</h4><p>"38.4" is data. "Patient in bed 4 has a temperature of 38.4 °C, above the 38.0 °C alert threshold" is information: the same fact placed in a context where it means something and can be acted on.</p></div>
<div class="def"><b>Information system (IS)</b> †: an arrangement of people, data, processes and information technology that work together to collect, process, store and provide the information an organisation needs. <span class="src">named on W1 S7</span></div>
<div class="def"><b>Information technology (IT)</b> †: the hardware, software and telecommunications technology an information system uses. IT is one part of an IS, not the whole of it.</div>
<div class="trap"><h4>IT is not the same as an IS</h4><p>A server is IT. A hospital's patient-records system is an IS: the nurses, the record procedures, the data and the server together. Exam answers that treat "system" as "computer" lose marks; the slide says plainly that systems are not exclusive to computers.</p></div>
<div class="tip"><h4>Definitions with examples</h4><p>For any "define" question, give the definition, then one concrete example. The example shows you understand it, and examiners usually reserve a mark for it.</p></div>`);

  L('L02', 'P1', 'Stakeholders of an information system', 'W1 S8 to S13', `
<p class="lead">An information system is built for, paid for, used by and built by different people. Each group needs something different from it, and the analyst has to hear all of them.</p>
<div class="def"><b>Stakeholder</b>: any person who has an interest in an existing or proposed information system. Stakeholders can be technical or non-technical, internal or external. <span class="src">W1 S8</span></div>
<figure data-dg="stakeholders"><figcaption>The analyst sits between the business side (owners, users) and the technical side (designers, builders). W1 S15 to S17.</figcaption></figure>
<table class="cmp"><thead><tr><th>Group</th><th>Who they are</th><th>Why the analyst needs them</th></tr></thead><tbody>
<tr><td>System owners</td><td>The system's sponsors and executives, also called clients and investors. Usually they pay for the project. <span class="src">S8 to S9</span></td><td>They set the goals, budget and limits, and approve the result.</td></tr>
<tr><td>System users</td><td>People who use the system or are affected by it, and who capture, validate, enter, respond to, store and exchange its data. <span class="src">S10</span></td><td>They know how the work is really done and what goes wrong.</td></tr>
<tr><td>System designers</td><td>Specialists who translate users' requirements into a technical solution: databases, inputs, outputs, screens, networks, software. <span class="src">S12</span></td><td>They turn requirements into blueprints for the builders.</td></tr>
<tr><td>System builders</td><td>Specialists who create the system: they implement components from the designers' specifications, then deploy and maintain them. <span class="src">S8, S12</span></td><td>They tell the analyst what is technically possible and at what cost.</td></tr>
</tbody></table>
<h3>Internal and external users <span class="thin">W1 S11</span></h3>
<div class="two"><div><p><b>Internal users</b></p><ul><li>Clerical and service workers</li><li>Technical and professional staff</li><li>Supervisors, middle managers and executive managers</li></ul></div><div><p><b>External users</b></p><ul><li>Customers, suppliers, partners, employees</li><li><b>Remote users</b>: not on the premises but still need access</li><li><b>Mobile users</b>: location keeps changing; need access from anywhere</li></ul></div></div>
<h3>Two kinds of analyst <span class="thin">W1 S13</span></h3>
<div class="def"><b>Systems analyst</b>: a specialist who studies the problems and needs of an organisation and determines how to improve its processes; responsible for analysing the system to identify problems and suggest solutions.</div>
<div class="def"><b>Business analyst</b>: focuses only on the non-technical aspects of systems analysis and design.</div>
<div class="def"><b>Information worker</b> †: anyone whose job involves creating, collecting, processing, distributing or using information. <b>Knowledge worker</b> †: an information worker whose job rests on a specialised body of knowledge, such as an accountant or an engineer.</div>
<div class="eg"><h4>A university library system</h4><p>Owner: the university's director of library services, who funds it. Internal users: library assistants issuing books. External users: students (some remote, studying online). Designer: the database and screen designer. Builder: the developers who code and deploy it.</p></div>
<div class="trap"><h4>Mixing up client and customer</h4><p>The W2 slide notes separate them: the <b>client</b> is the person or company paying for the project (an owner); the <b>customer</b> is the person who will use the system (a user).</p></div>`);

  L('L03', 'P1', 'The systems analyst and the consultant effect', 'W1 S14 to S17, S34 to S43', `
<p class="lead">The module focuses on the analyst's role. An analyst understands business and computing, solves problems and spots opportunities, and above all finds the source of a problem rather than its symptoms.</p>
<h3>What an analyst needs <span class="thin">W1 S14</span></h3>
<ul><li><b>Knowledge</b>: understands both business and computing.</li><li><b>Problem solver</b>: identifies problems and suggests solutions.</li><li><b>Opportunities</b>: improves a situation even when nobody is complaining.</li></ul>
<h3>Eight skills of the systems analyst <span class="thin">W1 S16</span></h3>
<ol><li>Working knowledge of information technology</li><li>Computer programming experience and expertise</li><li>General business knowledge</li><li>General problem-solving skills</li><li>Good interpersonal communication skills</li><li>Good interpersonal relations skills</li><li>Flexibility and adaptability</li><li>Character and ethics</li></ol>
<p>The analyst works as a <b>facilitator</b> (W1 S17): the bridge between owners and users on one side and designers and builders on the other.</p>
<!--page-->
<h2>The consultant effect <span class="thin">W1 S34 to S40</span></h2>
<div class="def"><b>Consultant effect</b>: people who are part of a problem cannot see its source. Someone outside it comes in with a fresh perspective, is independent, and with the right knowledge can spot inefficiencies, bottlenecks and design problems faster.</div>
<p>The key skill is to identify the <b>source of the problem</b>. Every problem has effects, by-products and symptoms; treating them does not remove the cause.</p>
<figure data-dg="source-problem"><figcaption>The doctor example on W1 S41 to S43: ibuprofen, salt-water gargles and painkillers treat symptoms. The source is a throat infection, which needs antibiotics.</figcaption></figure>
<div class="eg"><h4>Lab case: the supermarket chain (Handout 1)</h4><p>Symptoms reported: expired cans found in three branches, a serious warning from inspectors, 12% losses from thrown-away stock, customer complaints never passed upward. One reasonable analysis: these all point to one source, that nothing records expiry dates or tells staff which items to remove, so the chain relies on shelf-fillers noticing. A fix aimed at the source (recording expiry dates at delivery and alerting staff before expiry) also tackles the 12% loss, which justifies its cost.</p></div>
<div class="tip"><h4>Scenario questions</h4><p>When a case lists complaints, sort them into symptoms and source before proposing anything. Say explicitly: "These are symptoms; the source is…". That sentence is what earns the analysis marks.</p></div>`);

  L('L04', 'P1', 'Business drivers for information systems', 'W1 S18 to S24', `
<p class="lead">Business drivers are business trends that shape the information systems organisations ask for. The slides name five.</p>
<ol class="steps">
<li><b>Globalisation of the economy</b> brings new international markets and new international competition. Systems must support multiple languages, currency exchange rates and business cultures, consolidate international data, and need people who can communicate across languages. <span class="src">S19</span></li>
<li><b>Electronic commerce and business.</b> <span class="src">S20</span>
<div class="def"><b>E-commerce</b>: the buying and selling of goods and services by using the Internet.</div>
<div class="def"><b>E-business</b>: the use of the Internet to conduct and support day-to-day business activities.</div>
Types: marketing of image and products, business-to-consumer (B2C), business-to-business (B2B). Most new systems are designed for an Internet or intranet architecture; with a browser as the only client software, the client operating system matters less.</li>
<li><b>Knowledge asset management.</b> Experienced knowledge workers come and go; their expertise must be preserved. <span class="src">S22</span>
<div class="def"><b>Knowledge</b>: data and information further refined by the facts, truths, beliefs, judgements, experiences and expertise of the recipient.</div>
Knowledge asset management treats data, information and knowledge as critical business resources and integrates them to create and preserve knowledge.</li>
<li><b>Continuous improvement and total quality management.</b> <span class="src">S23</span>
<div class="def"><b>Business processes</b>: the work, procedures and rules required to complete business tasks, independent of any IT used to support them.</div>
<div class="def"><b>Continuous process improvement (CPI)</b>: continuous monitoring of business processes to make small but measurable improvements in cost reduction and value added.</div>
<div class="def"><b>Total quality management (TQM)</b>: a comprehensive approach to facilitating quality improvements and management within a business.</div></li>
<li><b>Business process redesign (BPR)</b>: the study, analysis and redesign of fundamental business processes to reduce costs and/or improve value added. It makes more substantial changes than CPI and is usually complemented by CPI. <span class="src">S24</span></li>
</ol>
<table class="cmp"><thead><tr><th></th><th>CPI</th><th>BPR</th></tr></thead><tbody>
<tr><td>Size of change</td><td>Small, measurable, continuous</td><td>Substantial redesign of fundamental processes</td></tr>
<tr><td>Starting point</td><td>The existing process, tuned</td><td>The process itself questioned and redesigned</td></tr>
<tr><td>Relationship</td><td>Follows BPR to keep improving</td><td>Usually complemented by CPI</td></tr></tbody></table>
<div class="trap"><h4>E-commerce versus e-business</h4><p>E-commerce is only the buying and selling. E-business is broader: any day-to-day business activity carried out or supported online, such as an intranet for staff rotas.</p></div>`);

  L('L05', 'P1', 'Enterprise applications: ERP, SCM and CRM', 'W1 S25 to S30', `
<p class="lead">Virtually every organisation needs a core set of enterprise applications, such as financial management, human resources and sales. They are frequently purchased and frequently need custom elements added.</p>
<div class="def"><b>Systems integration</b>: the process of building a unified information system out of diverse components of purchased software, custom-built software, hardware and networking. <span class="src">W1 S25</span></div>
<div class="def"><b>Enterprise resource planning (ERP)</b>: a collection of integrated software that includes all technology systems and software in the organisation (Haag and Cummings, quoted on W1 S27). The slide notes ERP is the most expensive kind of system, citing US federal spending of $7.7 billion on it in 2009.</div>
<figure data-dg="supply-chain"><figcaption>A supply chain, as on W1 S28 to S29.</figcaption></figure>
<div class="def"><b>Supply chain</b>: the process by which inventory moves from suppliers, through the company, and out as product. <b>Supply chain management</b>: tracking inventory and information through business processes. <b>SCM system</b>: the system that automates that tracking across the company. <span class="src">W1 S28</span></div>
<div class="def"><b>Customer relationship management (CRM) system</b>: uses information about customers to gain insight into their needs, wants and behaviour in order to serve them better (Haag and Cummings); a software application that gives customers access to a business's processes from initial inquiry through post-sale service and support. <span class="src">W1 S30</span></div>
<div class="def"><b>Enterprise application integration</b> †: linking separate applications so that data and information flow between them. <b>Middleware</b> †: the software that makes this possible by letting other software components exchange data and work together.</div>
<div class="tip"><h4>Telling them apart</h4><p>ERP looks inward across the whole organisation. SCM looks backward and forward along the supply chain (suppliers to customers). CRM looks outward at customers. A selfsourcing question may also ask which of them should never be selfsourced: all three (W2 S30).</p></div>`);

  L('L06', 'P1', 'The system development process and its management', 'W1 S31 to S33', `
<p class="lead">System development follows a general problem-solving approach, divided into four broad phases and governed by two kinds of management.</p>
<div class="def"><b>System development process</b>: a set of activities, methods, best practices, deliverables and automated tools that stakeholders use to develop and maintain information systems and software. <span class="src">W1 S31</span></div>
<figure data-dg="problem-steps"><figcaption>The seven-step general problem-solving approach on W1 S31. If step 7 shows the problem is not solved, return to step 1 or 2.</figcaption></figure>
<h3>The four phases <span class="thin">W1 S32</span></h3>
<figure data-dg="four-phases"></figure>
<div class="def"><b>System initiation</b>: the initial planning for a project to define initial business scope, goals, schedule and budget.</div>
<div class="def"><b>System analysis</b>: the study of a business problem domain to recommend improvements and specify the business requirements and priorities for the solution.</div>
<div class="def"><b>System design</b>: the specification or construction of a technical, computer-based solution for the business requirements identified in system analysis.</div>
<div class="def"><b>System implementation</b>: the construction, installation, testing and delivery of a system into production.</div>
<h3>Project management and process management <span class="thin">W1 S33</span></h3>
<table class="cmp"><thead><tr><th></th><th>Project management</th><th>Process management</th></tr></thead><tbody>
<tr><td>Definition</td><td>Defining, planning, directing, monitoring and controlling a project to develop an acceptable system within the allotted time and budget.</td><td>The ongoing activity that defines, improves and coordinates the use of an organisation's chosen methodology and standards for all system development projects.</td></tr>
<tr><td>Scope</td><td>One project, with a start and an end</td><td>Every project, continuously</td></tr>
<tr><td>Typical owner</td><td>A project manager †</td><td>The organisation's methods or standards group</td></tr></tbody></table>
<div class="trap"><h4>Analysis versus design</h4><p>Analysis is about the business problem and <i>what</i> the solution must do. Design is about the technical solution and <i>how</i> it will do it. W7-8 S50 repeats this: analysis emphasises the business problem; design emphasises the solution.</p></div>`);

  L('L07', 'P1', 'The SDLC: seven phases and their outcomes', 'W2 S3 to S17', `
<p class="lead">The lecture opens with a house-building exercise: with a tight deadline and a fixed budget, what steps would you take? The answer is the system development life cycle (SDLC), seven phases each with its own outcome.</p>
<figure data-dg="sdlc"><figcaption>The seven phases and their outcomes, W2 S5 to S16.</figcaption></figure>
<div class="tbl-wrap"><table class="cmp"><thead><tr><th>Phase</th><th>What happens</th><th>Outcome</th></tr></thead><tbody>
<tr><td>1 Planning</td><td>Define what to do, set the scope (size), develop plans, tasks, resources and timeframe.</td><td>Planning report: project plan (what, when, who), critical success factors, project scope document, awareness of scope creep and feature creep, project milestones.</td></tr>
<tr><td>2 Analysis</td><td>IT specialists and users work together (JAD) to understand every requirement: what the client really wants and the customer really needs.</td><td>Business requirements, prioritised, approved and signed off.</td></tr>
<tr><td>3 Design</td><td>Propose the solution; build the technical blueprint for the developers.</td><td>Technical architecture (hardware, software, telecommunications) and system model (graphical representation of the design).</td></tr>
<tr><td>4 Development</td><td>Turn detailed designs into an actual system: build the technical architecture and the programme.</td><td>Progress reports; the product.</td></tr>
<tr><td>5 Testing</td><td>Write the test conditions (what the system has to do) and test the system: it works and meets analysis and design requirements.</td><td>Test reports.</td></tr>
<tr><td>6 Implementation</td><td>Deliver: write detailed guides, give guidance and training.</td><td>User documentation, training (online and workshops), the live system.</td></tr>
<tr><td>7 Maintenance</td><td>Support the system after delivery; minor changes and improvements.</td><td>Help desk; support for system changes.</td></tr></tbody></table></div>
<!--page-->
<h2>Planning terms <span class="thin">W2 S6</span></h2>
<ul>
<li><b>Project plan</b>: what will be done, when, and who is doing the work.</li>
<li><b>Critical success factor (CSF)</b> †: a factor that must go right for the project to succeed.</li>
<li><b>Project scope document</b> †: states what the project will and will not deliver.</li>
<li><b>Scope creep and feature creep</b>: going beyond the original plans. Scope creep † is the scope growing; feature creep † is developers adding features nobody asked for.</li>
<li><b>Project milestone</b> †: a key date by which a group of activities must be finished.</li>
</ul>
<h2>Testing types <span class="thin">W2 S13 notes</span></h2>
<p>The slide notes name four types from the textbook (definitions †): <b>unit testing</b> tests each unit of code on its own; <b>system testing</b> checks the units work together as one system; <b>integration testing</b> checks separate systems work together; <b>user acceptance testing</b> has users confirm the system meets their business needs.</p>
<h2>Implementation methods <span class="thin">W2 S15</span></h2>
<table class="cmp"><thead><tr><th>Method †</th><th>How it works</th><th>Trade-off</th></tr></thead><tbody>
<tr><td>Parallel</td><td>Old and new systems run side by side until the new one is proven.</td><td>Safest; costs double effort while both run.</td></tr>
<tr><td>Plunge</td><td>Old system switched off and new one used at once.</td><td>Cheapest and fastest; riskiest.</td></tr>
<tr><td>Pilot</td><td>One group or site uses the new system first, then everyone.</td><td>Problems found on a small scale.</td></tr>
<tr><td>Phased</td><td>The new system is introduced one part at a time.</td><td>Lower risk; slower to complete.</td></tr></tbody></table>
<h2>Find problems early <span class="thin">W2 S17</span></h2>
<p>Take time in analysis to get the business requirements right. An error fixed early costs relatively little; the same error found in a later phase costs a great deal more.</p>
<figure data-dg="cost-curve"><figcaption>The cost of fixing an error rises the later it is found. The shape is illustrative; the slide gives no figures.</figcaption></figure>`);

  L('L08', 'P1', 'Linear and waterfall approaches', 'W2 S18 to S23', `
<p class="lead">The linear and waterfall approaches use exactly the same seven steps. The difference is whether you may go back.</p>
<figure data-dg="linear-waterfall"><figcaption>W2 S18 to S23. Maintenance follows implementation in both.</figcaption></figure>
<h3>The linear approach <span class="thin">W2 S18 to S20</span></h3>
<p>Planning makes sure you have the resources; analysis gathers everything you need to know; design turns requirements into plans for developers; development is programming; testing checks the application meets requirements; implementation provides support and training as the project closes; maintenance continues to support and improve.</p>
<p><b>Three problems with the linear approach:</b></p>
<ol><li>Very strict: it does not allow going back to fix problems.</li><li>Not client-oriented enough: client contact is limited to the first two stages.</li><li>It assumes clients and customers know what they want from the start.</li></ol>
<h3>The waterfall approach <span class="thin">W2 S22 to S23</span></h3>
<p>As in the linear approach you move forward down the stream, but unlike it you <b>go back up the stream</b> if you find problems that must be fixed. The slide notes point out that the textbook fails to explain this.</p>
<div class="tip"><h4>The lecturer's point</h4><p>Many textbooks describe waterfall as strictly one-way. In this module, waterfall allows going back; linear does not. Write it that way.</p></div>
<p>The "good news" slide (W2 S21): every methodology created to manage information system projects is based on these steps; they differ only in approach, expectation and aspects of delivery. Insourcing teams tend to prefer waterfall: deadlines matter, but going back to fix something is acceptable within reason (W2 S25).</p>`);

  L('L09', 'P1', 'Sourcing: insourcing, selfsourcing, outsourcing', 'W2 S24 to S34', `
<p class="lead">When developing a new system there are three choices about who does the work.</p>
<figure data-dg="sourcing"></figure>
<div class="def"><b>Insourcing</b>: IT specialists inside your organisation build the system. <b>Selfsourcing</b>: end users (knowledge workers) build it themselves with little or no help from IT specialists. <b>Outsourcing</b>: delegating specific work to a third party for a specified length of time, at a specified cost and level of service. <span class="src">W2 S24, S27, S31</span></div>
<h3>Insourcing <span class="thin">W2 S25 to S26</span></h3>
<p>Uses the company's own IT department, which tends to prefer the waterfall approach. Choose it when you have the expertise, when the system is highly sensitive or strategic, or when it is unique (for example, defence systems).</p>
<h3>Selfsourcing <span class="thin">W2 S27 to S30</span></h3>
<p>Usually small or local systems: an employee managing a small website or e-commerce system, spreadsheets, small databases.</p>
<div class="two"><div><p><b>Advantages</b></p><ul><li>Helps find requirements better</li><li>Users participate more and feel ownership</li><li>Faster development</li><li>Reduces the <b>invisible backlog</b>: things the organisation needs but has no time or money to do</li></ul></div><div><p><b>Disadvantages</b></p><ul><li>The developer lacks expertise</li><li>Does not serve a major business need, or IT would do it</li><li>Designs not based on sufficient analysis</li><li>Poor support and guidelines, so systems are short-lived</li></ul></div></div>
<p><b>Never selfsource:</b> infrastructure (network and machine) systems; business intelligence and big strategic systems such as ERP, CRM and SCM; systems that support large numbers of users. The right selfsourcing tools are easy to use, work on different platforms, are cheap and are flexible across data types.</p>
<!--page-->
<h3>Outsourcing <span class="thin">W2 S31 to S34</span></h3>
<p>Popular because of globalisation, the Internet, a growing economy with low unemployment, and technology. Four options: buy existing software; buy it and pay the publisher to modify it; buy it and pay the publisher to let you make the changes; or outsource a completely new system unique to your company.</p>
<div class="two"><div><p><b>Advantages</b></p><ul><li>Reduces costs</li><li>Cost is predictable once the contract is signed</li><li>Improves accountability: you get what you asked for</li><li>Lets the company focus insourcing on core systems</li><li>Uses another company's specialist expertise</li><li>Brings the latest skills and technology</li></ul></div><div><p><b>Disadvantages</b></p><ul><li>Reduces your ability to develop your own skills</li><li>Reduces control: you need that company for changes and upgrades</li><li>Risks exposing strategic systems, possibly to competitors</li><li>Overall, increases dependency on other organisations</li></ul></div></div>
<table class="cmp"><thead><tr><th></th><th>Insourcing</th><th>Selfsourcing</th><th>Outsourcing</th></tr></thead><tbody>
<tr><td>Who builds</td><td>Internal IT staff</td><td>End users</td><td>Third party</td></tr>
<tr><td>Best for</td><td>Sensitive, strategic, unique systems</td><td>Small, local systems</td><td>Non-core systems; specialist needs</td></tr>
<tr><td>Main risk</td><td>Needs in-house expertise</td><td>Poor analysis, short-lived</td><td>Loss of control, dependency</td></tr></tbody></table>
<div class="tip"><h4>Scenario answers</h4><p>Pick one option and justify it against the case: sensitivity, size, number of users, in-house skills, budget certainty. Then name the main risk and how to manage it.</p></div>`);

  L('L10', 'P1', 'Component-based development: RAD, XP and Agile', 'W2 S35 to S44; W7-8 S62', `
<p class="lead">Linear and waterfall assume you build everything from scratch. Component-based development (CBD) starts from reuse.</p>
<div class="def"><b>Component-based development</b>: a general approach to system development that focuses on building small, self-contained blocks of code (components) that can be reused across a variety of applications within an organisation. Examples: a time component, an email component, a credit card processing component. <span class="src">W2 S36</span></div>
<p>CBD changes stages 3 to 5 of the SDLC (design, development and testing). After planning and analysis:</p>
<figure data-dg="cbd"><figcaption>W2 S37: reuse if the library has it; otherwise design, develop and test a new component, use it, and add it to the library.</figcaption></figure>
<p>The slides give three examples of CBD:</p>
<table class="cmp"><thead><tr><th>Method</th><th>Definition</th><th>Key idea</th></tr></thead><tbody>
<tr><td>Rapid application development (RAD)</td><td>Emphasises extensive user involvement in the rapid construction of working prototypes to accelerate development. <span class="src">W2 S39</span> As a design approach: uses structured techniques, prototyping and JAD to develop systems quickly. <span class="src">W7-8 S62</span></td><td>Users and prototypes, fast</td></tr>
<tr><td>Extreme programming (XP)</td><td>Breaks a project into tiny phases; developers cannot continue to the next phase until the current one is complete. Relies heavily on reusing components. Used by Microsoft, Google and Java (slide). <span class="src">W2 S41</span></td><td>Tiny complete phases</td></tr>
<tr><td>Agile methodology</td><td>A form of XP that aims for customer satisfaction through early and continuous delivery of useful software components. <span class="src">W2 S44</span></td><td>Early, continuous delivery</td></tr></tbody></table>
<div class="trap"><h4>RAD in two weeks</h4><p>RAD appears twice: in week 2 as a CBD method, and in week 7-8 as a system design approach that merges data-driven information engineering, prototyping and joint application development. Both are correct; use the one the question's context asks for.</p></div>`);

  L('L11', 'P1', 'Prototyping', 'W2 S45 to S50; W7-8 S57 to S58', `
<p class="lead">Users often can't say what they want, but once they use something they know what they don't want. A prototype is the bridge between talking in the abstract and building the full system.</p>
<p>A prototype might be a paper outline of screens, a video simulation of an interaction or a 3D cardboard mock-up of a device (W2 S45). Cars, aircraft and digital devices are prototyped too.</p>
<div class="def"><b>Prototyping</b>: an iterative process in which you build a model of the business requirements, use it at each stage to help users give better feedback, and enhance it with their input. Users see, work with, evaluate and suggest changes to the models, which increases the success of the system. <span class="src">W2 S46</span></div>
<div class="def"><b>Prototype</b>: a small-scale, incomplete, but working sample of a desired system. <span class="src">W7-8 S57</span></div>
<figure data-dg="proto-loop"><figcaption>The prototyping loop.</figcaption></figure>
<h3>Why prototype <span class="thin">W2 S47</span></h3>
<ul><li>Gather requirements with users' input</li><li>Help users identify what they need, even if they don't know it yet</li><li>Prove the system is technically feasible: a <b>proof-of-concept prototype</b></li><li>Sell the idea of a proposed system: a <b>selling prototype</b></li></ul>
<div class="two"><div><p><b>Advantages</b> <span class="src">W2 S49</span></p><ul><li>Encourages user participation</li><li>Helps resolve differences between users</li><li>Gives users a feel of the system early</li><li>Shows whether it is technically possible</li><li>Sells the idea better</li></ul></div><div><p><b>Disadvantages</b> <span class="src">W2 S50</span></p><ul><li>People believe the final system will come soon</li><li>Gives no indication of operational limitations</li><li>May lead the team not to document or test the final work properly</li></ul></div></div>
<h3>As a design approach <span class="thin">W7-8 S57 to S58</span></h3>
<p>Benefits: active user participation; iteration suits users who change their minds; users won't know what they want until they see it; errors are detected earlier; quicker feedback increases creativity; several life-cycle phases are accelerated. Pitfalls: encourages a "code, implement and repair" cycle that makes maintenance a nightmare; analysis is easy to skip; cannot replace a paper specification; many design issues are not addressed; premature commitment to a design; scope can grow out of control; can reduce creativity; may perform slowly.</p>`);

  L('L12', 'P2', 'UML and the idea of a use case', 'W3 S3 to S7; W7-8 S4', `
<p class="lead">UML gives every diagram in this module a shared notation. The use case diagram is the first one you draw: it shows who uses the system and for what.</p>
<div class="def"><b>UML (Unified Modeling Language)</b>: a standard language for specifying, visualising, constructing and documenting software systems, business modelling and other non-software systems. It represents a collection of best engineering practices, uses mostly graphical notation, and helps teams communicate, explore designs and validate architecture. <span class="src">W3 S3</span></div>
<p>Week 7-8 adds two points: UML is a set of modelling conventions for describing a system in terms of objects, and it <b>does not prescribe a method</b> for developing systems, only a notation (W7-8 S4).</p>
<figure data-dg="uml-families"><figcaption>The UML diagram families on W3 S4 to S5. The slide places use case, activity and state machine under behavioural; interaction diagrams are a kind of behavioural diagram.</figcaption></figure>
<h2>What is a use case? <span class="thin">W3 S6</span></h2>
<ul><li>A use case captures some function the user can see.</li><li>It may be large or small, depending on the level of detail of your model.</li><li>It achieves a <b>discrete goal</b> for the user. Examples: hospital booking, elevator request.</li></ul>
<h2>Three components, plus a boundary <span class="thin">W3 S7, S14</span></h2>
<div class="def"><b>Actor</b>: a person, organisation or external system that plays a role in one or more interactions with your system. Drawn as a stick figure.</div>
<div class="def"><b>Use case</b>: a sequence of actions that provides something of measurable value to an actor. Drawn as a horizontal ellipse.</div>
<div class="def"><b>Association</b>: a solid line between an actor and a use case, present whenever the actor is involved in the interaction the use case describes.</div>
<div class="def"><b>System boundary</b>: a rectangle around the use cases showing the scope of the system and how actors communicate with it.</div>
<figure data-dg="uc-symbols"><figcaption>Every use case symbol in one small diagram: two actors outside the boundary, five use cases, associations, an include, an extend and a generalisation.</figcaption></figure>
<table class="cmp"><thead><tr><th>Symbol</th><th>How it looks</th><th>Read it as</th></tr></thead><tbody>
<tr><td>Actor</td><td>Stick figure with a role name</td><td>"A Customer…"</td></tr>
<tr><td>Use case</td><td>Ellipse with a verb phrase</td><td>"…can Place order"</td></tr>
<tr><td>Association</td><td>Plain solid line</td><td>"takes part in"</td></tr>
<tr><td>Boundary</td><td>Rectangle, system name at top</td><td>"inside the Online shop"</td></tr>
<tr><td>«include»</td><td>Dashed arrow, base → included</td><td>"Place order always includes Check stock"</td></tr>
<tr><td>«extend»</td><td>Dashed arrow, extension → base</td><td>"Apply voucher sometimes extends Place order"</td></tr>
<tr><td>Generalisation</td><td>Solid line, hollow triangle at the parent</td><td>"Pay by card is a kind of Pay"</td></tr></tbody></table>`);

  L('L13', 'P2', 'Actors, use cases, associations and the boundary', 'W3 S8 to S22', `
<p class="lead">Get the four basic elements right and most of the marks follow. Most errors examiners see are about who counts as an actor and how use cases are named.</p>
<h2>Actors <span class="thin">W3 S8 to S9, S21</span></h2>
<p>An actor is <b>outside</b> the system. It can be a human, a peripheral device (hardware), an external system or subsystem, or <b>time</b> (a time-based event, such as a nightly report). Label it with a descriptive noun: Customer, Manager, Patient, Buyer, Supplier. An actor is a <b>role</b>, not a person: the same person can be an employee in one role and a client in another (S9).</p>
<p><b>Finding actors (S21):</b> look for external objects that produce or consume data. They must be sources or destinations of data and must be external to the system: humans, machines, external systems, sensors, organisational units. On the slide, a <b>database</b> and a <b>printer</b> are crossed out: they are part of the system or its output, not actors.</p>
<h2>Use cases <span class="thin">W3 S10 to S12</span></h2>
<div class="def"><b>Use case</b>: a summary of scenarios for a single task or goal. It must have a verb expressing something happening: process, add, delete, update, remove, change, record. <span class="src">W3 S10</span></div>
<div class="eg"><h4>The clinic case (W3 S11 to S12)</h4><p>"A patient calls the clinic to make an appointment for a yearly checkup. The receptionist finds the nearest empty time slot in the appointment book and schedules the appointment." The lecture identifies the actor as the <b>Patient</b> and the use case as <b>Make appointment</b>: the patient's goal, not the receptionist's individual steps.</p></div>
<figure data-dg="uc-clinic"><figcaption>The clinic case as a diagram (W3 S12 to S15). The connection between actor and use case is a communication association.</figcaption></figure>
<h2>Associations and the boundary <span class="thin">W3 S13 to S15</span></h2>
<p>Relationships are drawn as a line (S13 also mentions a double-headed arrow line). They represent communication between actor and use case, and associations between use cases (the special kinds come in the next lesson). The <b>boundary</b> rectangle goes around the perimeter of the system and represents its scope (S14).</p>
<!--page-->
<h2>A complete small diagram: the ATM <span class="thin">W3 S22</span></h2>
<figure data-dg="uc-atm"><figcaption>The annotated ATM example: actor (role), external system actor, use cases numbered 1 to 4, associations and the system boundary named ATM system.</figcaption></figure>
<p>Note the <b>Customer accounts system</b> on the right: an external system is a valid actor because it sits outside the ATM and exchanges data with it.</p>
<h2>How to build one from a case study</h2>
<ol class="steps">
<li>Read the case twice. Underline every person, organisation, device and external system: these are candidate actors.</li>
<li>Remove anything inside the system (its database, its screens, its printer). Keep only things outside that send or receive data.</li>
<li>For each actor, ask "what goal does this actor achieve with the system?" Each goal becomes a use case named verb + noun.</li>
<li>Draw the boundary, put the use cases inside and actors outside, then join each actor to its use cases.</li>
<li>Only now look for shared behaviour (include), optional behaviour (extend) and kinds of actor or use case (generalisation).</li>
</ol>
<div class="trap"><h4>Five errors examiners see</h4><p>An actor drawn inside the boundary; a use case named with a noun ("Appointment") or as a screen step ("Click submit"); a database shown as an actor; lines drawn directly between two actors; arrowheads on plain associations where none are needed.</p></div>`);

  L('L14', 'P2', 'Generalisation, include and extend', 'W3 S23 to S37', `
<p class="lead">Three relationships go beyond the plain association. The slides list them as inheritance (generalisation), include (also called "uses") and extend. Direction is where most marks are lost.</p>
<h2>1 · Generalisation (inheritance) <span class="thin">W3 S25 to S30</span></h2>
<div class="def"><b>Generalisation</b>: the child use case inherits the behaviour and meaning of the parent use case; the child may add to or override the parent's behaviour. It applies to use cases and to actors. <span class="src">W3 S25</span></div>
<p>If we have types of actors or use cases, we can summarise them into types. The sub-element inherits all the use cases of the main element (S29): in the slide notes, an institutional salesperson and a sales manager can do everything a salesperson does.</p>
<figure data-dg="uc-gen-actor"><figcaption>Actor generalisation (W3 S27): non-graduate and graduate students are kinds of Student. Both can View results through inheritance; only the graduate student can Apply for a thesis supervisor.</figcaption></figure>
<figure data-dg="uc-gen-uc"><figcaption>Use case generalisation (W3 S26): graduate and non-graduate registration are kinds of Registration. The hollow triangle touches the parent.</figcaption></figure>
<!--page-->
<h2>2 · Include <span class="thin">W3 S32 to S34</span></h2>
<div class="def"><b>Include</b>: the functionality of one use case is included within another. The arrow is drawn <b>from the base use case to the included one</b>, as a dashed line labelled «include». <span class="src">W3 S32</span></div>
<p>The slide notes add: include is <b>mandatory</b> functionality; it is used only between use cases, never actors; and it removes duplication when several use cases share a piece of behaviour. If a clinic has Make appointment and Request medication, and both need Check patient record, put that check in one use case and include it from both.</p>
<figure data-dg="uc-incl-clinic"><figcaption>The clinic example from the W3 S32 notes.</figcaption></figure>
<figure data-dg="uc-incl-atm"><figcaption>W3 S33: Transfer money always includes Select accounts and Update account balances.</figcaption></figure>
<!--page-->
<h2>3 · Extend <span class="thin">W3 S35 to S37</span></h2>
<div class="def"><b>Extend</b>: the extension of a use case to include optional functionality. The arrow is drawn <b>from the extension use case to the base use case</b>, as a dashed line labelled «extend». <span class="src">W3 S35</span></div>
<figure data-dg="uc-ext-exam"><figcaption>W3 S37: an Exam-grade appeal happens only sometimes, after an Exam copy request, so it extends the request.</figcaption></figure>
<table class="cmp"><thead><tr><th></th><th>«include»</th><th>«extend»</th></tr></thead><tbody>
<tr><td>Does it always happen?</td><td>Yes, mandatory every time the base runs</td><td>No, optional, only under a condition</td></tr>
<tr><td>Arrow starts at</td><td>The base use case</td><td>The extension use case</td></tr>
<tr><td>Arrow points to</td><td>The included use case</td><td>The base use case</td></tr>
<tr><td>Why use it</td><td>Shared behaviour, avoid repeating it</td><td>Keep optional or exceptional behaviour out of the base</td></tr>
<tr><td>Read aloud</td><td>"Transfer money includes Select accounts"</td><td>"Exam-grade appeal extends Exam copy request"</td></tr></tbody></table>
<h2>One example, two answers on the slides</h2>
<figure data-dg="uc-atm-gen"><figcaption>W3 S30: drawn as generalisation, two kinds of withdrawal.</figcaption></figure><figure data-dg="uc-atm-ext"><figcaption>W3 S36: the same use cases drawn as extend.</figcaption></figure>
<div class="tip"><h4>Defend your choice</h4><p>Both versions appear in the lecture. Generalisation says "withdrawing from savings <i>is a kind of</i> withdrawal". Extend says "withdrawing from savings is an optional variation added to the basic withdrawal". In an exam, choose one and write a one-line justification beside it.</p></div>`);

  L('L15', 'P2', 'Building, checking and describing use case diagrams', 'W3 S38 to S43; W7-8 S31 to S35', `
<p class="lead">A use case diagram is a communication tool. It should start a discussion with people outside the development team: owners and users, designers and builders (W3 S42).</p>
<h2>Pros and cons of use case relationships <span class="thin">W3 S43</span></h2>
<div class="two"><div><p><b>Pros</b></p><ul><li>Identify possible reductions of redundancy</li><li>May reduce complexity within a use case</li><li>Improve communication between stakeholders</li><li>Quick and easy to do</li></ul></div><div><p><b>Cons</b></p><ul><li>May add complexity to the diagram</li><li>Take time to develop the skill to draw well</li></ul></div></div>
<h2>Worked example: a food ordering app</h2>
<div class="story"><p>Customers browse the menu and place orders through the app. Every order must be paid for through an external payment provider. Customers may enter a promo code when ordering. Kitchen staff update each order's status, delivery riders confirm delivery, and customers can track their order.</p></div>
<figure data-dg="uc-food"><figcaption>Payment is mandatory every time an order is placed, so Place order includes Pay for order. A promo code is optional, so Apply promo code extends Place order. The payment provider is an external system actor.</figcaption></figure>
<!--page-->
<h2>Checklist before you hand it in</h2>
<ul class="checks"><li>☐ Every actor outside the boundary and named as a role</li><li>☐ Every use case inside, named verb + noun, one goal each</li><li>☐ No database, printer or screen drawn as an actor</li><li>☐ No line from actor to actor; no include or extend touching an actor</li><li>☐ Include arrows start at the base; extend arrows start at the extension</li><li>☐ Every stereotype labelled «include» or «extend»</li><li>☐ Generalisation triangle on the parent</li><li>☐ Boundary named after the system</li></ul>
<h2>Use case narratives <span class="thin">W7-8 S25, S32 to S35</span></h2>
<p>The diagram shows <i>which</i> use cases exist. A <b>use case narrative</b> describes each one in text: the sequence of steps of the interaction (W7-8 S25). In object modelling, step 1 is constructing the analysis use case model (S32): identify and document new actors and use cases, identify reuse, refine the diagram, then document system analysis narratives.</p>
<table class="cmp"><thead><tr><th>Narrative field</th><th>What goes in it</th></tr></thead><tbody>
<tr><td>Use case name and ID</td><td>Verb phrase and a reference, such as MSS-UC001.00</td></tr>
<tr><td>Priority and source</td><td>How important; where the requirement came from</td></tr>
<tr><td>Actors</td><td>Primary business actor and other participating actors</td></tr>
<tr><td>Description</td><td>A short summary of the goal</td></tr>
<tr><td>Precondition and trigger</td><td>What must be true before it starts; what starts it</td></tr>
<tr><td>Typical course of events</td><td>Numbered actor and system steps for the normal path</td></tr>
<tr><td>Alternate courses</td><td>What happens at each step if something differs</td></tr>
<tr><td>Postcondition</td><td>What is true when it ends</td></tr>
<tr><td>Business rules, assumptions, open issues</td><td>Constraints and things still to confirm</td></tr></tbody></table>
<p>An <b>abstract use case narrative</b> (S35) is the same layout for a use case that other use cases include, such as "Determine appropriate distribution centre and release order to be filled".</p>
<div class="def"><b>System analysis use case</b>: a use case that documents the interaction between the system user and the system. It is highly detailed in describing what is required but free of most implementation details and constraints. <span class="src">W7-8 S32</span></div>`);
})(window.BOOK);
