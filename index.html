  L('L37', 'P7', 'Use cases in the textbook: the use case form and the UML diagram', 'Dennis 8e Ch 4 pp 112–133 · 5e Ch 14 pp 517–521', `
<p class="lead">The 8th edition treats a use case mainly as a <b>written form</b> that describes how the system responds to one event. The 5th edition’s UML chapter adds the <b>diagram</b> you draw in the TCA.</p>
<div class="levels">
<section data-t="Beginner"><p>Everything a system does is a reaction to an event: a customer asks for something, or a time arrives. A use case writes down, step by step, what the user and the system do in response.</p></section>
<section data-t="Exam standard"><ul><li><b>Trigger types:</b> external (an actor does something) or temporal (a time or date arrives).</li><li><b>Form sections:</b> name, ID, priority, actor, description, trigger, preconditions, normal course, postconditions, plus alternative paths, exceptions and a summary of inputs and outputs.</li><li><b>Four steps to create:</b> identify the use cases, identify the major steps, identify the elements in each step, confirm with users.</li></ul></section>
<section data-t="Examiner"><p>Use cases are written in <b>essential</b>, technology-free language (“selects a model”, not “clicks the drop-down”). Postconditions of one use case are the preconditions of the next, which is how a large task is split into a chain of reusable use cases.</p></section></div>
<h2>A use case form (casual format)</h2>
<table class="cmp form"><tbody>
<tr><th>Name / ID / Priority</th><td>Book fitness class · UC-3 · High</td></tr>
<tr><th>Actor</th><td>Member</td></tr>
<tr><th>Description</th><td>A member books a place on a timetabled class.</td></tr>
<tr><th>Trigger · Type</th><td>Member wants to attend a class · External</td></tr>
<tr><th>Preconditions</th><td>Member is logged in; the class is in the timetable.</td></tr>
<tr><th>Normal course</th><td>1 Member chooses a class. 2 System shows places left. 3 Member confirms. 4 System records the booking and reduces places by one. 5 System sends a confirmation.</td></tr>
<tr><th>Alternative path</th><td>2a No places left: system offers the waiting list.</td></tr>
<tr><th>Postconditions</th><td>Booking stored; places updated; confirmation sent.</td></tr>
<tr><th>Inputs → outputs</th><td>Class choice, confirmation (from member) → booking (to Bookings store), confirmation message (to member).</td></tr></tbody></table>
<figure data-dg="bk-uc-chain"><figcaption>A big goal split into a chain of use cases: each one’s postconditions are the next one’s preconditions.</figcaption></figure>
<!--page-->
<h2>The event-response list</h2>
<p>Before writing forms, list each <b>event</b> and the system’s <b>response</b>. Each event usually becomes one use case, and later one DFD fragment. DrōnTeq’s list includes “Client requests a drone flight → open flight request created” and “Flight is completed → sensor data uploaded, analysis started, client notified”.</p>
<h2>The UML use case diagram (5th edition, Ch 14)</h2>
<table class="cmp"><thead><tr><th>Element</th><th>Rule in the book</th></tr></thead><tbody>
<tr><td>Actor</td><td>A role, not a named person; a person or system that gets value from the system and is outside it. A specialised actor points to a general one with a hollow triangle.</td></tr>
<tr><td>Association</td><td>A line from actor to use case; the book may add * at each end for “many times by many actors”.</td></tr>
<tr><td>Use case</td><td>An oval inside the boundary, named with a verb–noun phrase.</td></tr>
<tr><td>Include / extend</td><td>Dashed arrows between use cases for shared and optional behaviour.</td></tr>
<tr><td>System boundary</td><td>A box with the system name; it marks the scope.</td></tr></tbody></table>
<div class="trap"><h4>Is the receptionist an actor?</h4><p><span class="tag book">Textbook</span> A data-entry clerk who keys in data for patients is <b>inside</b> the system’s scope, so not an actor (the same rule as DFD external entities). <span class="tag lec">CN7039</span> Your lecturer’s clinic example names the patient as the first actor. Many UML texts do draw staff who operate the system as actors. In the TCA, decide, state your assumption in one line, and stay consistent across your four diagrams.</p></div>
<div class="tip"><h4>Use cases drive everything</h4><p>In UML the use case diagram is drawn first; class, sequence and state diagrams build on it. In the structured approach, each use case becomes a DFD fragment (Lesson 38).</p></div>`);

  L('L38', 'P7', 'DFDs in the textbook: notation, five steps and the checklist', 'Dennis 8e Ch 4 pp 134–161', `
<p class="lead">The textbook builds a full set of DFDs from the use cases, then checks them with a quality checklist. The rules match your lecture; the shapes do not.</p>
<div class="levels">
<section data-t="Beginner"><p>Data never moves on its own and a process never makes data from nothing. Every arrow needs a process at one end, and every process needs something in and something out.</p></section>
<section data-t="Exam standard"><ul><li>Five steps: context diagram → one fragment per use case → Level 0 → Level 1 and below → validate.</li><li>Names: processes are verb phrases (no “and”); flows, stores and entities are nouns.</li><li>The law of conservation of data: (1) data at rest stays at rest until a process moves it; (2) processes cannot consume or create data.</li></ul></section>
<section data-t="Examiner"><p>Name the error type correctly: <b>syntax</b> errors break the drawing rules (sinkhole, miracle, two-headed arrow, unbalanced levels); <b>semantic</b> errors misrepresent the business (wrong process, wrong data). Say which you found.</p></section></div>
${bridge}
<!--page-->
<h2>Five steps from use cases to DFDs</h2>
<figure data-dg="bk-dfd-steps"><figcaption>The textbook’s order of work.</figcaption></figure>
<ol class="steps">
<li><b>Context diagram:</b> one process numbered 0 named after the system; the external entities; the main inputs and outputs from the use case forms. No stores. If data sits in another organisation’s system, show that system as an external entity.</li>
<li><b>DFD fragments:</b> one per use case, using its name, inputs, outputs and the stores it needs. Rename to verb phrases and keep one viewpoint (the organisation’s, not the customer’s).</li>
<li><b>Level 0:</b> join the fragments; order processes roughly in time; use 3 to 7 processes.</li>
<li><b>Level 1 and below:</b> decompose a process using the steps in its use case; number children 2.1, 2.2 and grandchildren 2.1.1.</li>
<li><b>Validate:</b> check syntax and semantics with the checklist below; walk users through it.</li></ol>
<div class="trap"><h4>3 to 7 or 3 to 6?</h4><p><span class="tag book">Textbook</span> 3 to 7 processes per DFD. <span class="tag lec">CN7039</span> Your lecture says 3 to 6 on a Level 0 diagram (W6 S26). Stay within 3 to 6 and you satisfy both.</p></div>
<h2>Quality checklist (8e Figure 4-24, summarised)</h2>
<table class="cmp"><thead><tr><th>Element</th><th>Syntax checks</th></tr></thead><tbody>
<tr><td>Process</td><td>Unique verb-phrase name, number, description; at least one input and one output; outputs named differently from inputs.</td></tr>
<tr><td>Data flow</td><td>Noun name; touches at least one process; one direction only (no two-headed arrows); few crossing lines.</td></tr>
<tr><td>Data store</td><td>Noun name; at least one flow in and one flow out somewhere in the set of DFDs.</td></tr>
<tr><td>External entity</td><td>Noun name; at least one flow.</td></tr>
<tr><td>Across levels</td><td>One context diagram; consistent viewpoint; every parent process fully decomposed; balancing.</td></tr></tbody></table>
<p><b>Semantic checks:</b> ask users to validate it, role-play the processes, check decomposition is consistent and the terms match the business’s own words.</p>
<div class="tip"><h4>Read a store with one flow carefully</h4><p>A store that only shows an input on this diagram is not automatically wrong: the read may appear on another level or in another system. Say so if you are asked to critique a single diagram.</p></div>`);

  L('L39', 'P7', 'ERDs in the textbook: identifiers, dependent entities and the CRUD matrix', 'Dennis 8e Ch 5 pp 170–193', `
<p class="lead">Chapter 5 uses crow’s foot notation, like your lectures, and adds vocabulary that examiners like: identifiers, modality, intersection entities, dependent entities and balancing with the DFD.</p>
<div class="levels">
<section data-t="Beginner"><p>An entity is something you keep many records about. Each record needs an identifier. Lines between entities say how many of one can go with the other, and whether one must exist.</p></section>
<section data-t="Exam standard"><ul><li><b>Cardinality</b> = the maximum (1 or many); <b>modality</b> = the minimum (null = optional, not null = required). Your lecture calls modality “optionality”.</li><li><b>Intersection (associative) entity</b>: resolves M:N in three steps.</li><li><b>Independent</b> entity: own identifier. <b>Dependent</b> entity: identifier includes the parent’s key (identifying relationship).</li></ul></section>
<section data-t="Examiner"><p>Show you balanced the models: every data store on the DFD should be an entity, every data element in a flow should be an attribute somewhere, and a CRUD matrix proves each entity is created, read, updated and deleted by some process.</p></section></div>
<h2>Rules for the three elements</h2>
<table class="cmp"><thead><tr><th>Element</th><th>Textbook rules</th></tr></thead><tbody>
<tr><td>Entity</td><td>Person, place, event or thing; singular name in capitals; has an identifier; must have <b>more than one instance</b> (a company with one warehouse needs no WAREHOUSE entity).</td></tr>
<tr><td>Attribute</td><td>A property used by at least one business process; broken down to its most useful level; often prefixed with the entity (CUS_Email).</td></tr>
<tr><td>Relationship</td><td>Parent (usually the one side) and child (the many side); named with a verb read both ways (places / is placed by); has cardinality and modality.</td></tr></tbody></table>
<h3>Three ways to choose an identifier</h3>
<ol><li><b>Concatenated identifier</b>: combine fields (last name + first name).</li><li><b>Single unique field</b>: a customer number.</li><li><b>Add later</b>: let the system generate one in design.</li></ol>
<!--page-->
<h2>Resolving M:N in three steps</h2>
<ol class="steps"><li>Remove the M:N line and put a new entity between the two.</li><li>Draw two 1:N relationships with the original entities as parents and the new entity as the child of both.</li><li>Name it, often by joining the two names (ORDERED COMPONENT), and give it attributes that belong to the pair, such as quantity.</li></ol>
<figure data-dg="erd-mn-fixed"><figcaption>Here the new middle entity is <b>dependent</b>: its identifier is made of its parents’ keys, so both relationships are identifying.</figcaption></figure>
<div class="two"><div class="def"><b>Independent entity</b>: identified by its own attributes; drawn with a single border. The relationship to it from a parent is non-identifying.</div><div class="def"><b>Dependent entity</b>: needs at least one parent attribute in its identifier; the textbook draws it with a double border. The relationship is identifying.</div></div>
<p class="small"><b>Is every intersection entity dependent?</b> Not always: if the pair has its own natural identifier (a transcript number for a student–course pair), it can be independent.</p>
<h2>Balancing the ERD with the DFD: the CRUD matrix</h2>
<p>List processes along the top and entities down the side; write C, R, U or D where the process creates, reads, updates or deletes that entity’s data. An empty row means data that no process uses; an entity never created means a process is missing.</p>
<table class="cmp crud"><thead><tr><th></th><th>1 Register member</th><th>2 Lend book</th><th>3 Return book</th><th>4 Reserve book</th></tr></thead><tbody>
<tr><td>MEMBER</td><td>C</td><td>R</td><td>R</td><td>R</td></tr>
<tr><td>BOOK</td><td></td><td>R U</td><td>U</td><td>R</td></tr>
<tr><td>LOAN</td><td></td><td>C</td><td>U</td><td>R</td></tr>
<tr><td>RESERVATION</td><td></td><td>U</td><td>R</td><td>C</td></tr></tbody></table>
<p class="muted small">Example of my own for a library. Nothing deletes members here: either add a process or record the assumption that members are kept.</p>
<div class="tip"><h4>Write your assumptions</h4><p>The textbook stresses that data models rest on business rules. When a case is unclear (can an order exist without a customer?), write the assumption next to the diagram. Examiners give credit for a stated, sensible assumption.</p></div>`);

  L('L40', 'P7', 'Normalisation: first, second and third normal form', 'Dennis 8e Ch 5 App 5A pp 196–201', `
<p class="lead">Normalisation checks that each attribute sits in the right entity, so data is stored once and cannot contradict itself. The textbook does it in three steps.</p>
<div class="levels">
<section data-t="Beginner"><p>If the same fact is written in many rows (an advisor’s name next to every student), it will eventually be typed differently somewhere. Normalisation moves each fact to the one place it belongs.</p></section>
<section data-t="Exam standard"><ul><li><b>1NF:</b> no repeating attributes or groups; split them into a new entity. Each cell holds one value.</li><li><b>2NF:</b> 1NF, and every non-key attribute depends on the <b>whole</b> identifier (no partial dependency).</li><li><b>3NF:</b> 2NF, and no non-key attribute depends on another non-key attribute (no transitive dependency); derived attributes such as age are removed.</li></ul></section>
<section data-t="Examiner"><p>Only entities with a <b>concatenated</b> identifier can have partial dependencies, so look for 2NF problems there first. Name the dependency: “ModuleTitle depends only on ModuleCode, part of the key (StudentID, ModuleCode), so it is a partial dependency.”</p></section></div>
<h2>Worked example: a student record file</h2>
<p><b>Unnormalised.</b> One record per student, with a repeating group of modules:</p>
<table class="cmp"><thead><tr><th>StudentID</th><th>StudentName</th><th>AdvisorID</th><th>AdvisorName</th><th>ModuleCode, ModuleTitle, Grade (repeats)</th></tr></thead><tbody>
<tr><td>S1</td><td>Asha</td><td>A7</td><td>Dr Khan</td><td>CN7039, Software Eng, 68 · CN7050, Data Mining, 72</td></tr>
<tr><td>S2</td><td>Ben</td><td>A7</td><td>Dr Khan</td><td>CN7039, Software Eng, 59</td></tr></tbody></table>
<p><b>1NF.</b> Move the repeating group into its own entity whose identifier is StudentID + ModuleCode:</p>
<p class="mono small">STUDENT(<u>StudentID</u>, StudentName, AdvisorID, AdvisorName)<br>STUDENT MODULE(<u>StudentID, ModuleCode</u>, ModuleTitle, Grade)</p>
<p><b>2NF.</b> ModuleTitle depends only on ModuleCode, part of the key. Move it out:</p>
<p class="mono small">MODULE(<u>ModuleCode</u>, ModuleTitle)<br>STUDENT MODULE(<u>StudentID, ModuleCode</u>, Grade)</p>
<p><b>3NF.</b> AdvisorName depends on AdvisorID, which is not the key of STUDENT. Move it out:</p>
<p class="mono small">ADVISOR(<u>AdvisorID</u>, AdvisorName)<br>STUDENT(<u>StudentID</u>, StudentName, AdvisorID)</p>
<figure data-dg="bk-nf-3nf"><figcaption>The result in 3NF, drawn as a crow’s foot ERD. Grade stays in Enrolment because it depends on both the student and the module.</figcaption></figure>
<div class="tip"><h4>A one-line test for each form</h4><p>1NF: one value per cell. 2NF: the whole key. 3NF: nothing but the key. Lecture link: Lesson 17 (keys) and Lesson 19 (associative entities).</p></div>`);

  L('L41', 'P7', 'Moving into design: acquisition and architecture (Lab 9)', 'Dennis 8e Ch 6 pp 206–219, Ch 7 pp 223–231 · Lab 9 · Handouts 9–10', `
<p class="lead">Design starts with two decisions: <b>how to get the system</b> (build, buy or outsource) and <b>where its software runs</b> (the architecture). Lab 9 and Handouts 9 and 10 ask you to define the layers and match them to architectures.</p>
<div class="levels">
<section data-t="Beginner"><p>Every program does four jobs: store data, fetch it, apply the business rules, and show results to the user. Architecture decides which computer does each job: the user’s device, a server, or several servers.</p></section>
<section data-t="Exam standard"><ul><li>Acquisition: custom development, packaged software, outsourcing; compare them with an <b>alternative matrix</b> (weighted criteria × scores).</li><li>Four functions: data storage, data access logic, application logic, presentation logic.</li><li>Thin client = little application logic on the client; thick (fat) client = most of it.</li></ul></section>
<section data-t="Examiner"><p>Tie the choice to the nonfunctional requirements: operational (where it runs), performance (speed, capacity), security, cultural and political. For example, many web users and low maintenance point to a thin-client, three-tier design.</p></section></div>
<h2>Build, buy or outsource</h2>
<table class="cmp"><thead><tr><th>Strategy</th><th>Use when</th><th>Watch out for</th></tr></thead><tbody>
<tr><td>Custom development</td><td>The need is unique or gives an advantage; in-house skills exist.</td><td>Time, cost, risk.</td></tr>
<tr><td>Packaged software</td><td>The need is common (payroll, accounting); speed matters.</td><td>The business may have to change to fit the package; customisation and workarounds.</td></tr>
<tr><td>Outsourcing</td><td>Skills are missing in-house or cost must be fixed.</td><td>Dependence on the vendor, loss of control and knowledge, contract terms.</td></tr></tbody></table>
<p>The <b>alternative matrix</b> lists criteria (cost, fit, risk, time) with weights, scores each option, multiplies and adds, and makes the comparison visible to the sponsor.</p>
<!--page-->
<h2>Architecture: where the four functions run</h2>
<figure data-dg="bk-tiers"><figcaption>Two-tier and three-tier client–server. Adding tiers spreads the load and lets each part change independently.</figcaption></figure>
<ul><li><b>Server-based:</b> the server (historically a mainframe) does all four functions; clients only send keystrokes and show screens. Simple and secure, but the server can become overloaded.</li>
<li><b>Client–server:</b> the client does presentation, the server does data access and storage; application logic is on either. Scalable and vendor-neutral, but more complex to build and update. <b>Middleware</b> translates between different vendors’ software.</li>
<li><b>n-tier:</b> separate web, application and database servers.</li></ul>
<h2>Lab 9: the five layers</h2>
<table class="cmp"><thead><tr><th>Layer</th><th>What it does</th><th>Textbook function</th></tr></thead><tbody>
<tr><td>Presentation</td><td>What the user sees and types into: screens, forms, reports.</td><td rowspan="2">Presentation logic</td></tr>
<tr><td>Presentation logic</td><td>Handles the interaction: navigation, formatting, simple input checks.</td></tr>
<tr><td>Application logic</td><td>The business rules and processing (the DFD processes).</td><td>Application logic</td></tr>
<tr><td>Data manipulation</td><td>Commands that store and retrieve data, usually SQL.</td><td>Data access logic</td></tr>
<tr><td>Data</td><td>The stored data itself: files or database tables.</td><td>Data storage</td></tr></tbody></table>
<h3>Which layers sit where (Handout 9 table)</h3>
<table class="cmp"><thead><tr><th>Architecture</th><th>Client</th><th>Server</th></tr></thead><tbody>
<tr><td>File server</td><td>Presentation, presentation logic, application logic, data manipulation</td><td>Data only (shared files); whole files travel over the network</td></tr>
<tr><td>Client/server (two-tier)</td><td>Presentation, presentation logic, application logic</td><td>Data manipulation and data (a database server)</td></tr>
<tr><td>Distributed presentation</td><td>Presentation: a new graphical front end</td><td>Everything else stays on the existing (often legacy) server</td></tr>
<tr><td>Distributed data</td><td>Presentation, presentation logic, application logic</td><td>Data manipulation and data on a database server</td></tr>
<tr><td>Distributed data and application (three-tier)</td><td>Presentation, presentation logic</td><td>Application logic on an application server; data manipulation and data on a database server</td></tr>
<tr><td>Internet/intranet</td><td>Presentation in a web browser</td><td>Presentation logic on a web server; application logic on an application server; data manipulation and data on a database server</td></tr></tbody></table>
<p class="muted small">Built from Lab 9, Handouts 9 and 10 and the textbook. The week 9 and 10 lecture slides were not available, so check the distributed rows against your own lab notes.</p>
<h3>Server types</h3>
<ul><li><b>Database server:</b> stores the database and runs the data manipulation (SQL).</li><li><b>Transaction server:</b> runs business transactions as units that complete fully or not at all.</li><li><b>Application server:</b> runs the application logic between clients and databases.</li><li><b>Messaging or groupware server:</b> email, calendars, shared documents.</li><li><b>Web server:</b> sends web pages to browsers over HTTP.</li></ul>`);

  L('L42', 'P7', 'Program design: physical DFDs, structure charts, cohesion and coupling', 'Dennis 8e Ch 9 pp 301–330', `
<p class="lead">In design, the logical DFD (what happens) becomes a <b>physical DFD</b> (how it will be done), and processes become program modules arranged in a <b>structure chart</b>.</p>
<div class="levels">
<section data-t="Beginner"><p>A logical DFD says “store the order”. A physical DFD says “insert a row into the MySQL Orders table using the PHP web app”. Same diagram, more detail about technology and people.</p></section>
<section data-t="Exam standard"><ol><li>Add implementation references (tables, programs, forms).</li><li>Draw the human–machine boundary.</li><li>Add system-related stores, flows and processes (logs, backups).</li><li>Update data elements in the flows (IDs, timestamps).</li><li>Update the metadata in the CASE repository.</li></ol></section>
<section data-t="Examiner"><p>Good modules have <b>high cohesion</b> (do one job) and <b>loose coupling</b> (pass only the data they need). Name the type: functional cohesion is best and coincidental worst; data coupling is best and content coupling worst.</p></section></div>
<figure data-dg="bk-phys-dfd"><figcaption>A physical DFD: technology is named on processes, stores and flows; the dashed human–machine boundary separates automated work from manual work; the audit log is a system-related store added in step 3. External entities do not change.</figcaption></figure>
<div class="trap"><h4>Logical versus physical in your lecture</h4><p><span class="tag lec">CN7039</span> W6 S32 to S33 and Lab 9: a logical DFD describes what the business does; a physical DFD shows how it is implemented (for example MS SQL stores and Sage Accounting processes in the Lab 9 sample). Lesson 24 has the lecture version.</p></div>
<!--page-->
<h2>Structure charts</h2>
<p>A structure chart shows program modules as boxes in a hierarchy, with the control module at the top. Arrows show calls; small symbols show data passed (data couples) and flags passed (control couples). Loops and conditional calls are marked too.</p>
<h2>Cohesion: does each module do one thing?</h2>
<table class="cmp"><thead><tr><th>Type (best → worst)</th><th>Meaning</th><th>Example of my own</th></tr></thead><tbody>
<tr><td>Functional</td><td>One task</td><td>Calculate booking price</td></tr>
<tr><td>Sequential</td><td>Output of one task feeds the next</td><td>Validate and format postcode</td></tr>
<tr><td>Communicational</td><td>Tasks share the same input or output</td><td>Calculate total and VAT from the basket</td></tr>
<tr><td>Procedural</td><td>Steps in sequence that share no data</td><td>Print report (housekeeping, then output)</td></tr>
<tr><td>Temporal</td><td>Tasks that happen at the same time</td><td>Initialise program variables</td></tr>
<tr><td>Logical</td><td>Several possible tasks; a flag picks one</td><td>Do customer transaction (open account or take loan, by flag)</td></tr>
<tr><td>Coincidental</td><td>No relationship</td><td>Do miscellaneous jobs</td></tr></tbody></table>
<p><b>Factoring</b> fixes poor cohesion: split the module so each new module does one job. A module name with “and” in it is the warning sign.</p>
<h2>Coupling: how much do modules depend on each other?</h2>
<table class="cmp"><thead><tr><th>Type (best → worst)</th><th>Meaning</th></tr></thead><tbody>
<tr><td>Data</td><td>Pass only the specific data items needed.</td></tr>
<tr><td>Stamp</td><td>Pass a whole record when only part is used.</td></tr>
<tr><td>Control</td><td>Pass a flag that tells the other module what to do.</td></tr>
<tr><td>Common</td><td>Modules share a global data area.</td></tr>
<tr><td>Content</td><td>One module refers to the inside of another.</td></tr></tbody></table>
<p>Also aim for <b>high fan-in</b> (a module reused by many callers) and <b>limited fan-out</b> (a module should not control too many subordinates).</p>`);

  L('L43', 'P7', 'Testing, conversion and managing change', 'Dennis 8e Ch 11 pp 372–379 · Ch 12 pp 392–413', `
<p class="lead">Implementation is building, testing and installing. Chapter 11 sets out four stages of testing; Chapter 12 explains how to switch from the old system to the new one and why people resist.</p>
<div class="levels">
<section data-t="Beginner"><p>Test the parts, then the parts together, then the whole system, then let users try it. Switch over carefully: all at once is fast but risky; running both is safe but costly.</p></section>
<section data-t="Exam standard"><ul><li>Tests: unit (black-box or white-box), integration, system, acceptance (alpha, then beta).</li><li>Conversion: style (direct, parallel), location (pilot, phased, simultaneous), modules (whole system, modular).</li><li>Lewin: unfreeze, move, refreeze.</li></ul></section>
<section data-t="Examiner"><p>Recommend a strategy with its trade-off: parallel conversion lowers risk but doubles users’ work; pilot conversion adds a real-world test but needs the organisation to tolerate two systems for a while.</p></section></div>
<h2>Four stages of testing</h2>
<table class="cmp"><thead><tr><th>Stage</th><th>Checks</th><th>Done by</th></tr></thead><tbody>
<tr><td>Unit</td><td>One module does what its specification says. <b>Black-box</b>: tests from the specification without reading code (most common). <b>White-box</b>: tests the code itself, for complex modules. Stubs stand in for modules not yet written.</td><td>Analyst or programmer</td></tr>
<tr><td>Integration</td><td>Modules work together. Four approaches: user interface testing, use scenario testing, data flow testing, system interface testing.</td><td>Programmers and analysts</td></tr>
<tr><td>System</td><td>The whole system meets the business requirements; usability, security, performance under heavy load, documentation.</td><td>Analysts</td></tr>
<tr><td>Acceptance</td><td><b>Alpha</b>: users test with made-up data. <b>Beta</b>: users start with real data and watch for errors.</td><td>Users, supported by the team</td></tr></tbody></table>
<div class="tip"><h4>Lecture link</h4><p><span class="tag lec">CN7039</span> Lesson 7 names unit, integration, system and user acceptance testing in the testing phase. The V-model (Lesson 35) pairs each with a design level.</p></div>
<!--page-->
<h2>Conversion strategy: three dimensions</h2>
<table class="cmp"><thead><tr><th>Dimension</th><th>Options</th><th>Trade-off</th></tr></thead><tbody>
<tr><td>Style</td><td><b>Direct</b> (old off, new on) · <b>Parallel</b> (both run for a period)</td><td>Direct is cheap and risky; parallel is safe and costly.</td></tr>
<tr><td>Location</td><td><b>Pilot</b> (one site first) · <b>Phased</b> (groups of sites in turn) · <b>Simultaneous</b> (all at once)</td><td>Pilot and phased limit damage but take longer; simultaneous needs staff everywhere at once.</td></tr>
<tr><td>Modules</td><td><b>Whole system</b> · <b>Modular</b> (one module at a time)</td><td>Modular lowers risk but each module must work with the old and new systems.</td></tr></tbody></table>
<div class="trap"><h4>Plunge = direct</h4><p><span class="tag lec">CN7039</span> Your lecture lists parallel, plunge, pilot and phased. <b>Plunge</b> is the textbook’s <b>direct conversion</b>.</p></div>
<h2>People and change</h2>
<ul><li><b>Lewin’s model:</b> <b>unfreeze</b> the old habits (show why change is needed), <b>move</b> to the new system (the migration plan: training, support), <b>refreeze</b> so the new way becomes normal.</li>
<li>People weigh the costs and benefits of change for themselves, weighted by how sure they are; most overestimate costs and underestimate benefits.</li>
<li>For a change with real benefits, roughly 20–30% are <b>ready adopters</b>, 20–30% are <b>resistant adopters</b>, and the rest are <b>reluctant adopters</b> who can be persuaded.</li>
<li>Motivate adoption with an informational strategy (explain the benefits) or a political strategy (someone with authority requires or rewards it); enable it with training.</li></ul>
<h2>After installation</h2>
<p><b>System support</b> (help desk, online help), <b>system maintenance</b> (fixing and changing the system after launch) and <b>project assessment</b> (a project team review of lessons learned, and a system review a few months later to check the promised value arrived).</p>`);

  L('L44', 'P7', 'Agile development and Scrum', 'Dennis 8e Ch 13 pp 418–437', `
<p class="lead">Chapter 13 explains agile methods in depth, using Scrum as the main example. Your lecture covers agile and XP briefly (Lesson 10); this is the detail behind it.</p>
<div class="levels">
<section data-t="Beginner"><p>Instead of one long project, the team works in short sprints of two to four weeks. Each sprint delivers working software chosen from a prioritised list of features.</p></section>
<section data-t="Exam standard"><ul><li><b>Roles:</b> product owner, ScrumMaster, development team (about 5 to 9 people).</li><li><b>Artefacts:</b> product backlog, sprint backlog, the working increment.</li><li><b>Events:</b> sprint planning, daily stand-up, sprint review, sprint retrospective.</li></ul></section>
<section data-t="Examiner"><p>Explain how Scrum measures progress: stories are sized in <b>story points</b>; <b>velocity</b> is the points a team completes per sprint and decides how much to commit to next time; a burndown chart shows the remaining work.</p></section></div>
<h2>Scrum roles</h2>
<table class="cmp"><tbody>
<tr><th>Product owner</th><td>Represents the business; owns and prioritises the product backlog; accepts or rejects the work; responsible for the product’s value.</td></tr>
<tr><th>ScrumMaster</th><td>A servant leader, not a project manager: coaches the team in Scrum, removes obstacles, shields the team from interference.</td></tr>
<tr><th>Development team</th><td>Self-organising, cross-functional, about 5 to 9 people; nobody assigns their tasks.</td></tr></tbody></table>
<h2>User stories and story points</h2>
<p class="eg">As a <b>gym member</b>, I want to <b>book a class on my phone</b>, so that <b>I do not have to queue at reception</b>.</p>
<p>Teams size each story by comparing it with others, using a modified Fibonacci scale: 1, 2, 3, 5, 8, 13, 20, 40, 100. A very large story is an <b>epic</b> and must be split.</p>
<!--page-->
<h2>A sprint in five steps</h2>
<ol class="steps"><li><b>Sprint planning:</b> using its velocity, the team picks top backlog items and turns them into the sprint backlog of tasks.</li>
<li><b>Daily stand-up:</b> a short daily meeting: what I did, what I will do, what is blocking me.</li>
<li><b>Work:</b> build, test and integrate during the sprint.</li>
<li><b>Sprint review:</b> demonstrate working software to the product owner and stakeholders.</li>
<li><b>Retrospective:</b> the team reflects on how it worked and agrees improvements.</li></ol>
<figure class="chart"><svg class="dg" viewBox="0 0 560 260" role="img" aria-label="Sprint burndown chart"><line class="ln thin" x1="60" y1="20" x2="60" y2="210"/><line class="ln thin" x1="60" y1="210" x2="540" y2="210"/>
<text class="t xs" x="52" y="24" text-anchor="end">40</text><text class="t xs" x="52" y="117" text-anchor="end">20</text><text class="t xs" x="52" y="210" text-anchor="end">0</text>
<text class="t xs" x="60" y="228" text-anchor="middle">Day 0</text><text class="t xs" x="300" y="228" text-anchor="middle">Day 5</text><text class="t xs" x="540" y="228" text-anchor="middle">Day 10</text>
<polyline class="ln dash" points="60,24 540,210"/><polyline class="ln" style="stroke:var(--accent);stroke-width:2.5" points="60,24 108,33 156,47 204,47 252,70 300,89 348,107 396,117 444,145 492,173 540,201"/>
<text class="t xs" x="430" y="120" text-anchor="start">ideal</text><text class="t xs" x="250" y="60" text-anchor="start">actual</text><text class="t s" x="300" y="250" text-anchor="middle">Story points remaining in a 10-day sprint</text></svg><figcaption>A burndown chart of my own: the team fell behind mid-sprint, then caught up.</figcaption></figure>
<h2>SDLC-based methods versus agile</h2>
<table class="cmp"><thead><tr><th></th><th>Waterfall-style SDLC</th><th>Agile (Scrum)</th></tr></thead><tbody>
<tr><td>Requirements</td><td>Fixed early, written in detail</td><td>Evolve; user stories and conversation</td></tr>
<tr><td>Delivery</td><td>One release at the end</td><td>Working software every sprint</td></tr>
<tr><td>Documentation</td><td>Heavy</td><td>Light</td></tr>
<tr><td>Best for</td><td>Stable, well-understood, large or regulated systems</td><td>Changing requirements, small committed teams, users available</td></tr></tbody></table>`);

  L('L45', 'P7', 'UML in the textbook: class syntax, sequence and state machine diagrams', 'Dennis 5e Ch 14 pp 503–539', `
<p class="lead">The 5th edition’s last chapter introduces object-oriented analysis and four core UML diagrams: use case, class, sequence and behavioural state machine. It adds class-diagram detail you can use in the TCA and theory on two diagrams you only need to recognise.</p>
<div class="levels">
<section data-t="Beginner"><p>A class is a template; an object is one real example. The class diagram shows what the system stores and how classes relate; the sequence diagram shows the messages objects send each other in one scenario; the state machine shows how one object changes over its life.</p></section>
<section data-t="Exam standard"><ul><li>Visibility: <b>+</b> public, <b>#</b> protected, <b>−</b> private. Attributes default to private, operations to public.</li><li>A derived attribute starts with a slash: <b>/age</b>.</li><li>Operations are constructors, queries or updates.</li></ul></section>
<section data-t="Examiner"><p>Object-oriented analysis in the Unified Process is <b>use-case driven</b>, <b>architecture-centric</b>, and <b>iterative and incremental</b>. Say how the diagrams fit: use cases first, then class and sequence diagrams refined together, state machines for complex classes.</p></section></div>
<h2>Class diagram details from the textbook</h2>
<table class="cmp"><tbody>
<tr><th>Attributes</th><td>Describe an object’s state. Show visibility; mark derived ones with / (they are calculated, not stored).</td></tr>
<tr><th>Operations</th><td><b>Constructor</b> creates an object (usually not drawn); <b>query</b> returns information without changing the object; <b>update</b> changes attribute values. Operations every class has (get, set, create, delete) are not drawn.</td></tr>
<tr><th>Associations</th><td>Named with a verb phrase or role names; a small solid triangle can show the reading direction; multiplicity at both ends (min..max).</td></tr>
<tr><th>Generalisation, aggregation, composition</th><td>As in your lecture (Lessons 26 and 27).</td></tr></tbody></table>
<div class="tip"><h4>Same idea as the ERD, different mechanism</h4><p>Associations work like ERD relationships, but objects hold <b>references</b> to each other rather than foreign keys.</p></div>
<!--page-->
<h2>Sequence diagram</h2>
<figure data-dg="bk-seq"><figcaption>Objects across the top (anObject:Class), lifelines down, thin boxes where an object is active, solid arrows for messages in time order, dashed arrows for returns. A condition goes in square brackets before a message; an X ends a temporary object’s lifeline.</figcaption></figure>
<h2>Behavioural state machine</h2>
<figure data-dg="bk-state"><figcaption>An Order object’s life: rounded boxes are states, the filled dot is the start, the bull’s-eye is the end, arrows are transitions labelled with the event; [square brackets] hold a guard condition.</figcaption></figure>
<p>Draw a state machine only for classes with a complex life (orders, applications, claims), after the class diagram is stable.</p>
<div class="trap"><h4>Theory only</h4><p><span class="tag lec">CN7039</span> As relayed in your brief, sequence and activity diagrams are theory only in the TCA, and the state machine is not on the lecture slides at all. Recognise and describe them; spend drawing practice on the four core diagrams.</p></div>`);

  C('L09', 'Selfsourcing', 'End users (knowledge workers) build the system with little or no help from IT specialists.', 'A manager’s spreadsheet or small database.', 'Never for infrastructure, ERP/CRM/SCM or many users.', 'W2 S24, S27');

  /* L10 */

  /* L12 */
  C('L12', 'UML', 'Unified Modeling Language: a standard, mostly graphical language for specifying, visualising, constructing and documenting software systems. It gives notation, not a method.', '', '', 'W3 S3; W7-8 S4');
  C('L12', 'UML diagram families', 'Structural (class, object, component, deployment, composite structure, package); behavioural (use case, activity, state machine); interaction (sequence, communication, interaction overview, timing).', '', '', 'W3 S4', 'Name the three families of UML diagrams with examples.');
  C('L12', 'Use case', 'A summary of scenarios for a single task or goal; a sequence of actions giving measurable value to an actor. Drawn as a horizontal ellipse named with a verb.', 'Make appointment.', 'Not a screen step.', 'W3 S6 to S7, S10');

  C('L14', '"Uses" relationship', 'Another name the slides give for include.', '', '', 'W3 S23 to S24');
  /* L15 */

  C('L15', 'System analysis use case', 'Documents the interaction between the system user and the system in detail, free of most implementation details.', '', '', 'W7-8 S32');
  /* L16 */
  C('L16', 'Database', 'A collection of data; a large centralised shared data repository.', 'University student records.', 'Can be non-electronic (a filing cabinet).', 'W4-5 S3 to S4');

  C('L16', 'Record', 'A set of fields containing data about one related topic, person or item; a row.', '', '', 'W4-5 S8');
  C('L16', 'Field', 'One single item of data with a data type; a column.', 'Address.', '', 'W4-5 S9');

  C('L18', 'Entity relationship diagram (ERD)', 'A tool to model databases, showing entities (tables), relationships (links) and attributes (fields).', '', '', 'W4-5 S27');
  C('L18', 'Entity', 'A thing of independent existence on which you may wish to hold data.', 'Employee, Department.', 'An entity becomes a table.', 'W4-5 S28');
  C('L18', 'Relationship (ERD)', 'An interaction between entities, named with a clear verb, ideally one word.', '"A student enrols in a Programme."', '', 'W4-5 S28, S30');
  C('L18', 'Attribute (ERD)', 'A descriptive property or characteristic of an entity.', 'Name, DateOfBirth.', 'Becomes a field.', 'W4-5 S48');
  C('L18', 'Compound attribute', 'An attribute made up of other attributes.', 'Address = street, city, postcode.', '', 'W4-5 S48');
  C('L18', 'Optionality', 'The minimum number of instances of the related entity.', 'A circle means zero (optional); a bar means one (mandatory).', 'Cardinality is the maximum.', 'W4-5 S31');
  C('L18', 'Cardinality', 'The maximum number of instances of the related entity.', 'A crow’s foot means many; a bar means one.', 'Optionality is the minimum.', 'W4-5 S31');
  C('L18', 'Crow’s foot ends', 'Two bars: one and only one. Circle and bar: zero or one. Bar and crow’s foot: one or many. Circle and crow’s foot: zero or many.', '', '', 'W4-5 S34, S50', 'Name the four crow’s foot ends.');
  C('L18', 'Why model a database?', 'To understand users’ needs, detect missing data, detect problems before implementation and improve design.', '', '', 'W4-5 S26');
  /* L19 */
  C('L19', 'Many-to-many problem', 'A many-to-many relationship cannot be implemented directly; it must be resolved at ERD level.', 'Employee works on Project.', '', 'W4-5 S38 to S39');

  C('L19', 'Key (identifier)', 'An attribute or group of attributes that has a unique value for each entity instance.', '', '', 'W4-5 S49');
  C('L19', 'Concatenated key', 'A group of attributes that together uniquely identify an instance; also composite or compound key.', '(OrderNo, ProductID).', '', 'W4-5 S49');
  C('L19', 'Candidate key', 'Any key that could serve as the primary key.', 'StudentID and Civil_ID.', '', 'W4-5 S49');
  C('L19', 'Alternate key', 'A candidate key not selected as the primary key; also secondary key.', 'Civil_ID if StudentID is primary.', '', 'W4-5 S49');

  C('L19', 'Strong entities', 'Entities in a relationship that each have their own independent primary key, not shared.', '', '', 'W4-5 S53');
  C('L19', 'Nonspecific relationship', 'The textbook’s name for a many-to-many relationship.', '', '', 'W4-5 S54');
  C('L19', 'Generalisation (ERD)', 'Common attributes of several entity types grouped into a supertype; subtypes inherit them and add their own.', 'Person → Student, Staff.', '', 'W4-5 S57');
  C('L19', 'Supertype and subtype (ERD)', 'Supertype: stores attributes common to its subtypes. Subtype: inherits them and adds attributes unique to itself.', '', '', 'W4-5 S57');
  /* L20 */

  C('L20', 'Default value', 'The value recorded if the user does not specify one: a legal value, NULL, or REQUIRED.', 'Quantity defaults to 1.', '', 'W4-5 S67');

  C('L22', 'Sinkhole (black hole)', 'A process with inputs but no outputs.', '', '', 'W6 S8');

  C('L22', 'Entity-to-store flow', 'Not allowed: a process is needed between a database and an entity.', '', '', 'W6 S15');

  C('L27', 'Multiplicity', 'The minimum and maximum number of occurrences of one class for a single occurrence of the related class: 1, 0..1, 0..*, 1..*, 7..9.', '', 'Like cardinality plus optionality in an ERD.', 'W7-8 S18');

  C('L29', 'Cohesion', 'How focused a module is: highly cohesive modules do one function only.', '', 'Aim high.', 'W7-8 S53');
  C('L29', 'Coupling', 'How dependent modules are on one another: loosely coupled modules are minimally dependent.', '', 'Aim low.', 'W7-8 S53');
  C('L29', 'Information engineering', 'A model-driven, data-centred but process-sensitive technique for planning, analysing and designing systems; main tool is the ERD.', '', '', 'W7-8 S55');
  C('L29', 'Object-oriented design (OOD)', 'Refines object requirements from analysis and defines design-specific objects; tries to remove the separation of data and process.', '', '', 'W7-8 S60');

(function (B) {

  /* ---------- L01 ---------- */
  M('L01', 'According to the Week 1 slides, a system is best defined as:', ['A set of computers connected by a network', 'Anything that takes an input and produces an output', 'Software that stores data in tables', 'A group of people working towards a goal'], 1, 'W1 S5: a system is anything that takes an input and generates an output, and it is not exclusive to computers.');
  M('L01', 'Which of these is information rather than data?', ['42', 'Blue', '"Stock of item 113 is 4, below its reorder level of 10"', '17/11/2026'], 2, 'Information is data with a particular meaning in a specific context (W1 S7). The others are raw facts.');
  M('L01', 'Which is NOT one of the system examples on W1 S6?', ['Respiratory system', 'Printing system', 'Health system', 'Solar system'], 3, 'The slide lists air conditioning, respiratory, printing, health and computer systems.');
  T('L01', 'A system must involve a computer.', false, 'W1 S5 says a system is not exclusive to computers; the respiratory system is an example.', 'A system is anything that takes an input and produces an output, with or without a computer.');

  T('L01', 'Information technology and an information system are the same thing.', false, 'IT (hardware, software, networks) is one component of an IS, which also includes people, data and processes.', 'IT is one component of an information system.');
  W('L01', 'define', 'Define <b>data</b> and <b>information</b>, and give an example that shows the difference.', 'Data: raw facts describing a phenomenon, such as a temperature reading. Information: data with a particular meaning in a specific context, such as "the server room is at 31 °C, above its 27 °C limit". (W1 S7)', ['Data defined as raw facts', 'Information defined as data with meaning in context', 'An example showing the same fact as data and as information'], 3);
  W('L01', 'explain', 'Explain why the Week 1 slides insist that a system is "not exclusive to computers". Give two examples.', 'A system is defined by input → process → output, not by technology. The respiratory system takes in air and outputs oxygenated blood and carbon dioxide; a printing system takes documents and outputs printed pages. Analysts therefore model manual procedures and people as part of the system too.', ['Input → process → output definition', 'Two valid non-computer examples', 'Point that analysts model people and manual procedures as well'], 4);

  /* ---------- L02 ---------- */
  M('L02', 'Who usually pays for an information system project?', ['System users', 'System owners', 'System builders', 'System designers'], 1, 'W1 S9: owners are the sponsors and executives, usually responsible for paying.');
  M('L02', 'A sales representative who needs access from customers’ sites, airports and trains is best described as a:', ['Remote user', 'Internal user', 'Mobile user', 'System owner'], 2, 'A mobile user’s location is constantly changing (W1 S11). A remote user is off-site but at a fixed place.');
  M('L02', 'Who translates users’ requirements into a technical solution such as databases, screens and networks?', ['System builders', 'System designers', 'Business analysts', 'System owners'], 1, 'W1 S12.');
  M('L02', 'A business analyst differs from a systems analyst because a business analyst:', ['Writes the code', 'Focuses only on non-technical aspects', 'Pays for the project', 'Tests the system'], 1, 'W1 S13.');
  T('L02', 'Stakeholders can be technical or non-technical, internal or external.', true, 'W1 S8.');
  T('L02', 'System builders design the databases, inputs and outputs that meet users’ requirements.', false, 'That is the designers’ job. Builders implement components from the designers’ specifications (W1 S12).', 'System designers design databases, inputs and outputs; builders implement them.');
  T('L02', 'Customers and suppliers can be system users.', true, 'They are external system users (W1 S11).');
  T('L02', 'In the Week 2 notes, the client is the person who will use the system.', false, 'The client pays for the project; the customer uses the system (W2 S7 notes).', 'The client pays; the customer uses the system.');
  W('L02', 'compare', 'Compare <b>system designers</b> and <b>system builders</b>.', 'Designers are specialists who translate users’ requirements into a technical solution: they design databases, inputs, outputs, screens, networks and software. Builders are specialists who create the system: they implement components from the designers’ specifications, then deploy and maintain them. Designers produce the blueprint; builders construct from it.', ['Designer definition', 'Builder definition', 'Designers specify, builders implement', 'An example or the blueprint analogy'], 4);
  W('L02', 'scenario', 'A council is replacing its parking-permit system. Identify one system owner, two internal users, two external users, a designer and a builder.', 'Owner: the council’s head of parking services who funds it. Internal users: permit-office clerks; enforcement officers. External users: residents applying online (remote); visitors buying permits on phones (mobile). Designer: the database and screen designer. Builder: the developers who code and deploy it. (W1 S8 to S12)', ['Owner correctly identified', 'Two internal users', 'Two external users', 'Designer', 'Builder', 'Roles justified'], 6);

  /* ---------- L03 ---------- */
  M('L03', 'The "consultant effect" means that:', ['Consultants are cheaper than staff', 'People who are part of a problem cannot see its source', 'Consultants always recommend outsourcing', 'Analysts must be external to the organisation'], 1, 'W1 S34: an outsider brings a fresh, independent view.');
  M('L03', 'In the doctor example, which is the source of the problem?', ['Fever', 'Sore throat', 'Headache', 'Throat infection'], 3, 'W1 S43: the others are symptoms.');

  T('L03', 'Treating each symptom of a problem separately will normally remove its source.', false, 'The doctor example shows symptoms can be treated while the cause (the infection) remains (W1 S41 to S43).', 'You must identify and treat the source of the problem.');

  W('L03', 'explain', 'Explain the consultant effect and why it helps a systems analyst.', 'People inside a problem cannot see its source. An outside analyst brings a fresh perspective, is independent of internal politics, and with the right knowledge spots inefficiencies, bottlenecks and design problems faster. The key skill is identifying the source of the problem rather than its symptoms. (W1 S34 to S40)', ['Definition', 'Fresh perspective and independence', 'Spots inefficiencies, bottlenecks or design problems', 'Link to finding the source not the symptoms'], 4);
  W('L03', 'scenario', 'Lift case (Handout 1): an 18-floor block of 216 flats has 3 lifts that always send the nearest lift. Residents wait too long from 7:30 to 8:30 and 17:30 to 18:30, because in the morning lifts end up on the ground floor and in the evening on the top floors. Identify the source of the problem and suggest how to change the lifts’ behaviour.', 'Symptom: long waits at peak times. Source: the lifts’ idle (parking) position ignores the time of day, so they wait where the last passenger left them. A fix aimed at the source: programme time-based parking, sending idle lifts to upper floors in the morning peak and to the ground floor in the evening peak, using the 2 to 5 minute gaps between residents to reposition. Any estimate of time saved should state its assumptions, such as average floors travelled.', ['Separates symptom from source', 'Source identified as where idle lifts park', 'Time-based repositioning proposed', 'Uses the 2 to 5 minute gaps', 'States assumptions for any time saving'], 6);

  T('L04', 'Business processes depend on the information technology used to support them.', false, 'They are the work, procedures and rules required to complete business tasks, independent of any IT (W1 S23).', 'Business processes are independent of the IT that supports them.');
  T('L04', 'Globalisation means information systems may need to support multiple languages and currency exchange rates.', true, 'W1 S19.');
  W('L04', 'compare', 'Compare continuous process improvement (CPI) with business process redesign (BPR).', 'CPI: continuous monitoring of business processes to make small but measurable improvements in cost reduction and value added. BPR: the study, analysis and redesign of fundamental business processes to reduce costs and/or improve value added. BPR makes much bigger changes; CPI tunes existing processes and usually follows BPR. (W1 S23 to S24)', ['CPI definition', 'BPR definition', 'Scale of change contrasted', 'BPR usually complemented by CPI'], 4);
  W('L04', 'define', 'Define <b>knowledge</b> and explain knowledge asset management.', 'Knowledge: data and information further refined by the facts, truths, beliefs, judgements, experiences and expertise of the recipient. Knowledge asset management recognises data, information and knowledge as critical business resources and integrates them to create and preserve knowledge, for example when experienced staff leave. (W1 S22)', ['Knowledge definition', 'KAM treats data, information and knowledge as resources', 'Purpose: create and preserve knowledge'], 3);

  /* ---------- L05 ---------- */
  M('L05', 'Which system "uses information about customers to gain insights into their needs, wants and behaviour"?', ['ERP', 'SCM', 'CRM', 'DBMS'], 2, 'W1 S30.');
  M('L05', 'The process by which inventory moves from suppliers, through the company, and out as product is the:', ['Value chain', 'Supply chain', 'Business process', 'Systems integration'], 1, 'W1 S28.');
  M('L05', 'Building one unified system from purchased software, custom software, hardware and networking is called:', ['Systems integration', 'Selfsourcing', 'Prototyping', 'Process management'], 0, 'W1 S25.');
  T('L05', 'ERP is described on the slides as a collection of integrated software including all technology systems and software in the organisation.', true, 'W1 S27, quoting Haag and Cummings.');
  T('L05', 'Enterprise applications are always built from scratch.', false, 'They are frequently purchased and frequently need custom elements added (W1 S25).', 'Enterprise applications are often purchased and then customised.');
  W('L05', 'compare', 'Distinguish ERP, SCM and CRM systems, with an example of each.', 'ERP: integrated software covering all systems in the organisation, such as finance, HR and stock in one package. SCM system: automates tracking of inventory and information along the supply chain, such as tracking deliveries from suppliers to stores. CRM system: uses customer information to understand and serve customers, giving them access from inquiry to after-sales support, such as a call-centre view of a customer’s history. (W1 S27 to S30)', ['ERP definition and example', 'SCM definition and example', 'CRM definition and example'], 6);

  /* ---------- L06 ---------- */
  M('L06', 'Which phase is "the study of a business problem domain to recommend improvements and specify the business requirements"?', ['System initiation', 'System analysis', 'System design', 'System implementation'], 1, 'W1 S32.');
  M('L06', 'The last step of the general problem-solving approach is:', ['Implement the solution', 'Design the solution', 'Evaluate the results', 'Identify alternatives'], 2, 'W1 S31: if the problem is not solved, return to step 1 or 2.');
  M('L06', 'The ongoing activity that defines and improves an organisation’s chosen methodology for all projects is:', ['Project management', 'Process management', 'Systems integration', 'Quality assurance'], 1, 'W1 S33.');
  T('L06', 'Project management applies to all of an organisation’s development projects continuously.', false, 'That is process management. Project management is for one project, within its time and budget (W1 S33).', 'Process management covers all projects; project management covers one project.');
  T('L06', 'System implementation includes construction, installation, testing and delivery into production.', true, 'W1 S32.');
  W('L06', 'compare', 'Compare <b>project management</b> and <b>process management</b>.', 'Project management: defining, planning, directing, monitoring and controlling one project to develop an acceptable system within the allotted time and budget. Process management: the ongoing activity that defines, improves and coordinates the organisation’s chosen methodology and standards for all projects. One is temporary and project-specific; the other is permanent and organisation-wide. (W1 S33)', ['Project management definition', 'Process management definition', 'One project vs all projects', 'Temporary vs ongoing'], 4);
  W('L06', 'explain', 'List the seven steps of the general problem-solving approach.', '1 Identify the problem. 2 Analyse and understand it. 3 Identify solution requirements or expectations. 4 Identify alternative solutions and choose the best. 5 Design the chosen solution. 6 Implement it. 7 Evaluate the results; if not solved, return to step 1 or 2. (W1 S31)', ['Steps 1 to 3', 'Steps 4 to 6', 'Step 7 with the loop back'], 4);

  /* ---------- L07 ---------- */
  M('L07', 'Business requirements that are prioritised and signed off are the outcome of which phase?', ['Planning', 'Analysis', 'Design', 'Testing'], 1, 'W2 S7.');
  M('L07', 'Technical architecture and a system model are outcomes of:', ['Planning', 'Design', 'Development', 'Implementation'], 1, 'W2 S8 to S9.');
  M('L07', 'Which implementation method runs the old and new systems side by side?', ['Plunge', 'Pilot', 'Parallel', 'Phased'], 2, 'W2 S15 names the methods; parallel runs both.');
  M('L07', 'A help desk is set up during:', ['Testing', 'Implementation', 'Maintenance', 'Analysis'], 2, 'W2 S16.');
  M('L07', 'Users confirming the system meets their business needs is:', ['Unit testing', 'Integration testing', 'User acceptance testing', 'System testing'], 2, 'W2 S13 notes.');
  T('L07', 'Fixing an error found during maintenance usually costs less than fixing it during analysis.', false, 'W2 S17: the cost of fixing an error early is small; in later stages it is huge.', 'Errors cost far more to fix the later they are found.');
  T('L07', 'Scope creep and feature creep mean going beyond the original plans.', true, 'W2 S6.');
  T('L07', 'JAD is the phase in which IT specialists and users work together.', true, 'W2 S7 describes analysis this way and names JAD.');
  T('L07', 'Test conditions describe what the system has to do.', true, 'W2 S13.');
  W('L07', 'explain', 'Name the seven SDLC phases and give one outcome of each.', 'Planning: planning report (project plan, CSFs, scope document, milestones). Analysis: prioritised, signed-off business requirements. Design: technical architecture and system model. Development: progress reports and the product. Testing: test reports. Implementation: user documentation and training. Maintenance: help desk and support for changes. (W2 S5 to S16)', ['All seven phases in order', 'Correct outcome for at least five phases', 'Correct outcome for all seven'], 7);
  W('L07', 'compare', 'Compare parallel, plunge, pilot and phased implementation.', 'Parallel: old and new run side by side until the new is proven; safest, costly. Plunge: switch to the new system at once; cheapest, riskiest. Pilot: one group or site uses it first; problems found small-scale. Phased: introduce it one part at a time; lower risk, slower. (Methods named W2 S15; descriptions are textbook standard.)', ['Parallel', 'Plunge', 'Pilot', 'Phased', 'A trade-off for each'], 6);
  W('L07', 'scenario', 'A hospital is replacing its patient-records system and cannot afford any loss of records. Recommend an implementation method and justify it.', 'Parallel implementation: run both systems until the new one is proven, so records are never lost and outputs can be compared. The cost is double data entry for a period; a pilot on one ward first could reduce the risk further. (W2 S15)', ['Chooses parallel (or justified pilot)', 'Links to zero data loss', 'Mentions the cost or trade-off', 'Clear recommendation'], 4);

  /* ---------- L08 ---------- */
  M('L08', 'What is the key difference between the linear and waterfall approaches in this module?', ['Waterfall has fewer phases', 'Waterfall allows going back to fix problems', 'Linear involves the client more', 'Linear skips testing'], 1, 'W2 S23. The slide notes say the book fails to explain this.');
  M('L08', 'Which is a problem with the linear approach?', ['It reuses too many components', 'It assumes clients know what they want from the start', 'It has no planning phase', 'It is too client-oriented'], 1, 'W2 S20.');
  T('L08', 'In the linear approach, client contact is limited to the first two stages.', true, 'W2 S20.');
  T('L08', 'Waterfall and linear use different steps.', false, 'They use exactly the same steps; waterfall allows going back (W2 S18, S22 to S23).', 'They use the same seven steps.');
  T('L08', 'Insourcing teams tend to prefer the waterfall approach.', true, 'W2 S25.');
  W('L08', 'compare', 'Compare the linear and waterfall approaches.', 'Both follow the same seven phases from planning to maintenance (W2 S18 to S19, S22). Linear is very strict and does not allow going back to fix problems; it limits client contact to the first two stages and assumes clients know what they want from the start (S20). Waterfall moves down the stream in the same way but allows going back up when problems must be fixed (S23).', ['Same seven phases', 'Linear: no going back', 'Linear’s other two problems', 'Waterfall: can go back up'], 4);

  /* ---------- L09 ---------- */
  M('L09', 'A defence ministry needs a highly sensitive, unique system. The slides recommend:', ['Outsourcing', 'Selfsourcing', 'Insourcing', 'Purchasing off the shelf'], 2, 'W2 S26.');
  M('L09', 'Things the organisation needs to do but has no time or money for are the:', ['Scope creep', 'Invisible backlog', 'Critical success factors', 'Milestones'], 1, 'W2 S28.');
  M('L09', 'Which system should never be selfsourced?', ['A manager’s expense spreadsheet', 'A small club database', 'An organisation-wide CRM', 'A department’s web page'], 2, 'W2 S30: never selfsource big strategic systems such as ERP, CRM, SCM.');
  M('L09', 'Which is an advantage of outsourcing?', ['Builds in-house skills', 'Predictable cost once the contract is signed', 'Increases control', 'Reduces dependency'], 1, 'W2 S33.');
  T('L09', 'Selfsourcing helps find requirements better because users build the system themselves.', true, 'W2 S28.');
  T('L09', 'Outsourcing reduces your dependency on other organisations.', false, 'It increases dependency (W2 S34).', 'Outsourcing increases dependency on other organisations.');
  T('L09', 'Selfsourced systems tend to be short-lived because they lack good support and guidelines.', true, 'W2 S29.');
  W('L09', 'compare', 'Compare insourcing, selfsourcing and outsourcing, giving when each is appropriate.', 'Insourcing: own IT staff; when you have the expertise, or the system is sensitive, strategic or unique. Selfsourcing: end users build it; small, local systems such as spreadsheets; never for infrastructure, ERP/CRM/SCM or many users. Outsourcing: a third party for a set time, cost and service; non-core systems, specialist expertise, predictable cost, but less control and more dependency. (W2 S24 to S34)', ['Insourcing with when to use', 'Selfsourcing with when to use and limits', 'Outsourcing with when to use', 'A risk of at least one option'], 6);
  W('L09', 'scenario', 'A 12-person accountancy firm wants a simple database to track client deadlines. One partner is confident with spreadsheets and databases. Which sourcing option would you suggest, and what risks would you warn about?', 'Selfsourcing suits a small, local system used by few people, built by a knowledge worker who understands the requirements; it is fast and cheap and reduces the invisible backlog (W2 S27 to S28). Risks: the partner lacks development expertise, the design may lack proper analysis, and with little support or documentation the system may be short-lived (S29). Mitigate by documenting it and backing it up.', ['Chooses selfsourcing with justification', 'Two advantages', 'Two risks', 'A mitigation'], 6);

  /* ---------- L10 ---------- */
  M('L10', 'Component-based development focuses on:', ['Building every system from scratch', 'Reusing small self-contained blocks of code', 'Outsourcing development', 'Writing documentation first'], 1, 'W2 S36.');
  M('L10', 'Which approach breaks a project into tiny phases that must each be complete before the next starts?', ['RAD', 'XP', 'Waterfall', 'Prototyping'], 1, 'W2 S41.');
  M('L10', 'Agile methodology is described as:', ['A form of XP aiming at early and continuous delivery of useful components', 'A linear approach with sign-off', 'Selfsourcing by end users', 'A data modelling technique'], 0, 'W2 S44.');
  T('L10', 'Linear and waterfall approaches do not consider the reuse of software.', true, 'W2 S36.');
  T('L10', 'In CBD, if no suitable component exists in the library, the team builds one and adds it to the library.', true, 'W2 S37.');
  T('L10', 'RAD minimises user involvement to speed up development.', false, 'RAD emphasises extensive user involvement in rapidly building working prototypes (W2 S39).', 'RAD emphasises extensive user involvement.');
  W('L10', 'explain', 'Explain how component-based development changes the design, development and testing phases.', 'After planning and analysis, the team searches the software library for reusable components and uses them if found. Otherwise it designs, develops and tests a new component, uses it in the project and adds it to the library for future use. This speeds up development across applications. (W2 S37)', ['Search the library first', 'Reuse if found', 'Otherwise design, develop, test a new component', 'Add it to the library'], 4);

  /* ---------- L11 ---------- */
  M('L11', 'A prototype built to prove a system is technically feasible is a:', ['Selling prototype', 'Proof-of-concept prototype', 'Throwaway report', 'Pilot'], 1, 'W2 S47.');
  M('L11', 'Which is a disadvantage of prototyping on W2 S50?', ['Encourages user participation', 'People may believe the final system will come soon', 'Helps resolve differences between users', 'Sells the idea better'], 1, '');
  T('L11', 'Prototyping is an iterative process.', true, 'W2 S46.');
  T('L11', 'A prototype gives a reliable indication of the final system’s operational limitations.', false, 'It gives no indication of operational limitations (W2 S50).', 'A prototype gives no indication of operational limitations.');
  T('L11', 'A prototype can be as simple as a paper outline of screens.', true, 'W2 S45.');
  W('L11', 'explain', 'Give four reasons for prototyping and two disadvantages.', 'Reasons (W2 S47): gather requirements with users’ input; help users identify what they need; prove the system is technically feasible; sell the idea of the system. Disadvantages (S50): people think the final system will come soon; no indication of operational limitations; the team may not document or test the final work properly.', ['Four reasons', 'Two disadvantages'], 6);

  /* ---------- L12 ---------- */
  M('L12', 'UML stands for:', ['Universal Model Logic', 'Unified Modeling Language', 'Unified Method Library', 'User Modelling Layer'], 1, 'W3 S3.');
  M('L12', 'Which UML diagram family does the class diagram belong to?', ['Structural', 'Behavioural', 'Interaction', 'Data flow'], 0, 'W3 S4.');
  M('L12', 'A use case is drawn as:', ['A stick figure', 'A rectangle', 'A horizontal ellipse', 'A diamond'], 2, 'W3 S7.');
  M('L12', 'The rectangle around the use cases represents:', ['A database', 'The scope of the system', 'An actor group', 'A data store'], 1, 'W3 S14.');
  T('L12', 'UML prescribes a method for developing systems.', false, 'UML provides notation only, not a method (W7-8 S4).', 'UML provides a notation, not a development method.');
  T('L12', 'An association exists whenever an actor is involved in the interaction a use case describes.', true, 'W3 S7.');
  T('L12', 'The use case diagram is a behavioural UML diagram.', true, 'W3 S4.');
  W('L12', 'define', 'Define the three components of a use case diagram listed on W3 S7.', 'Actor: a person, organisation or external system that plays a role in one or more interactions with the system; a stick figure. Use case: a sequence of actions giving something of measurable value to an actor; a horizontal ellipse. Association: a solid line showing an actor is involved in a use case’s interaction.', ['Actor', 'Use case', 'Association'], 3);

  /* ---------- L13 ---------- */
  M('L13', 'Which of these should NOT be drawn as an actor?', ['A payment gateway the system calls', 'A nightly time trigger', 'The system’s own customer database', 'A supplier'], 2, 'W3 S21 crosses out database and printer.');
  M('L13', 'In the clinic case on W3 S11 to S12, the use case is:', ['Receptionist', 'Appointment book', 'Make appointment', 'Find empty slot'], 2, 'The patient’s single goal.');
  M('L13', 'Which name is best for a use case?', ['Invoice', 'Click the submit button', 'Process invoice', 'Invoice database'], 2, 'A use case has a verb expressing something happening (W3 S10).');
  M('L13', 'The ATM diagram on W3 S22 shows the Customer Accounts System as:', ['A use case', 'An external system actor', 'A data store', 'The boundary'], 1, '');
  T('L13', 'An actor is outside the system.', true, 'W3 S8.');
  T('L13', 'Time can be an actor.', true, 'W3 S8: time or a time-based event.');
  T('L13', 'An actor represents one specific person, so each user needs their own actor.', false, 'An actor is a role a user plays (W3 S9).', 'An actor is a role; many people can play it, and one person can play several.');
  T('L13', 'Use cases should be drawn outside the system boundary.', false, 'Use cases go inside; actors outside (W3 S14).', 'Use cases are inside the boundary; actors are outside it.');
  W('L13', 'explain', 'Explain how to identify actors for a use case diagram, using the guidance on W3 S21.', 'Look for external objects that produce or consume data: they must be sources or destinations of data and must be external to the system. They can be humans, machines, external systems, sensors and organisational units. Things inside the system, such as its own database or printer, are not actors.', ['Produce or consume data', 'Must be external', 'Lists kinds of actor', 'Database or printer excluded'], 4);
  W('L13', 'define', 'Define a use case and state how it must be named.', 'A use case is a summary of scenarios for a single task or goal (W3 S10); it captures a user-visible function and achieves a discrete goal for the user (S6). It must be named with a verb expressing something happening, such as process, add, update or record.', ['Summary of scenarios for one goal', 'Discrete goal or measurable value to an actor', 'Named with a verb'], 3);

  /* ---------- L14 ---------- */
  M('L14', 'The «include» arrow is drawn:', ['From the included use case to the base', 'From the base use case to the included one', 'From the actor to the use case', 'Without an arrowhead'], 1, 'W3 S32.');
  M('L14', 'The «extend» arrow is drawn:', ['From the base to the extension', 'From the extension to the base', 'Between two actors', 'From the actor to the boundary'], 1, 'W3 S35.');
  M('L14', '"Every time a customer transfers money, the system updates both account balances." The relationship is:', ['Extend', 'Include', 'Generalisation', 'Association'], 1, 'Mandatory behaviour every time: include (W3 S33).');
  M('L14', '"A customer may request a gift receipt when buying." The relationship between Request gift receipt and Buy item is:', ['Include, from Buy item', 'Extend, from Request gift receipt to Buy item', 'Generalisation', 'Association'], 1, 'Optional: extend, arrow from the extension to the base.');
  M('L14', 'In actor generalisation, the hollow triangle touches:', ['The child actor', 'The parent actor', 'The use case', 'The boundary'], 1, 'W3 S25 to S27.');
  T('L14', 'Include relationships may be drawn between an actor and a use case.', false, 'Include is only between use cases, never actors (W3 S32 notes).', 'Include links two use cases only.');
  T('L14', 'Include represents mandatory functionality.', true, 'W3 S32 notes.');
  T('L14', 'A child actor inherits all the use cases of its parent actor.', true, 'W3 S29.');
  T('L14', 'The slides call the include relationship "uses" as well.', true, 'W3 S23 to S24.');
  T('L14', 'Extend is used to factor out behaviour that two use cases always share.', false, 'That is include. Extend adds optional behaviour (W3 S32, S35).', 'Include factors out shared mandatory behaviour; extend adds optional behaviour.');
  W('L14', 'compare', 'Compare «include» and «extend» relationships, including arrow direction and an example of each.', 'Include: the base use case always includes the other’s functionality; mandatory, shared, only between use cases; dashed arrow from base to included; e.g. Make appointment includes Check patient record (W3 S32). Extend: optional functionality added to a base; dashed arrow from extension to base; e.g. Exam-grade appeal extends Exam copy request (S35, S37).', ['Include mandatory/shared', 'Include direction', 'Extend optional', 'Extend direction', 'Example of each'], 6);
  W('L14', 'explain', 'W3 S30 draws "Withdraw from savings" as a generalisation of "Withdraw money"; W3 S36 draws it as an extend. Explain what each version says and which you would choose.', 'Generalisation says withdrawing from savings is a kind of withdrawal: the child inherits the parent’s behaviour and may add to or override it. Extend says it is an optional addition to the basic withdrawal. Either is defensible; choose generalisation if every withdrawal must be from one specific account type, and extend if a basic withdrawal exists and the account-specific steps are optional variations. State the choice beside the diagram.', ['Generalisation meaning', 'Extend meaning', 'A justified choice'], 4);

  /* ---------- L15 ---------- */
  M('L15', 'Which field of a use case narrative lists the normal step-by-step interaction?', ['Precondition', 'Typical course of events', 'Postcondition', 'Business rules'], 1, 'W7-8 S34.');
  M('L15', 'Which is a disadvantage of use case relationships on W3 S43?', ['They improve communication', 'They may introduce complexity to the diagram', 'They identify redundancy', 'They are quick to draw'], 1, '');
  T('L15', 'Use case diagrams should stimulate discussion with people outside the development team.', true, 'W3 S42.');
  T('L15', 'A use case narrative replaces the use case diagram.', false, 'The narrative describes each use case’s steps in addition to the diagram (W7-8 S25).', 'The narrative adds detail to each use case; the diagram is still needed.');
  T('L15', 'A system analysis use case is free of most implementation details.', true, 'W7-8 S32.');
  W('L15', 'explain', 'List six fields of a use case narrative and say what each contains.', 'Use case name and ID; actors (primary and participating); description; precondition (true before it starts); trigger; typical course of events (normal steps); alternate courses (variations); postcondition (true after); business rules; assumptions and open issues. (W7-8 S34 to S35)', ['Six valid fields', 'Correct content for each'], 6);
})(window.BOOK);
