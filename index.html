  /* ---------- L16 ---------- */
  M('L16', 'In a relational database, a table is also called a:', ['Record', 'Relation', 'Field', 'Domain'], 1, 'W4-5 S10.');
  M('L16', 'A single row in a table is a:', ['Field', 'Record', 'Data type', 'Key'], 1, 'W4-5 S8.');
  M('L16', 'Which breaks the "atomic" rule for relations?', ['A Price field holding 4.99', 'A Name field holding "Sarah"', 'A Phones field holding "0207 111, 0770 222"', 'A Date field holding 17/11/2026'], 2, 'Each cell must hold a single value (W4-5 S12).');
  M('L16', 'Software that manages the database is the:', ['DFD', 'DBMS', 'ERD', 'CRM'], 1, 'W4-5 S5.');
  T('L16', 'All rows in a relation must be distinct.', true, 'W4-5 S13.');
  T('L16', 'A database must be electronic.', false, 'The slides give non-electronic examples: billing receipts and a cabinet of application forms (W4-5 S4).', 'Databases can be non-electronic, such as a filing cabinet.');
  T('L16', 'A field is a column in a table and has a data type.', true, 'W4-5 S9.');
  T('L16', 'The data dictionary is the collection of all the data types: the logical structure of the database.', true, 'W4-5 S9 notes.');
  W('L16', 'explain', 'State the four characteristics of relations.', '1 The content of the table changes over time (data added, updated, deleted). 2 Each attribute is atomic: one value per cell. 3 All rows are distinct. 4 One field uniquely identifies each row: the primary key. (W4-5 S12 to S13)', ['Content changes over time', 'Atomic attributes', 'Distinct rows', 'Primary key identifies each row'], 4);
  W('L16', 'define', 'Define table, record and field, using the Customer table example.', 'Table: a set of records with the same set of fields (Customer). Record: a set of fields about one related item, a row (customer 1, Fadi, London…). Field: one single item of data, a column, with a data type (Address, Text(50)). (W4-5 S8 to S9)', ['Table', 'Record as a row', 'Field as a column with a data type'], 3);

  /* ---------- L17 ---------- */
  M('L17', 'A foreign key is:', ['A key from another country’s database', 'A field that is the primary key in another table', 'Any unique field', 'A field that cannot be null'], 1, 'W4-5 S16.');
  M('L17', 'In a one-to-many relationship between Customer and Order, the foreign key goes in:', ['Customer', 'Order', 'Both', 'Neither'], 1, 'The many side holds the foreign key.');
  M('L17', 'Entity integrity means:', ['Foreign keys must exist in the parent table', 'Primary keys cannot repeat or be null', 'Every table needs a foreign key', 'Attributes must be atomic'], 1, 'W4-5 S22.');
  M('L17', 'In BookLoan(LoanID, StudentID, ISBN, Date, Period, Penalty), the foreign keys are:', ['LoanID and Date', 'StudentID and ISBN', 'Only LoanID', 'Period and Penalty'], 1, 'W4-5 S20.');
  T('L17', 'A foreign key value must be unique in its table.', false, 'StudentID 2 appears twice in Bookloan because Martin has two loans (W4-5 S19).', 'A foreign key value can repeat; only primary keys must be unique.');
  T('L17', 'Referential integrity stops a foreign key pointing to a record that does not exist.', true, 'W4-5 S22.');
  T('L17', 'Copying a student’s name and address into every loan record causes duplication and errors.', true, 'W4-5 S18: Martin’s address change is not reflected in the loan records.');
  T('L17', 'If a table has two unique fields, both must be primary keys.', false, 'You choose one as the primary key (W4-5 S14); the other becomes an alternate key.', 'Choose one unique field as the primary key; the other is an alternate key.');
  W('L17', 'explain', 'Using the library example, explain why foreign keys are needed.', 'If Bookloan stores the student’s name, address and course, data is duplicated, redundant and error-prone: when Martin moves from Edinburgh to Glasgow, the loan records keep the old address. Storing only StudentID as a foreign key linked to Student’s primary key means the library always reads the current details from one place. (W4-5 S17 to S19)', ['Problem: duplication or redundancy', 'Martin’s address example or similar', 'Solution: FK linking to PK', 'Benefit: one up-to-date source'], 4);
  W('L17', 'compare', 'Compare entity integrity and referential integrity, with an example of a violation of each.', 'Entity integrity: primary keys cannot repeat or be null; violation: two students with StudentID 2, or a student with no ID. Referential integrity: a foreign key must match an existing primary key; violation: deleting Khalil (ID 3) while loan 102 still refers to StudentID 3. (W4-5 S22 to S24)', ['Entity integrity definition', 'Example violation', 'Referential integrity definition', 'Example violation'], 4);
  W('L17', 'scenario', 'Suggest a primary key for each: DVLA car registration, NHS patient records, a bank account, a mobile phone contract. For one, show where it becomes a foreign key.', 'Car registration: registration number. NHS: NHS number. Bank: account number (with sort code). Mobile: phone number or account number. Example: the NHS number appears as a foreign key in an Appointment table, linking each appointment to one patient. (Reflections 2 and 3, W4-5 S15, S21; answers are suggestions.)', ['Four sensible unique keys', 'One correct foreign key use explained'], 5);

  /* ---------- L18 ---------- */
  M('L18', 'Optionality specifies:', ['The maximum number of related instances', 'The minimum number of related instances', 'The primary key', 'The relationship name'], 1, 'W4-5 S31.');

(function (B) {

  M('L31', 'When decoding a use case diagram, an «extend» arrow should point:', ['From the base use case to the optional one', 'From the optional use case to the base use case', 'From the actor to the use case', 'Either way'], 1, 'Extend points from the extension to the base. W3 S35.');

    ['Booking database is an internal store, not an actor', '«include» points the wrong way: Book tickets → Validate payment', '«extend» points the wrong way: Apply voucher → Book tickets', '“Store booking” is an internal step, not a user goal, and has no actor who wants it'], null);

  W('L32', 'scenario', 'Handout 2: a website selling home medical test kits closed after a year with a £60,000 loss. Identify four points where someone should have raised the alarm, naming the SDLC phase for each.', 'Planning/economic: no market or demand check (20 kits sold). Planning/organisational: customer trust in home kits never tested. Planning/legal: liability for wrong results found too late. Analysis: one vague requirement, no functional or nonfunctional requirements elicited. Project management: no budget checkpoints before the money ran out.', ['Market/demand', 'Customer trust', 'Legal liability', 'Vague requirements', 'Budget control'], 6);
  W('L32', 'scenario', 'Handout 4 Case Study 7: more phones are posted than customers are entitled to, CCTV shows no theft, and postings match the emails exactly. What is the most likely cause, and how would you fix it?', 'Extra emails are being sent: when a customer changes or cancels an upgrade, a new dispatch email is generated but the original is not cancelled, so two phones go out. Fix: add Change order and Cancel order use cases that update one order record, give each order an ID, and dispatch against order IDs rather than emails.', ['Extra emails, not theft', 'Change/cancel creates a second request', 'Single order ID', 'Missing use cases'], 6);

  M('L34', 'Which question does economic feasibility answer?', ['Can we build it?', 'Should we build it?', 'Will they use it?', 'When will it be finished?'], 1, '8e Ch 1: technical = can we; economic = should we; organisational = will they come.');

  W('L35', 'compare', 'Compare system prototyping and throwaway prototyping.', 'System prototyping: analysis, design and implementation run together on a quick working version that evolves into the final system; fast, good when users cannot state requirements, but weak analysis can cause design flaws. Throwaway prototyping: thorough analysis, then design prototypes to explore risky or unclear issues, discarded before the real build; slower but more stable and reliable.', ['Evolves vs discarded', 'Speed', 'Analysis depth', 'Stability'], 6);

  /* ---------- Use case ---------- */

  /* ---------- ERD (crow's foot) ---------- */
  function erdEnd(P, u, kind) {

        const m = /^(PK,FK|PK FK|PK|FK)\s+(.*)$/.exec(a), yy = y + 42 + i * 17;

  /* ---------- DFD (lecturer's notation: oval external entity, numbered process box, open data store) ---------- */
  function dfd(s) {
    const W = s.w || 680, H = s.h || 380, N = {}; let out = '';
    (s.paths || []).forEach(([d, k]) => { out += `<path d="${d}" class="${k || 'ln'}"/>`; });
    (s.tx || []).forEach(([x, y, tx, k]) => { out += text(x, y, tx, { cls: k || 't xs' }); });

  /* ---------- Class diagram ---------- */
  function cls(s) {
    const W = s.w || 680, H = s.h || 380, N = {}; let out = '';
    (s.c || []).forEach(([id, x, y, name, attrs, meths, w, hl]) => {

  /* ---------- Generic boxes / flow ---------- */
  function box(s) {

    (s.n || []).forEach(([id, x, y, w, h, label, shape, kls]) => {

    (s.e || []).forEach(([a, b, label, o]) => {
      o = o || {};

  /* ---------- System sequence diagram ---------- */
  function seq(s) {

      out += `<rect x="${x}" y="${y}" width="${w}" height="${h}" class="frame"/><path d="M${x} ${y + 18} H${x + 34} L${x + 42} ${y + 10} V${y}" class="ln thin"/>` + text(x + 19, y + 9, tag, { cls: 't xs', weight: 600 }) + (cond ? text(x + 50, y + 9, cond, { cls: 't xs', anchor: 'start' }) : '');
    });

      const x1 = X[a] + (X[b] > X[a] ? 5 : -5), x2 = X[b] + (X[b] > X[a] ? -5 : 5);
      out += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" class="ln${ret ? ' dash' : ''}"/>` + arrow([x2, y], [x2 > x1 ? 1 : -1, 0], !ret, 9) + text((x1 + x2) / 2, y - 9, label, { cls: 'lbl mono' });

  function wrap(W, H, body, kind, title) {

  function render(spec) {
    if (!spec) return '<p class="muted">Diagram missing.</p>';
    const t = spec.t;

  }

  /* Plain-text description of a spec, used when asking Claude to mark a student's drawing. */
  function describe(s) {
    const L = [];
    if (s.t === 'uc') {

      L.push('Use cases: ' + (s.u || []).map(u => u[3].replace(/\n/g, ' ')).join('; '));
      const nm = id => { const a = (s.a || []).find(x => x[0] === id) || (s.u || []).find(x => x[0] === id); return a ? a[3].replace(/\n/g, ' ') : id; };
      (s.l || []).forEach(([a, b, k]) => L.push({ as: 'Association: ', in: 'Include (base → included): ', ex: 'Extend (extension → base): ', ge: 'Generalisation (child → parent): ' }[k] + nm(a) + ' → ' + nm(b)));
    } else if (s.t === 'erd') {
      (s.e || []).forEach(e => L.push('Entity ' + e[3] + ': ' + (e[4] || []).join(', ')));
      const nm = id => ((s.e || []).find(x => x[0] === id) || [0, 0, 0, id])[3];
      const E = { '1': 'one and only one', '01': 'zero or one', '1n': 'one or many', '0n': 'zero or many', n: 'many' };
      (s.r || []).forEach(([a, b, ea, eb, lab]) => L.push(`Relationship "${lab || ''}": ${nm(a)} end = ${E[ea]}, ${nm(b)} end = ${E[eb]}`));
    } else if (s.t === 'dfd') {
      L.push('External entities: ' + (s.x || []).map(x => x[3].replace(/\n/g, ' ')).join('; '));
      L.push('Processes: ' + (s.p || []).map(p => p[3] + ' ' + p[5].replace(/\n/g, ' ')).join('; '));
      L.push('Data stores: ' + (s.s || []).map(d => d[3] + ' ' + d[4]).join('; '));
      const nm = id => { const a = [...(s.x || []), ...(s.p || []), ...(s.s || [])].find(x => x[0] === id); if (!a) return id; return (a.length >= 6 && s.p.includes(a)) ? a[3] + ' ' + a[5].replace(/\n/g, ' ') : String(a[3]).replace(/\n/g, ' ') + ((s.s || []).includes(a) ? ' ' + a[4] : ''); };
      (s.f || []).forEach(([a, b, lab]) => L.push(`Flow "${(lab || '').replace(/\n/g, ' ')}": ${nm(a)} → ${nm(b)}`));
    } else if (s.t === 'cls') {
      (s.c || []).forEach(c => L.push('Class ' + c[3] + ' | attributes: ' + (c[4] || []).join(', ') + ' | methods: ' + (c[5] || []).join(', ')));
      const nm = id => ((s.c || []).find(x => x[0] === id) || [0, 0, 0, id])[3];
      const K = { as: 'Association', ge: 'Generalisation (child → parent)', ag: 'Aggregation (part → whole, hollow diamond at whole)', co: 'Composition (part → whole, filled diamond at whole)', de: 'Dependency' };
      (s.r || []).forEach(([a, b, k, ma, mb, lab]) => L.push(`${K[k]}: ${nm(a)} [${ma || ''}] → ${nm(b)} [${mb || ''}]${lab ? ' "' + lab + '"' : ''}`));
    }
    return L.join('\n');
  }

  G.DG = { render, describe };
})(window);

<script>
/* CN7039 Exam Book: page engine, quizzes, flashcards, daily challenge, saving, Claude marking. */
(function () {
  'use strict';

  function todayN() { const now = new Date(); const t = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()); return Math.floor((t - START) / 864e5) + 1; }

  const LESSON = {}; B.lessons.forEach((l, i) => { l.n = i + 1; LESSON[l.id] = l; });
  const PART = {}; B.parts.forEach(p => PART[p.id] = p);
  const CASE = {}; B.cases.forEach((c, i) => { c.n = i + 1; CASE[c.id] = c; });
  const QB = {}; B.bank.forEach(q => QB[q.id] = q);
  const CARD = {}; B.cards.forEach(c => CARD[c.id] = c);
  const TYPE = { mcq: 'Multiple choice', tf: 'True or false', define: 'Define', explain: 'Explain', compare: 'Compare', scenario: 'Scenario', error: 'Spot the errors', draw: 'Draw' };
  const MARKS = { mcq: 2, tf: 2, define: 3, explain: 4, compare: 6, scenario: 6, error: 10, draw: 10 };

  /* ---------------- Saving ---------------- */
  const S = { data: { v: 1, cards: {}, ans: {}, days: {}, studied: {}, cleared: {}, last: null }, ref: null, busy: false, pending: false, timer: 0 };
  function merge(remote) {

      const R = remote[k] || {}, L = S.data[k] = S.data[k] || {};

    });

  }
  function loadLocal() { try { const r = localStorage.getItem(KEY); if (r) { const d = JSON.parse(r); S.data = Object.assign(S.data, d); } } catch (e) { } }
  function setSync(msg) { const el = $('#sync'); if (el) el.textContent = msg; }
  function save() {

    clearTimeout(S.timer); S.timer = setTimeout(push, 1200);
  }
  async function push() {
    if (!S.ref) return;
    if (S.busy) { S.pending = true; return; }
    S.busy = true;
    try { await S.ref.set(JSON.parse(JSON.stringify(S.data))); setSync('Saved to your account'); }
    catch (e) { setSync('Saved on this device'); if (e && e.code === 'invalid_argument') S.ref = null; }
    S.busy = false;
    if (S.pending) { S.pending = false; push(); }
  }
  async function connect() {
    if (!(window.claude && typeof claude.use === 'function')) { setSync('Saved on this device'); return; }
    const timer = setTimeout(() => setSync('Saved on this device for now'), 10000);
    try {
      const db = await claude.use('db');
      if (!db) { clearTimeout(timer); setSync('Saved on this device'); return; }
      const user = await claude.use('user'); const uid = user ? await user.id() : null;
      if (!uid) { clearTimeout(timer); setSync('Saved on this device'); return; }
      const ref = db.doc('data/users/' + uid + '/state');
      const snap = await ref.get();
      clearTimeout(timer);
      if (snap.exists) merge(snap.data());
      S.ref = ref; setSync('Progress syncs to your account');
      try { localStorage.setItem(KEY, JSON.stringify(S.data)); } catch (e) { }
      refreshChrome();
    } catch (e) { clearTimeout(timer); setSync('Saved on this device'); }
  }
  function record(id, s, m) { S.data.ans[id] = { s, m, t: Date.now() }; save(); }

  /* ---------------- Claude marking ---------------- */
  const AI = { s: null, img: false };
  async function aiInit() {
    if (!(window.claude && typeof claude.use === 'function')) return;
    try { AI.s = await claude.use('sample'); } catch (e) { AI.s = null; }
    if (AI.s) {
      document.body.classList.add('has-ai');
      try { const l = await AI.s.limits(); AI.img = !!(l && l.images); if (AI.img) document.body.classList.add('has-ai-img'); } catch (e) { }
    }
  }
  async function aiMark(o) {
    const prompt = [
      'You are an examiner marking a practice answer for the University of East London module CN7039 Software Engineering (systems analysis and design).',
      'Mark strictly against the marking points. Award a mark only where the student states the point clearly, in their own words or with correct technical terms. Use UK English.',
      `Question (${o.max} marks): ${o.question}`,

      o.image ? 'The student has attached a photo of a hand-drawn diagram. Read it carefully, then judge notation as well as content.' : '',
      'Student answer:\n"""' + (o.answer || '(no written answer)') + '"""',
      `Reply with JSON only, no prose around it: {"score": <integer 0-${o.max}>, "feedback": "<2-4 sentences: what earned marks, what was missing or wrong, how to reach full marks>", "missing": ["<technical term or point the student missed>"]}`
    ].filter(Boolean).join('\n\n');
    const opts = { modelTier: 'default' };

  function aiBox(container, o, onScore) {

  }

  /* ---------------- Question widget ---------------- */
  function selfMarkRow(max, onPick, label) {

  }
  function qWidget(q, ctx) {
    ctx = ctx || {};
    const max = ctx.marks != null ? ctx.marks : (q.m || MARKS[q.t] || 2);
    const el = h(`<section class="q" id="q-${q.id}"><header class="q-h"><span class="q-n">${ctx.num != null ? ctx.num : ''}</span><span class="q-type">${TYPE[q.t] || ''}</span><span class="q-m">${max} mark${max === 1 ? '' : 's'}</span><span class="q-src">${esc(LESSON[q.l] ? 'Lesson ' + LESSON[q.l].n : '')}</span></header><div class="q-stem">${q.q}</div></section>`);

    const score = s => { el.dataset.score = s; const b = $('.q-got', el) || el.querySelector('.q-h').appendChild(h('<span class="q-got"></span>')); b.textContent = s + ' / ' + max; record(q.id, s, max); if (ctx.onScore) ctx.onScore(q.id, s, max); };
    const prev = ctx.prev; if (prev != null) { el.querySelector('.q-h').appendChild(h(`<span class="q-got">${prev} / ${max}</span>`)); }

        const b = h(`<button type="button" class="opt"><span class="ol">${'ABCDEF'[i]}</span><span>${o}</span></button>`);
        b.addEventListener('click', () => {
          if (ol.dataset.done) return; ol.dataset.done = 1;

          if (i !== q.a) b.classList.add('wrong');
          el.appendChild(h(`<div class="explain"><b>${i === q.a ? 'Correct.' : 'Not quite. The answer is ' + 'ABCDEF'[q.a] + '.'}</b> ${q.x || ''}</div>`));
          score(i === q.a ? max : 0);
        });
        ol.appendChild(b);
      });
      el.appendChild(ol);
      return el;
    }
    if (q.t === 'tf') {
      const box = h(`<div class="tf"><div class="tf-btns"><button type="button" class="opt tfb" data-v="1">True</button><button type="button" class="opt tfb" data-v="0">False</button></div><label class="lbl-sm" for="j-${q.id}-${ctx.k || ''}">Your justification</label><textarea id="j-${q.id}-${ctx.k || ''}" rows="2" placeholder="Why? Use the technical term."></textarea><button type="button" class="btn check">Check</button></div>`);
      let pick = null;
      $$('.tfb', box).forEach(b => b.addEventListener('click', () => { $$('.tfb', box).forEach(x => x.classList.remove('on')); b.classList.add('on'); pick = b.dataset.v === '1'; }));
      $('.check', box).addEventListener('click', () => {
        if (pick === null) { $('.check', box).insertAdjacentElement('afterend', h('<p class="warn small">Choose True or False first.</p>')); return; }
        if (box.dataset.done) return; box.dataset.done = 1;
        const right = pick === q.a, sel = right ? Math.ceil(max / 2) : 0;
        $$('.tfb', box).forEach(x => { x.disabled = true; if ((x.dataset.v === '1') === q.a) x.classList.add('right'); else if (x.classList.contains('on')) x.classList.add('wrong'); });
        const ex = h(`<div class="explain"><b>${q.a ? 'True.' : 'False.'}</b> ${q.x || ''}${q.fix ? `<p class="fix"><b>Corrected:</b> ${q.fix}</p>` : ''}</div>`);
        box.appendChild(ex);
        const jmax = max - Math.ceil(max / 2);
        let total = sel; score(total);
        if (jmax > 0) {
          const just = $('textarea', box).value.trim();
          const row = selfMarkRow(jmax, v => score(sel + v), 'Justification mark:');
          box.appendChild(row);
          if (AI.s && just) {
            const b = h('<button type="button" class="btn ghost ai-only">Mark my justification with Claude</button>');
            const run = aiBox(box, { max: jmax, question: 'True or false, with justification: ' + q.q.replace(/<[^>]+>/g, ''), model: (q.a ? 'TRUE. ' : 'FALSE. ') + (q.x || '').replace(/<[^>]+>/g, '') }, v => score(sel + v));

    }
    // written, error and drawing questions
    const isDraw = q.t === 'draw', isErr = q.t === 'error';
    const area = h(`<div class="written"><label class="lbl-sm" for="a-${q.id}-${ctx.k || ''}">${isDraw ? 'Draw it on paper first. Then describe it here or add a photo.' : isErr ? 'List every error you can find, one per line.' : 'Your answer'}</label><textarea id="a-${q.id}-${ctx.k || ''}" rows="${isDraw || isErr ? 5 : 4}"></textarea>${isDraw || isErr ? `<div class="upl ai-img-only"><label class="btn ghost" for="f-${q.id}-${ctx.k || ''}">Add a photo of your drawing</label><input id="f-${q.id}-${ctx.k || ''}" type="file" accept="image/*" hidden><span class="fname muted"></span></div>` : ''}<div class="row"><button type="button" class="btn ai-only mark">Mark with Claude</button><button type="button" class="btn ghost show">Show model answer</button></div></div>`);
    el.appendChild(area);
    let file = null;
    const fi = $('input[type=file]', area);
    if (fi) fi.addEventListener('change', () => { file = fi.files && fi.files[0]; $('.fname', area).textContent = file ? file.name : ''; });
    const model = isErr ? (q.errs || []).map((e, i) => (i + 1) + '. ' + e).join('\n') : isDraw ? (q.x || '') + (q.ans ? '\n\nModel diagram:\n' + DG.describe(typeof q.ans === 'string' ? B.dg[q.ans] : q.ans) : '') : (q.x || '');
    const run = aiBox(area, { max, question: q.q.replace(/<[^>]+>/g, '') + (q.dg && (isErr) ? '\n\nThe diagram given to the student:\n' + DG.describe(typeof q.dg === 'string' ? B.dg[q.dg] : q.dg) : ''), points: q.pts, model: model.replace(/<[^>]+>/g, ' ') }, v => score(v));

        m.appendChild(h('<p class="small muted">Tick each error you found. Each is worth an equal share of the marks.</p>'));
        const ul = h('<ul class="checks"></ul>');
        (q.errs || []).forEach((e, i) => { const li = h(`<li><label><input type="checkbox"> <span>${e}</span></label></li>`); ul.appendChild(li); });
        m.appendChild(ul);
        ul.addEventListener('change', () => { const n = $$('input:checked', ul).length; score(Math.round(max * n / (q.errs.length || 1))); });
        if (q.fix) { const fig = h('<figure><figcaption>Corrected diagram</figcaption></figure>'); fig.insertAdjacentHTML('afterbegin', DG.render(typeof q.fix === 'string' ? B.dg[q.fix] : q.fix)); m.appendChild(fig); }

  }

  /* ---------------- Flashcards ---------------- */
  const RATE = { again: { p: 0, label: 'Again', hint: 'Forgot' }, hard: { p: 0.5, label: 'Hard', hint: 'Partly' }, good: { p: 1, label: 'Good', hint: 'With effort' }, easy: { p: 1, label: 'Easy', hint: 'Instant' } };
  const GAP = [0, 1, 2, 4, 7, 12, 20];
  function rateCard(id, r) {
    const t = Math.max(1, todayN()), c = S.data.cards[id] || { b: 0, n: 0 };
    c.n++; c.r = r; c.t = Date.now();

    else if (r === 'hard') { c.b = Math.max(1, c.b); c.due = t + 1; }
    else if (r === 'good') { c.b = Math.min(6, c.b + 1); c.due = t + GAP[c.b]; }
    else { c.b = Math.min(6, c.b + 2); c.due = t + GAP[c.b] + 2; }
    S.data.cards[id] = c; save();
  }
  function cardSession(ids, opts) {
    opts = opts || {};
    const wrap = h('<div class="deck"></div>');
    let i = 0; const got = {}, rated = {};
    const draw = () => {
      wrap.innerHTML = '';

      }

      const card = h(`<div class="fc"><div class="fc-top"><span>Card ${i + 1} of ${ids.length}</span><span>${LESSON[c.l] ? 'Lesson ' + LESSON[c.l].n + ' · ' + esc(LESSON[c.l].title) : ''}</span></div>
        <div class="fc-inner"><div class="fc-face fc-front"><p class="fc-term">${c.f || esc(c.term)}</p><p class="muted small">Say or type the answer, then reveal it.</p><label class="lbl-sm" for="fa-${c.id}">Your attempt (optional)</label><textarea id="fa-${c.id}" rows="2"></textarea><button type="button" class="btn reveal">Reveal answer</button></div>

      $$('.rate', card).forEach(b => b.addEventListener('click', () => { const r = b.dataset.r; rateCard(c.id, r); got[c.id] = RATE[r].p; rated[c.id] = r; if (opts.onPoint) opts.onPoint(c.id, RATE[r].p); i++; draw(); }));
      wrap.appendChild(card);
    };
    draw();
    return wrap;
  }
  function dueCards(pool, n, today) {
    const due = [], fresh = [], later = [];
    pool.forEach(id => { const c = S.data.cards[id]; if (!c) fresh.push(id); else if ((c.due || 0) <= today) due.push(id); else later.push(id); });
    due.sort((a, b) => (S.data.cards[a].b - S.data.cards[b].b));
    return due.concat(fresh, later.sort((a, b) => S.data.cards[a].due - S.data.cards[b].due)).slice(0, n);
  }

  /* ---------------- Daily plan helpers ---------------- */
  function seeded(n) { let a = n * 9301 + 49297; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function shuffle(arr, rnd) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function coveredLessons(n) { const s = new Set(); B.plan.filter(p => p.d <= n).forEach(p => (p.read || []).forEach(l => s.add(l))); return s; }
  function pickQs(n, types, count, salt) {

    const W = 680, H = 200, L = 30, Bm = 30, T = 18, iw = W - L - 10, ih = H - T - Bm, mx = Math.max(1, ...vals), bw = iw / vals.length;
    let s = '';
    vals.forEach((v, i) => { const bh = ih * v / mx, x = L + i * bw + 6; s += `<rect x="${x.toFixed(1)}" y="${(T + ih - bh).toFixed(1)}" width="${(bw - 12).toFixed(1)}" height="${bh.toFixed(1)}" rx="2" class="${i === 0 ? 'track2' : 'bar'}"/><text x="${(x + (bw - 12) / 2).toFixed(1)}" y="${(T + ih - bh - 7).toFixed(1)}" class="t xs" text-anchor="middle">${v}</text><text x="${(x + (bw - 12) / 2).toFixed(1)}" y="${H - 10}" class="t xs" text-anchor="middle">${labels[i]}</text>`; });
    return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${s}</svg><figcaption>${esc(title)}</figcaption>`;
  }

  /* ---------------- Chrome: contents drawer, keys, swipe ---------------- */
  function buildToc() {
    const d = $('#toc-body'); let s = '';
    const groups = [['Front matter', p => ['cover', 'how', 'contents', 'calendar'].includes(p.id)]];
    B.parts.forEach(pt => groups.push([pt.title, p => (p.kind === 'lesson' && p.l.part === pt.id && p.k === 0) || p.id === 'part-' + pt.id.toLowerCase()]));
    groups.push(['Four-diagram stories', p => p.kind === 'case' && p.v === 'story']);
    groups.push(['Question bank', p => p.kind === 'bank']);
    groups.push(['Flashcards and glossary', p => p.kind === 'deck' || p.kind === 'gloss']);
    groups.push(['Daily workbook', p => p.kind === 'day' || p.id === 'progress']);
    groups.forEach(([g, fn]) => { s += `<details${g === 'Front matter' ? ' open' : ''}><summary>${esc(g)}</summary><ul>` + PAGES.filter(fn).map(p => `<li><a href="#${p.id}" data-go="${p.id}">${p.kind === 'lesson' && S.data.studied[p.l.id] && S.data.studied[p.l.id].on ? '<span class="tick" aria-label="studied">✓</span> ' : ''}${esc(p.kind === 'lesson' ? 'Lesson ' + p.l.n + ' · ' + p.title : p.kind === 'case' ? 'Story ' + p.c.n + ' · ' + p.title : p.title || 'Cover')}</a><span>${p.i + 1}</span></li>`).join('') + '</ul></details>'; });
    d.innerHTML = s;
    $$('a[data-go]', d).forEach(a => a.addEventListener('click', e => { e.preventDefault(); goId(a.dataset.go); }));
  }
  function openToc() { buildToc(); $('#toc').hidden = false; $('#toc').classList.add('open'); $('#toc-close').focus(); }
  function closeToc() { const t = $('#toc'); if (t) { t.classList.remove('open'); t.hidden = true; } }
  function goToday() { const t = todayN(); goId('day-' + Math.max(1, Math.min(DAYS, t))); }
  function refreshChrome() { const p = PAGES[cur]; if (p && (p.kind === 'calendar' || p.kind === 'progress' || p.kind === 'deck')) go(cur, { noHash: true, keepScroll: true }); }

  function init() {
    loadLocal();
    buildPages(); buildToc();
    $('#prev').addEventListener('click', () => go(cur - 1));
    $('#next').addEventListener('click', () => go(cur + 1));
    $('#btn-toc').addEventListener('click', openToc);
    $('#toc-close').addEventListener('click', closeToc);
    $('#btn-today').addEventListener('click', goToday);
    $('#btn-deck').addEventListener('click', () => goId('deck'));
    $('#btn-bank').addEventListener('click', () => goId('part-bank'));
    $('#btn-prog').addEventListener('click', () => goId('progress'));
    $('#btn-books').addEventListener('click', () => goId('part-p7'));
    updCount(); setInterval(updCount, 60000);
    document.addEventListener('keydown', e => {
      if (e.target.closest('input,textarea,select,button')) return;
      if (e.key === 'ArrowRight') go(cur + 1); else if (e.key === 'ArrowLeft') go(cur - 1); else if (e.key === 'Escape') closeToc();
    });
    let sx = null, sy = null;
    $('#page').addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
    $('#page').addEventListener('touchend', e => { if (sx == null) return; const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 2 && !e.target.closest('.fc,.opts,textarea')) go(cur + (dx < 0 ? 1 : -1)); sx = null; }, { passive: true });
    window.addEventListener('hashchange', () => { const id = location.hash.slice(1); const p = pageById(id); if (p && p.i !== cur) go(p.i, { noHash: true }); });
    const id = location.hash.slice(1);
    const start = pageById(id) || pageById(S.data.last) || PAGES[0];
    go(start.i, { noHash: !pageById(id) });
    connect(); aiInit();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
